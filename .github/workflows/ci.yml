name: Coding harness checks
on:
  push:
    branches: [development, main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,tui]'
      - run: python -m pytest
      - run: python -m build
      - name: Check installed core wheel outside checkout
        shell: python
        run: |
          import pathlib, subprocess, sys, tempfile, venv
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          with tempfile.TemporaryDirectory() as directory:
              root = pathlib.Path(directory)
              venv.create(root / 'env', with_pip=True)
              python = root / 'env' / ('Scripts/python.exe' if sys.platform == 'win32' else 'bin/python')
              subprocess.run([str(python), '-m', 'pip', 'install', str(wheel)], check=True)
              for flag in ['--help', '--version']:
                  subprocess.run([str(python), '-m', 'mythic_agent.cli', flag], cwd=root, check=True)
              script = 'from mythic_agent.resources import character_directory, engineering_protocol; assert len(list(character_directory().glob("*.md"))) == 9; assert "Mythic Engineering" in engineering_protocol()'
              subprocess.run([str(python), '-c', script], cwd=root, check=True)
