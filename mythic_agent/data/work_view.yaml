schema: mythic.work_view/1
slice: M-172
part: 8
part_title: The Beautiful Face
canon_note: 'Streaming Work View: the coder actions stream as a calm narrative - reading, editing
  auth.py, running tests - with tool detail one keystroke away, never in the face. An event stands
  for one coder action, named by its event id alone in the stream: its kind in the closed kind set,
  the target it touches, the tool that carries it, the tool detail it holds back, its state - started,
  done or failed - and its provenance whole (the day it happened, who acted, its source and the session
  it happened in). The narrative line is derived, never chosen: a started action speaks in the present
  with an ellipsis, a done action in the past, a failed action as could-not - and the tool detail never
  crosses into the narrative, the panel or the verdict; it is shown only on the detail road, one
  keystroke away. The work panel is derived from the whole book: its rows are the events in stream
  order carrying their derived narrative lines, its totals are the events own counts by kind and by
  state, its current event is the last action still standing started, and a stored panel that disagrees
  with its derived shape is refused. The work verdict is derived for the whole book: troubled while any
  action stands failed, working while any action still stands started, and calm while every action
  stands done. This file is ONE EXAMPLE BOOK, in the shape a real book file takes: the M-171 slice
  boundary - six actions of the charter day, the shipped screens read, the kindness rules searched,
  the charter data written, the charter module edited and its tests run green, with the verdict check
  still standing started as the day turns. A real book is a new file in this same shape - it is never
  this file edited in place. This layer holds actions as data only - it runs no tool, streams nothing
  live, sends nothing, posts nothing, schedules nothing, calls no model and persists nothing.'
