gate_note: |
  The Part X gate: one campaign slice executed across bridges -
  issue from a host, build locally, PR raised, stand-up posted
  to Samtal - with credentials never leaving Kista. The exercise
  is the walk itself: a single campaign slice stands in the
  roadmap's own record walked across the bridges in held order
  (issue, build, PR, stand-up) through the shipped pure roads
  the bridges themselves ship - the issue arriving across the
  Samverk bridge exchange (M-242), the build standing on the
  local MCP client road (M-233), the PR raised under the Kista
  key-keeper's own road (M-244), the slice whose whole charge
  is that credentials are named by ref and never leave Kista,
  and the stand-up posted across the Samtal bridge (M-243) -
  and every bridge layer M-233 to M-253 stands in its own
  shipped module under its own slice constant. No stage is
  faked or stubbed: no host API is called, no issue is
  fetched, no PR is raised, no stand-up is posted and no
  credential is read out of Kista by the gate itself; the
  walk is a data-level re-proof over records that already
  stand banked.
