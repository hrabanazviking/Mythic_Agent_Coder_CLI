schema: mythic.command_palace/1
slice: M-176
part: 8
part_title: The Beautiful Face
canon_note: 'The Slash-Command Palace: every command discoverable from / with a plain-language description
  and an example, and custom commands (Part X skills) joining the same palace on the same terms. An entry
  is one command held as data - its kind (shipped or custom), its command in the shape the surfaces speak,
  its plain words, one example of its use and its tags, each held with its provenance whole. A browse is
  the words typed after /, read into tokens by the shipped M-175 picker''s one token road, and an entry''s
  score under a browse is derived from those tokens against the entry''s own command, tags, description and
  example - never stored, never ranked by hand. A kind filter narrows which entries stand in a browse,
  never how they are judged. A custom command is first held as its own record, judged whole - its template
  held as data, never rendered or run - and joins the palace as an entry of the custom kind. The M-171
  charter judged the subagent picker modal (its S-06 row) KEEP and names M-176, beside M-175, among its
  owning slices: the heading takes plain words first (its K-01 judgement strains), and the auto-dismiss on
  change is re-judged here (its K-09 judgement strains) - in the palace''s own shape browsing commits no
  choice at all and runs nothing at all, so there is nothing a browsing keystroke can commit or execute by
  accident. This file is ONE EXAMPLE BOOK, in the shape a real palace file takes: the M-175 slice boundary
  - eight entries, six shipped commands of the two surfaces and two custom commands of Part X standing
  beside them, two browses, and the one pinned panel of the session browse, whose shown entries span both
  kinds, so the book''s verdict under it stands spanning; under the picker browse the verdict stands
  shelved. A real book is a new file in this same shape - it is never this file edited in place. This layer
  holds entries and browses as data only - it executes nothing, renders no live UI, sends nothing, posts
  nothing, schedules nothing, calls no model and persists nothing: an entry held here is a finding, never
  the act of running the command found.'
