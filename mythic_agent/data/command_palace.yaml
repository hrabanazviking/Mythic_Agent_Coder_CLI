  account:
  - 'The command palace holds 8 commands as of 2026-11-09: the browse ''session'' under the all filter
    shows 4 of them: shipped 3, custom 1.'
  - Rows stand in derived order, best match first, so two panels of one browse diff cleanly, line by line.
  - Every score is derived from the browse's tokens against the entry's own command, tags, description and
    example - no score is stored on any entry, and no order is chosen by hand.
  - 'The palace''s words are plain words first, and a browse only ever looks: it runs no command it shows,
    renders no custom command''s template and changes no session.'
