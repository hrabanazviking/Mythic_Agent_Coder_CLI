    walked in the open and the evidence it honestly carries - and no judgement is stored on any connection.
  - 'Completeness is permitted from the held records alone: a connection that steps outside the connection
    sequence, carries a bare claim in place of held evidence, or has not discovered held stands open,
    discovered in its gaps, and the connection index is derived from the held connections, never stored
    where it could drift.'
