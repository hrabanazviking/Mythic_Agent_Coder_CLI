schema: mythic.tutorial_grown/1
slice: M-185
part: 8
part_title: The Beautiful Face
canon_note: 'The tutorial grown - interactive lessons per feature family, runnable inside a scratch repo;
  mythic tutorial becomes the manual you play. A lesson is held whole - under its title, its feature family
  in the closed vocabulary (providers, code intelligence, the editor''s hand, sandboxing, parallel crews,
  memory and context, plain language, bridges), its readiness, ready or blocked, and its detail. Readiness
  is never faked: a lesson whose exercise does not stand ready stands blocked and named in its gaps (exercise).
  Lessons run inside a scratch repo, never against the real workspace, and the rule stands as data in
  the layer: a record claiming a run outside a scratch repo or against the real workspace refuses by name.
  The play''s steps stand held in order - open, read, try, check, clean - and a play that cleans its scratch
  repo away before its exercise stands tried refuses by name. This file is ONE EXAMPLE BOOK, in the shape
  a real tutorial file takes - the M-184 slice boundary - six lessons and two views, five play steps and
  one scratch repo, with its one pinned panel of the every-lesson view, whose shown lessons stand four
  ready of six, so the book verdict under it stands strained; under the ready view, whose four shown lessons
  all stand ready, the verdict stands open. A real book is a new file in this same shape - it is never
  this file edited in place. This layer runs no lesson, opens no repo and writes nothing to any real workspace:
  it holds the grown tutorial as data and tells it.'
