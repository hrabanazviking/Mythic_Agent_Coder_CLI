schema: mythic.crew_members/1
slice: M-121
part: 6
part_title: Agents as files
casting_note: |
  The crew as data: every crew member is one record in this
  file - a name, an office (the shipped offices of
  mythic_agent/core/role_routing.py), a model route (null
  means the member rides the session default, exactly as the
  shipped role_routes config does today: it names no office),
  the tools the member works with (names from the shipped
  tool vocabulary), a posture (a shipped permission-profile
  id), and the character file that carries the member's
  voice, in default_agent_characters/. These eight records
  are the first castings: they are the existing characters,
  the same names DEFAULT_SUBAGENTS ships in code, now held
  as data. A new crew member is a new record in a file like
  this one - or a new file in this shape - never a code
  change. The character prose itself stays in the character
  files; this file names them, it does not copy them.
