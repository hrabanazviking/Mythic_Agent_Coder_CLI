  account:
  - 'The road book holds 5 roads as of 2026-11-11: the view ''all'' shows 5 of them: complete 3, open 2; 3 of the shown roads stand complete.'
  - Rows stand in held order, the order the book itself stands in, so two panels of one view diff cleanly, segment by segment.
  - Every segment is derived from its road's own fields - the slice it answers for, the steps it walked in the open and the evidence it honestly carries - and no judgement is stored on any road.
  - 'Completeness is mapped from the held records alone: a road that steps outside the road sequence, carries a bare claim in place of held evidence, or has not reached runnable stands open, named
    in its gaps, and the road index is derived from the held roads, never stored where it could drift.'
