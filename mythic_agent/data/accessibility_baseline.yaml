findings:
- id: F-01
  name: Muted text fails WCAG AA in every theme
  detail: 'The muted role (dim text, token counts, secondary hints) measures 2.35–2.76:1 in the
    dark themes and 3.87–4.29:1 in the light theme — below the 4.5:1 AA bar for normal text in
    all three, and below even the 3:1 large-text bar on surfaces in both dark themes. Anything
    shown only in muted text is effectively unreadable for low-vision users; Part VIII must
    darken muted (or lighten it on light) until it clears 4.5:1 on both backgrounds.'
  owner: 'Part VIII (M-199 re-runs this baseline as its gate)'
- id: F-02
  name: Viking_dark error colour fails even large-text contrast
  detail: 'viking_dark error (#a33b2e) measures 2.87:1 on background and 2.63:1 on surface —
    below the 3:1 large-text bar, let alone 4.5:1 normal. Error text in the default-adjacent
    Viking theme is the one place contrast matters most (approvals, failures); Part VIII must
    brighten it until it clears 4.5:1. Body text itself is fine everywhere (10.59–16.41:1).'
  owner: 'Part VIII (M-199 re-runs this baseline as its gate)'
- id: F-03
  name: Shortcut registry advertises TUI keys no screen binds
  detail: 'mythic_agent/ui/shortcuts.py lists 19 actions and docs/SHORTCUTS.md documents them,
    but a grep of mythic_agent/ui/ finds no action for help (f1), clear (ctrl+l), focus_input
    (ctrl+i), scroll_up/down, new_tab, next_tab, prev_tab, close_tab, command_palette (ctrl+k),
    or toggle_sidebar (ctrl+b). Either bind them or stop advertising them: a keyboard user who
    reads the docs and presses f1 gets nothing. Part VIII owns the fix and the registry/doc
    reconciliation.'
  owner: 'Part VIII (M-199 re-runs this baseline as its gate)'
- id: F-04
  name: NO_COLOR claimed but never read
  detail: 'mythic_agent/core/progress.py''s module docstring says both indicators "respect
    NO_COLOR / non-TTY", but the code checks only isatty() — no NO_COLOR lookup exists anywhere
    in the package (grep NO_COLOR finds only that docstring). The indicators emit no ANSI colour
    today, so the practical harm is small, but the claim is false and a user setting NO_COLOR
    gets no change at all. Part VIII either honours NO_COLOR (and the progress/spinner honours
    it for real) or corrects the docstring.'
  owner: 'Part VIII (M-199 re-runs this baseline as its gate)'
- id: F-05
  name: No alternative text for the portrait or the splash art
  detail: 'S-02 and S-03 above: the agent portrait (chat_screen #agent-image) and the splash
    screen''s block art carry no alt text, description, or skip path. Part VIII must give the
    portrait a text name (agent name + a short description, or mark it decorative and hide it
    from the buffer) and give the splash art a text equivalent or a skip, so a screen-reader
    user''s first seconds are not glyph noise.'
  owner: 'Part VIII (M-199 re-runs this baseline as its gate)'
- id: F-06
  name: No real screen-reader pass, no programmatic labels
  detail: 'S-04 and S-06 above: form labels are visual adjacency only (no programmatic
    association), the chat input relies on a placeholder, and no NVDA/JAWS/VoiceOver/Orca pass
    has ever been run. Part VIII must run that pass for real — a keyboard-only task plus a
    screen-reader task on the live TUI — and record its result as the new baseline; until then
    S-06 stays NOT PROVEN.'
  owner: 'Part VIII (M-199 re-runs this baseline as its gate)'
