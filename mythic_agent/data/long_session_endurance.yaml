schema: mythic.long_session_endurance/1
slice: M-161
part: 7
part_title: Memory & Context
canon_note: 'Long-session endurance: a 500-turn session stays responsive - journal and retrieval
  performance budgets set and measured. An endurance record is one measurement of one subject
  under one endurance kind, carried with its provenance whole: what was measured, the kind,
  the reference it stands under, the budget set for it against the value measured, who recorded
  it, the day it was recorded on, and where it was read from. A budget is set before it is
  measured: a record naming no budget refuses, because a measurement with no budget set first
  is a number, not an endurance claim. A measurement that exceeds its budget is reported over
  budget, never silently passed: the verdict is derived from the two figures, never stored.
  One thing is measured once per kind in a book: the same kind and reference named twice refuses.
  The ENDURANCE PANEL is derived from the whole book: its rows are the records carried whole,
  by kind - session length first, then journal appends, then retrieval, then responsiveness,
  then context size - then by subject, then record id, and its tallies are the records'' own
  verdict counts and its kind counts the records'' own tallies, and a stored panel that disagrees
  with its derived shape is refused. The ENDURANCE VERDICT is derived for the whole book:
  enduring when nothing stands over budget, strained when anything does, naming the worst
  overage. This file is ONE EXAMPLE BOOK, in the shape a real book file takes: the M-160 slice
  boundary - five measurements standing at the close of the token-thrift day, the session
  at its 500-turn budget, its journal appends fast, its graph retrieval fast, its late responsiveness
  honestly over its budget, and its carried context under its budget, with the one panel of
  the book. A real book is a new file in this same shape - it is never this file edited in
  place. This layer holds endurance as data only: it runs no live session, appends to no live
  journal, times no live retrieval, calls no model and persists nothing - a 500-turn figure
  stands here as a budget and a recorded measured value, never as a claim that a live 500-turn
  run happened in this layer.'
