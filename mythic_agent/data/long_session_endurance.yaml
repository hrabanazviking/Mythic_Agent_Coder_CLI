  account:
  - 'The endurance panel holds 5 measurements: 4 within budget, 1 over budget: context-size
    1, journal-append 1, responsiveness 1, retrieval 1, session-length 1.'
  - Measurements stand by kind - session length first, then journal appends, then retrieval,
    then responsiveness, then context size - then by subject, then record id, so two panels
    of one book diff cleanly, line by line.
  - 'Every measurement stands against a budget set before it was measured: a measurement that
    exceeds its budget is reported over budget, never silently passed.'
  - The panel is read off the book at call time - it is derived, never stored loose.
