    open 2; 3 of the shown patterns stand complete.'
  - Rows stand in held order, the order the book itself stands in, so two panels of one view diff cleanly,
    segment by segment.
  - Every segment is derived from its pattern's own fields - the slice it answers for, the steps it walked
    in the open and the evidence it honestly carries - and no judgement is stored on any pattern.
  - 'Completeness is drafted from the held records alone: a pattern that steps outside the pattern sequence,
    carries a bare claim in place of held evidence, or has not reached approved stands open, named in
    its gaps, and the pattern index is derived from the held patterns, never stored where it could drift.'
