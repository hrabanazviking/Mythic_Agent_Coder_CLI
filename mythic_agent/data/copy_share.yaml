schema: mythic.copy_share/1
slice: M-195
part: 8
part_title: The Beautiful Face
canon_note: 'Copy and share - any answer, diff, or report copyable as clean markdown; a shareable session
  summary generated on command. The M-171 charter names this slice on NO row, so the book is built to
  the roadmap words alone. A clip is held whole - under its heading, its kind in the closed vocabulary
  (answer, diff, report, code, summary), its format and its origin held honestly (an unknown format or
  origin stands empty, never invented), the clean markdown it carries, named as data, and its detail.
  A clip naming no markdown body is held honestly with an empty markdown: it stands unready, named in
  its gaps, and no markdown is invented for it. The clip index is DERIVED at call time from the held clips
  alone - never a second stored copy that could drift - and a stored index or readiness verdict on any
  record refuses by name. The notes are held as data: a note record naming its clip, its stance (note,
  concern, praise or question) and what it feeds back toward; one record stands per clip stance, and holding
  a note posts none of it. A record claiming a clip was actually copied to a clipboard, actually shared,
  sent or posted refuses by name. This file is ONE EXAMPLE BOOK, in the shape a real clip file takes -
  the M-194 slice boundary - six clips and two views, two note records, with its one pinned panel of the
  every-clip view, whose shown clips stand five ready of six, so the book verdict under it stands strained;
  under the ready view, whose five shown clips all stand ready, the verdict stands open. A real book is
  a new file in this same shape - it is never this file edited in place. This layer copies nothing to
  any clipboard, shares nothing, sends nothing, posts nothing and opens no network: it holds the copying
  and sharing as data and tells it.'
