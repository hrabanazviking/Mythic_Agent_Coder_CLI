    in the open and the evidence it honestly carries - and no judgement is stored on any bundle.
  - 'Completeness is manifested from the held records alone: a bundle that steps outside the bundle sequence,
    carries a bare claim in place of held evidence, or has not assembled held stands open, assembled in
    its gaps, and the bundle index is derived from the held bundles, never stored where it could drift.'
