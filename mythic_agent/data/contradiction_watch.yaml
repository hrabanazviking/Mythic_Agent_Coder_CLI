  account:
  - 'The contradiction panel holds 4 watches as of 2026-11-09: 4 corrections shown over 4
    stored memories: crew-fact 1, memory-map 1, session-note 1, subconscious-memory 1.'
  - Rows stand by the day the contradiction was found, then title, then watch id, so two panels
    of one book diff cleanly, line by line.
  - 'Every row shows its correction: the stored claim and the newer evidence that replaces
    it, with the evidence named the winner - the newer truth wins visibly, and no stored claim
    stands beside its contradiction as if both were true.'
  - 'The panel is read off the book at call time - it is derived, never stored loose - and
    a watch corrects the map only: no stored memory''s own holding is overwritten by it.'
