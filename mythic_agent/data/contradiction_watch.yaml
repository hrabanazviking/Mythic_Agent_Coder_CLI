schema: mythic.contradiction_watch/1
slice: M-166
part: 7
part_title: Memory & Context
canon_note: 'Contradiction watch: when new evidence contradicts a stored memory, the newer
  truth wins visibly - the map shows the correction. A watch stands over one stored memory,
  named by the kind of holding it stands in (the project memory map, session memory, cross-project
  memory, the self-improving ledger, crew memory, the subconscious v2, a vector record, or
  a memory held by hand) and the shipped piece''s id alone - the piece''s own words never
  cross into the watch; the stored claim stands in the watcher''s own words, recorded when
  the watch is raised. The newer evidence stands whole beside it: what it says, where it was
  read from, and the day the contradiction was found, with who recorded the watch and the
  session it was raised in. The winner is derived, never chosen: the evidence wins on every
  watch, and the correction the map shows is the stored claim struck through by the evidence
  that replaces it. One stored memory is corrected once in a book, so the correction never
  forks. The CONTRADICTION PANEL is derived from the whole book: its rows are the watches
  carried whole, by the day each contradiction was found, then title, then watch id, each
  showing its correction, and a stored panel that disagrees with its derived shape is refused.
  The CORRECTION VERDICT is derived for the whole book: correcting while one stored memory
  stands corrected, contested when two or three stand corrected, and overturned when four
  or more have been overturned by newer evidence. This file is ONE EXAMPLE BOOK, in the shape
  a real book file takes: the M-165 slice boundary - four corrections standing over the campaign''s
  own stored memories at the close of the subconscious v2 day, one over the memory map, one
  over session memory, one over the subconscious v2 and one over crew memory, with the one
  panel of the book read as of that day. A real book is a new file in this same shape - it
  is never this file edited in place. A watch corrects the map only: the stored memory''s
  own holding is never overwritten, edited or deleted by it. This layer holds corrections
  as data only: it sends nothing, posts nothing, schedules nothing, calls no model, persists
  nothing and writes no live memory.'
