part_title: Memory & Context
canon_note: 'Memory Doctor: mythic doctor gains memory checks (corrupt stores, orphaned vectors, map
  drift) with safe repairs. A finding stands over one stored memory, named by the kind of holding
  it stands in (the project memory map, session memory, cross-project memory, the self-improving ledger,
  crew memory, the subconscious v2, the contradiction watch, a vector record, or a memory held by
  hand) and the shipped piece id alone - the piece own words never cross into the finding. The finding
  names the check that raised it, the store the memory lives in, the workspace store or the user store,
  what the check saw, and how far the trouble reaches - one contained piece, or the store as a whole
  - with who ran the check and the session it ran in. The repair is derived, never chosen: quarantine
  a contained corrupt piece, drop an orphaned vector, realign a drifted map entry - and a store-wide
  trouble derives no repair at all and stands referred to the user. One check stands once over one
  stored memory in a book, so a check word never forks. The DOCTOR PANEL is derived from the whole
  book: its rows are the findings carried whole, by check - corrupt stores first, then orphaned vectors,
  then map drift - then title, then finding id, each showing its derived repair, and a stored panel
  that disagrees with its derived shape is refused. The DOCTOR VERDICT is derived for the whole book:
  sound while nothing stands referred, ailing when one or two stand referred, and critical when three
  or more stand referred. This file is ONE EXAMPLE BOOK, in the shape a real book file takes: the
  M-167 slice boundary - five findings over the campaign own stored memories at the close of the private-by-architecture
  day, four safely repairable and one store-wide corruption referred to the user, with the one panel
  of the book read as of that day. A real book is a new file in this same shape - it is never this
  file edited in place. A repair applied here marks a held finding repaired in the session own book:
  this layer holds findings as data only - it rewrites no live store, deletes no memory, sends nothing,
  posts nothing, schedules nothing, calls no model and persists nothing.'
