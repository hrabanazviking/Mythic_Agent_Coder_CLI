plan_note: |
  Parallel worktrees: the house law as data. Each
  building crew member works in its own git worktree
  on its own branch - never two writers in one tree -
  and the coordinator merges, in slice order; the
  coordinator holds no worktree in the plan. This file
  is ONE EXAMPLE PLAN in the shape a real wave's plan
  file takes: it deals the shipped M-121 casting (the
  eight existing crew members, in casting order, each
  holding its cast office) one worktree each for an
  example wave, slices M-124 to M-131, every member on
  its conventional branch (crew/<member>/<slice>) and
  at its conventional path (worktrees/<member>). A
  real wave's plan is a new file in this same shape,
  dealt for that wave's members and slices - it is
  never this file edited in place, and this layer runs
  no git command and creates no worktree itself.
