schema: mythic.onboarding_five/1
slice: M-184
part: 8
part_title: The Beautiful Face
canon_note: 'Onboarding in five minutes - the first run detects providers, offers Kista key-keeping, walks
  one tiny real task - success before configuration, always. A detection is held whole - under its provider,
  the named probe that looked for it, and the outcome that probe honestly returned, found or absent. Detection
  is derived from named probes: an environment key probe reads a key''s name, never the key; a local door
  probe asks the door; a registry probe reads the registry. Availability is never faked: a provider no
  probe found stands absent and named in its gaps. The Kista offer stands as data - the provider it was
  made for and the answer it was given - and the keys themselves are never held by this layer: a record
  naming a key itself refuses by name. The walk''s steps stand held in order - detect, walk, success,
  offer, configure - and the ordering rule stands as data in the layer: a walk whose configure step stands
  before its first success step refuses by name; configuration is offered after the first success, never
  required before it. The walked task is genuinely tiny and real: read one small file and say in one line
  what it does. This file is ONE EXAMPLE BOOK, in the shape a real first-run file takes - the M-183 slice
  boundary - six detections and two views, five walk steps and one offer, with its one pinned panel of
  the every-detection view, whose shown providers stand four found of six, so the book verdict under it
  stands strained; under the found view, whose four shown providers all stand found, the verdict stands
  open. A real book is a new file in this same shape - it is never this file edited in place. This layer
  detects nothing live, keeps no key, runs no task and configures nothing: it holds the first run as data
  and tells it.'
