schema: mythic.context_budget/1
slice: M-147
part: 7
part_title: Memory & Context
budget_note: |
  Context budget made visible: a live meter and
  a "what's in the context and why" panel - every
  file, note, and map section accounted for in
  tokens. A budget panel book holds one token
  budget and one context item per thing in the
  context, in held order: each item names its
  kind in the closed set the shipped context
  system itself justifies (system, instruction,
  file, map_section, note, history, tool_result),
  its title, its source, the plain-words reason
  WHY it is in the context, and its token count.
  An item names no total, no headroom and no
  share, because those are derived from the
  whole panel: the meter - the total, the
  per-kind subtotals, the headroom (budget minus
  total), the over-budget state and the usage
  share - is read off the items, and a stored
  meter that disagrees with the derived one is
  refused. The panel - every item carried whole
  with its share of the whole, its totals and
  its account - is likewise derived from the
  items, and a stored panel that disagrees
  refuses. This file is ONE EXAMPLE PANEL, in
  the shape a real panel file takes: the M-146
  slice boundary - the context of a session
  opening Part VII, one item of every kind
  against a budget of 8000 tokens, with the one
  meter and the one panel of it. A real panel
  is a new file in this same shape - it is never
  this file edited in place. This layer holds
  the account as data only: it compiles no
  context, assembles no prompt, calls no model
  and persists nothing.
