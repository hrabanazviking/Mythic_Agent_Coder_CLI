    cleanly, segment by segment.
  - Every segment is derived from its exposure's own fields - the service it answers for, the steps it
    walked in the open and the evidence it honestly carries - and no judgement is stored on any exposure.
  - 'Completeness is authorised from the held records alone: a exposure that steps outside the exposure
    sequence, carries a bare claim in place of held evidence, or has not declared held stands open, declared
    in its gaps, and the exposure index is derived from the held exposures, never stored where it could
    drift.'
