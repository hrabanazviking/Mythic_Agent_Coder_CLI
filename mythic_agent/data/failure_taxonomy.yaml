  - 'The failure book holds 5 failures as of 2026-11-11: the view ''all'' shows 5 of them: complete 3, open 2; 3
    of the shown failures stand complete.'
  - Rows stand in held order, the order the book itself stands in, so two panels of one view diff cleanly, segment
    by segment.
  - Every segment is derived from its failure's own fields - the run it answers for, the steps it walked in the
    open and the evidence it honestly carries - and no judgement is stored on any failure.
  - 'Completeness is classed from the held records alone: a failure that steps outside the failure sequence, carries
    a bare claim in place of held evidence, or has not spotted learned stands open, named in its gaps, and the failure
    index is derived from the held failures, never stored where it could drift.'
