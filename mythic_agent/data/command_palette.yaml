schema: mythic.command_palette/1
slice: M-197
part: 8
part_title: The Beautiful Face
canon_note: 'Command palette - Ctrl-K over everything, commands, actions, navigation, settings, the one
  door frequent hands use. The M-171 charter names NO row for this slice, so there is no charter verdict
  for this slice to honour; the slice is built to the roadmap words alone. An entry is held whole - under
  its title, its kind in the closed vocabulary (command, action, navigation, setting), its shortcut held
  honestly (an unknown shortcut stands empty, never invented), the search words it carries, named as data,
  and its detail. An entry naming no search words is held honestly with empty words: it stands incomplete,
  named in its gaps, and no words are invented for it. The palette index is DERIVED at call time from
  the held entries alone - never a second stored copy that could drift - and a stored index or completeness
  verdict on any record refuses by name. The notes are held as data: a note record naming its entry, its
  stance (note, concern, praise or question) and what it feeds back toward; one record stands per entry
  stance, and holding a note applies none of it. A record claiming a command was actually executed, an
  action actually run, or a navigation actually taken, refuses by name. This file is ONE EXAMPLE BOOK,
  in the shape a real palette file takes - the M-196 slice boundary - six entries and two views, two note
  records, with its one pinned panel of the every-entry view, whose shown entries stand five ready of
  six, so the book verdict under it stands strained; under the ready view, whose five shown entries all
  stand ready, the verdict stands open. A real book is a new file in this same shape - it is never this
  file edited in place. This layer executes nothing, runs no command, navigates nowhere, opens no network
  and writes nothing: it holds the palette as data and tells it.'
