schema: mythic.splash_ceremony/1
slice: M-193
part: 8
part_title: The Beautiful Face
canon_note: 'Splash and ceremony, restrained - the forge''s face keeps its beauty inside the Lawbook''s budgets:
  ceremony at start and at a roadmap''s completion, quiet the rest of the time. The M-171 charter names this slice
  on screen S-01 (the splash screen) with a rebuild verdict: a brief wordmark in plain text, a one-line status of
  what is loading, the art retired or demoted under the ceremony budget, and a text alternative for anything pictorial
  that stays. A moment is held whole - under its occasion, its kind in the closed vocabulary (wordmark, status,
  art, silence), its duration and its budget held honestly (an unknown duration or budget stands empty, never invented),
  the text alternative it carries, named as data, and its detail. A moment naming no text alternative is held honestly
  with an empty alternative: it stands unalternated, named in its gaps, and no alternative is invented for it. The
  ceremony index is DERIVED at call time from the held moments alone - never a second stored copy that could drift
  - and a stored index or alternatedness verdict on any record refuses by name. The notes are held as data: a note
  record naming its moment, its stance (note, concern, praise or question) and what it feeds back toward; one record
  stands per moment stance, and holding a note posts none of it. A record claiming a ceremony was actually shown,
  played or performed refuses by name. This file is ONE EXAMPLE BOOK, in the shape a real ceremony file takes -
  the M-192 slice boundary - six moments and two views, two note records, with its one pinned panel of the every-moment
  view, whose shown moments stand five alternated of six, so the book verdict under it stands strained; under the
  alternated view, whose five shown moments all stand alternated, the verdict stands open. A real book is a new
  file in this same shape - it is never this file edited in place. This layer shows no splash, plays no ceremony,
  performs nothing and opens no network: it holds the ceremony as data and tells it.'
