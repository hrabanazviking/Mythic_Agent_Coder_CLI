schema: mythic.multi_session_projects/1
slice: M-162
part: 7
part_title: Memory & Context
canon_note: 'Multi-session per project: parallel sessions on one repo (different branches)
  with shared memory map and no journal crosstalk. A parallel session is one session standing
  on one project, carried with its provenance whole: the project, the branch it works, the
  session and journal it stands under, its state, the journal entries that are its own, how
  many shared memory-map entries it has read, who recorded it, the day it was recorded on,
  and where it was read from. Two sessions of one book never stand on the same branch, and
  every session stands under its own journal: a journal entry named by one session never appears
  in another - a book naming one entry in two sessions refuses as crosstalk. The MULTI-SESSION
  PANEL is derived from the whole book: its rows are the sessions carried whole, by state
  - active first, then paused, then done - then by branch, then title, then session id, and
  its tallies are the sessions'' own counts, and a stored panel that disagrees with its derived
  shape is refused. The ISOLATION VERDICT is derived for the whole book: parallel-isolated
  when two or more sessions stand under as many journals and branches as there are sessions,
  single-session when one stands alone. This file is ONE EXAMPLE BOOK, in the shape a real
  book file takes: the M-161 slice boundary - four sessions standing on the one mythic-agent-coder
  project at the close of the endurance day, the main-line and memory sessions active, the
  graph session paused, the thrift session done, each on its own branch with its own journal
  and no entry shared, all reading the one shared memory map, with the one panel of the book.
  A real book is a new file in this same shape - it is never this file edited in place. This
  layer holds parallel sessions as data only: it spawns no live session, appends to no live
  journal, calls no model and persists nothing - a session standing in a book is a recorded
  standing, never a claim that a live session is running in this layer.'
