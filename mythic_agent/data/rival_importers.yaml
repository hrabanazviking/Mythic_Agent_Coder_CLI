  as_of: '2026-11-11'
  account:
  - 'The importer book holds 5 importers as of 2026-11-11: the view ''all'' shows 5 of them: complete
    3, open 2; 3 of the shown importers stand complete.'
  - Rows stand in held importer, the importer the book itself stands in, so two panels of one view diff
    cleanly, segment by segment.
  - Every segment is derived from its importer's own fields - the source it answers for, the steps it
    walked in the open and the evidence it honestly carries - and no judgement is stored on any importer.
  - 'Completeness is converted from the held records alone: a importer that steps outside the importer
    sequence, carries a bare claim in place of held evidence, or has not detected held stands open, detected
    in its gaps, and the importer index is derived from the held importers, never stored where it could
    drift.'
