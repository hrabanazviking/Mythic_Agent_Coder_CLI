    returns with the width; the praise note on the board fold stands held beside the book as data.
  recorded_on: '2026-11-10'
  actor: the coordinator
  source: small-terminal grace
  origin_session: session-m194
- fold_id: fold-terminal-phone
  seq: 5
  surface: Terminal pane at phone width
  kind: hidden
  width: 40 columns
  height: 6 rows
  preserves: ''
  detail: At phone width the terminal pane hides behind one keypress and names no preserved work in this
    book - the shell waits behind the fold - so the fold stands losable honestly, named in the gaps until
    preserved work is held for it, and no work is invented here.
  recorded_on: '2026-11-10'
  actor: the coordinator
  source: small-terminal grace
  origin_session: session-m194
- fold_id: fold-chat-wide
  seq: 6
  surface: Chat pane on the wide terminal
  kind: full
  width: 80 columns
  height: 24 rows
  preserves: the conversation and the question on the floor
  detail: The chat stands full on the wide terminal and folds last - the conversation and the question
    on the floor are the work itself, and the fold that would lose them is no grace at all.
  recorded_on: '2026-11-10'
  actor: the coordinator
  source: small-terminal grace
  origin_session: session-m194
