  account:
  - 'The grace book holds 6 folds as of 2026-11-10: the view ''all'' shows 6 of them: preserved 5, losable
    1; 5 of the shown folds stand preserved.'
  - Rows stand in held order, the order the book itself stands in, so two panels of one view diff cleanly,
    segment by segment.
  - Every segment is derived from its fold's own fields - the surface, the kind, the width and height
    honestly held and the preserved work it honestly carries - and no judgement is stored on any fold.
  - 'Preservation is judged from the held records alone: a fold naming no preserved work stands losable,
    and the grace index is derived from the held folds, never stored where it could drift.'
