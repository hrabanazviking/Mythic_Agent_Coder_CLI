schema: mythic.small_terminal_grace/1
slice: M-194
part: 8
part_title: The Beautiful Face
canon_note: 'Small-terminal grace - the TUI folds gracefully to 80x24 and to a phone-over-SSH width without
  losing the work. The M-171 charter names this slice on NO row, so the book is built to the roadmap words
  alone. A fold is held whole - under its surface, its kind in the closed vocabulary (full, folded, stacked,
  hidden, summary), its width and its height held honestly (an unknown width or height stands empty, never
  invented), the work it preserves, named as data, and its detail. A fold naming no preserved work is
  held honestly with an empty preserves: it stands losable, named in its gaps, and no work is invented
  for it. The fold index is DERIVED at call time from the held folds alone - never a second stored copy
  that could drift - and a stored index or preservation verdict on any record refuses by name. The notes
  are held as data: a note record naming its fold, its stance (note, concern, praise or question) and
  what it feeds back toward; one record stands per fold stance, and holding a note posts none of it. A
  record claiming a terminal was actually resized, a pane actually folded on a live terminal or work actually
  rendered refuses by name. This file is ONE EXAMPLE BOOK, in the shape a real fold file takes - the M-193
  slice boundary - six folds and two views, two note records, with its one pinned panel of the every-fold
  view, whose shown folds stand five preserved of six, so the book verdict under it stands strained; under
  the preserved view, whose five shown folds all stand preserved, the verdict stands open. A real book
  is a new file in this same shape - it is never this file edited in place. This layer resizes no terminal,
  folds no pane, renders no work and opens no network: it holds the folding as data and tells it.'
small_terminal_grace:
  title: Small-terminal grace at the M-193 slice boundary
