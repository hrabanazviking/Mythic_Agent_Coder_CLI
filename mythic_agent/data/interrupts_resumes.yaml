  as_of: '2026-11-11'
  account:
  - 'The resume book holds 5 resumes as of 2026-11-11: the view ''all'' shows 5 of them: complete 3, open 2; 3 of the shown resumes stand complete.'
  - Rows stand in held order, the order the book itself stands in, so two panels of one view diff cleanly, segment by segment.
  - Every segment is derived from its resume's own fields - the slice it answers for, the steps it walked in the open and the evidence it honestly carries - and no judgement is stored on any resume.
  - 'Completeness is mapped from the held records alone: a resume that steps outside the resume sequence, carries a bare claim in place of held evidence, or has not reached resumed stands open, named
    in its gaps, and the resume index is derived from the held resumes, never stored where it could drift.'
