schema: mythic.themes_grown_up/1
slice: M-179
part: 8
part_title: The Beautiful Face
canon_note: 'Themes Grown Up: the theme system judged under the Design Lawbook discipline
  - darkness ladders of at least four distinct surface values, accents held to 5-12%
  of area and ambient ornament to 1-5%, and colour never the only signal - plus a
  high-contrast and a no-colour theme that lose nothing. A theme is held whole: its
  name, its mode (full colour, high contrast or no colour), its colours role by role
  in the shipped role order, the non-colour cue each state it names carries, and its
  declared accent and ornament shares, each held with its provenance whole. Every
  judgement - the ladder count, the budget word, whether colour stands alone, and
  what the theme loses when colour falls away - is derived from the theme own colours,
  cues and shares, never stored. No row of the M-171 TUI redesign charter names M-179,
  so the slice is built to the roadmap words alone, as M-177 was. The three shipped
  themes of mythic_agent/ui/themes.py (tokyo_night, viking_dark, light) stand judged
  here as data, their colours copied whole from the shipped tables: their ladders
  hold at four distinct surface values, and tokyo_night loses nothing in grayscale,
  while viking_dark loses the apartness of secondary and success (the two roles share
  one colour, #7a9b4a, in the shipped table) and light loses the apartness of primary
  and secondary (their values stand closer than the smallest telling gap). The shipped
  colour tables record no state cues and no area shares, so the shipped themes stand
  with colour alone for their states and their budgets honestly unknown - no cue and
  no share is invented for them. The two new themes this slice authors - high_contrast
  and no_colour - carry told-apart cues for every state and declared shares within
  budget, and each is derived to lose nothing: every role and state of the full-colour
  themes stands present in them and distinguishable by value, text or shape, not by
  hue. This file is ONE EXAMPLE BOOK, in the shape a real theme file takes: the M-178
  slice boundary - five themes, two views, and the one pinned panel of the every-mode
  view, whose shown themes span all three modes with two standing disciplined, so the
  book verdict under it stands strained; under the no-colour view, whose one shown
  theme stands disciplined, the verdict stands disciplined; under a full-colour
  reading, whose shown themes stand undisciplined, the verdict stands bare. A real
  book is a new file in this same shape - it is never this file edited in place. This
  layer holds themes and views as data only - it repaints no live UI, applies no theme
  live, renders no live UI and measures no running screen: a theme held here is a
  finding, never the live face of the app it describes.'
