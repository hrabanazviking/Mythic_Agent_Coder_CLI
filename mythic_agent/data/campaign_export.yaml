  account:
  - 'The bundle book holds 5 bundles as of 2026-11-11: the view ''all'' shows 5 of them: complete 3, open
    2; 3 of the shown bundles stand complete.'
  - Rows stand in held order, the order the book itself stands in, so two panels of one view diff cleanly,
    segment by segment.
  - Every segment is derived from its bundle's own fields - the campaign it answers for, the steps it
    walked in the open and the evidence it honestly carries - and no judgement is stored on any bundle.
  - 'Completeness is sealed from the held records alone: a bundle that steps outside the bundle sequence,
    carries a bare claim in place of held evidence, or has not gathered carried stands open, named in
    its gaps, and the bundle index is derived from the held bundles, never stored where it could drift.'
