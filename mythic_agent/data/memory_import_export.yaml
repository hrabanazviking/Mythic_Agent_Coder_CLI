schema: mythic.memory_import_export/1
slice: M-164
part: 7
part_title: Memory & Context
canon_note: 'Memory import/export: a project''s memory map + ledger as portable files -
  they ride with the repo if the user wishes. A memory package is one project''s map and
  ledger exported as one portable file record, carried with its provenance whole: the
  project it packs, the session it was exported from and the day, what rides in it - the
  map entry ids and the sections they stand in, the ledger candidate ids and the promotion
  states they stand in - who exported it, and where it was read from. A package carries
  its pieces by id alone: the entries'' and candidates'' own words never cross into the
  package. A piece rides once: a map entry or a ledger candidate named by one package
  never rides in another package of the same book, and one session''s export of one project
  stands once. An import is judged whole before anything is held - provenance, contents
  and counts together - and a malformed or foreign package refuses by name, with nothing
  partially held. The MEMORY PANEL is derived from the whole book: its rows are the
  packages carried whole, by project, then day, then title, then package id, and its tallies
  are the packages'' own counts, and a stored panel that disagrees with its derived shape
  is refused. The PORTABILITY VERDICT is derived for the whole book: fully-portable when
  every package rides map and ledger both, map-only or ledger-only when no package rides
  both and only one holding rides at all, partially-portable otherwise. This file is ONE
  EXAMPLE BOOK, in the shape a real book file takes: the M-163 slice boundary - the
  mythic-agent-coder project packed whole at the close of the handoff day, its nine map
  entries of every section and its three ledger candidates standing candidate, promoted
  and declined, and the samtal project''s map packed alone from its gatekeeper session -
  with the one panel of the book. A real book is a new file in this same shape - it is
  never this file edited in place. This layer holds packages as data only: it sends
  nothing, posts nothing, schedules nothing, calls no model, persists nothing and writes
  no live memory - holding an imported package leaves every live map and ledger exactly
  as it stood.'
