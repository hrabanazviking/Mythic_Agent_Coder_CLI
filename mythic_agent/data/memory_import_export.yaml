  account:
  - 'The memory panel holds 2 packages: 14 pieces in all, 11 map entries and 3 ledger
    candidates: ledger 3, map 11.'
  - Packages stand by project, then day, then title, then package id, so two panels of
    one book diff cleanly, line by line.
  - Every piece a package carries is carried from the project's own memory map and ledger,
    and a package whose contents disagree with those holdings is refused - a package carries
    only what its sources hold.
  - The panel is read off the book at call time - it is derived, never stored loose.
