schema: mythic.status_line/1
slice: M-178
part: 8
part_title: The Beautiful Face
canon_note: 'Status Line of Truth: six facts, always visible - the model, the posture,
  the context meter, the cost so far, the crew state and the sandbox state - gathered
  into one status line of truth, each held as data. A fact is one of those six held
  whole - its kind (model, posture, context, cost, crew or sandbox, in the roadmap''s
  own order), its title, its value and its detail, the panel and the keypress it
  opens (its kind''s own), each held with its provenance whole. The M-171 charter''s
  S-03 direction is honoured live: gather model, context, cost and crew state into
  one status line of truth - no structural rebuild of the screen - and the roadmap''s
  six facts complete the gathering with posture and sandbox state. A view is the
  one kind a panel looks at, or every kind at once, and the status line itself is
  derived from the six facts, one segment per kind in the roadmap''s order - never
  stored, never written by hand. A fact that is not measured stands honestly unknown,
  and a kind holding no fact stands unknown in the line: no live value is invented
  in this book. Each panel and keypress is named as data only: no live key is bound,
  no live panel is opened and the live chat screen is not rebuilt here. This file
  is ONE EXAMPLE BOOK, in the shape a real status-line file takes: the M-177 slice
  boundary - six facts, five standing measured and the cost fact standing honestly
  unknown, two views, and the one pinned panel of the every-kind view, whose shown
  facts span all six kinds with five measured, so the book''s verdict under it stands
  partial; under the cost view, whose one shown fact stands unknown, the verdict
  stands empty. A real book is a new file in this same shape - it is never this file
  edited in place. This layer holds facts and views as data only - it measures nothing
  live, reads no live model, context, cost, crew or sandbox state, renders no live
  UI, binds no key, opens no panel, calls no model and persists nothing: a fact held
  here is a finding, never the live state of the screen it describes.'
