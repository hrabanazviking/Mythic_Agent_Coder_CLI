schema: mythic.context_recipes/1
slice: M-158
part: 7
part_title: Memory & Context
canon_note: |
  Context recipes: saved bundles of context - "the
  auth stack", "the Mojo build" - summonable by name
  into any session. A recipe is one named bundle
  carried with its provenance whole: the session it
  was saved in, the day it was saved on, and where it
  was read from. Its pieces are the shipped memory
  holdings' own pieces, named by kind and reference
  with the plain-words reason each belongs - the
  piece itself is never copied into the recipe, and
  no piece is named twice in one bundle, while the
  same piece may stand in many bundles. No name in a
  book names two recipes: a name summons one bundle,
  never two, so a name spoken in a session is never
  ambiguous. The RECIPE PANEL is derived from the
  whole book: its rows are the recipes carried whole,
  by name, then recipe id, and its totals are the
  recipes' own counts and its kind counts the pieces'
  own tallies, and a stored panel that disagrees with
  its derived shape is refused. This file is ONE
  EXAMPLE BOOK, in the shape a real book file takes:
  the M-157 slice boundary - three bundles standing
  at the close of the forget-and-quarantine day, the
  auth stack, the Mojo build and the provider ocean,
  with the one panel of the book. A real book is a
  new file in this same shape - it is never this file
  edited in place. This layer holds recipes as data
  only: it calls no model, assembles no live context,
  edits no code and persists nothing.
