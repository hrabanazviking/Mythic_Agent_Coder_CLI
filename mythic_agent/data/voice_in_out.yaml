  - Rows stand in held order, the order the book itself stands in, so two panels of one view diff cleanly, segment by segment.
  - Every segment is derived from its item's own fields - availability from the backends and voices it names, a draft from its transcript - and no judgement is stored on any item.
  - 'Voice is an extra door, never the only door: every shown action names a text equivalent, and no dictated prompt is sent from this layer.'
