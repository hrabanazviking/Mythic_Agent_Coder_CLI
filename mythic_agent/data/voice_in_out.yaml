schema: mythic.voice_in_out/1
slice: M-180
part: 8
part_title: The Beautiful Face
canon_note: >
  Voice In and Out - push-to-talk dictation for prompts, and spoken
  stand-ups via the existing TTS (direct catalog casting, the house
  voice law) - voice is an extra door, never the only door. A dictation
  session is held whole - its state (recording, landed or drafted),
  its transcript, the capture and transcriber backends it names, and
  its provenance whole - and its transcript lands as a prompt draft,
  never auto-sent. A spoken stand-up is held whole - its speaker, its
  text, the catalog voice cast for it directly from the voice catalog
  (the shipped TTS manager's primary voice, en_US-lessac-high, stands
  as the morning stand-up's cast voice here, copied from
  mythic_agent/core/tts.py) and the TTS backend it names. A voice
  action is held whole - its spoken phrase and the text equivalent
  that stands beside it - because every voice action has a text
  equivalent and a voice-only action refuses by name. Availability -
  available, unavailable by a named reason, or honestly unknown - is
  derived from the backends and voices a record names, never stored
  and never faked - the evening dictation names the unknown
  transcriber and stands honestly unknown, and the evening stand-up
  names no catalog voice and stands unavailable, its road out not
  travelled until a voice is cast. No row of the M-171 TUI redesign
  charter names M-180, so the slice is built to the roadmap words
  alone, as M-177 and M-179 were. This file is ONE EXAMPLE BOOK, in
  the shape a real voice file takes - the M-179 slice boundary -
  seven items, two views, and the one pinned panel of the every-kind
  view, whose shown items stand five whole of seven, so the book
  verdict under it stands strained; under the dictation view, whose
  two shown sessions stand one whole, the verdict stands strained
  too. A real book is a new file in this same shape - it is never
  this file edited in place. This layer holds voice as data and
  reaches live roads only through seams - it captures no live audio
  in tests, builds no new TTS engine, clones no voice and sends no
  prompt.
