  as_of: '2026-11-11'
  account:
  - 'The endpoint book holds 5 endpoints as of 2026-11-11: the view ''all'' shows 5 of them: complete
    3, open 2; 3 of the shown endpoints stand complete.'
  - Rows stand in held endpoint, the endpoint the book itself stands in, so two panels of one view diff
    cleanly, segment by segment.
  - Every segment is derived from its endpoint's own fields - the host it answers for, the steps it walked
    in the open and the evidence it honestly carries - and no judgement is stored on any endpoint.
  - 'Completeness is bound from the held records alone: a endpoint that steps outside the endpoint sequence,
    carries a bare claim in place of held evidence, or has not declared held stands open, declared in
    its gaps, and the endpoint index is derived from the held endpoints, never stored where it could drift.'
