schema: mythic.cold_start/1
slice: M-169
part: 7
part_title: Memory & Context
canon_note: 'Cold-Start Kindness: opening a huge, old project rebuilds its map in the background
  while the coder is already useful. A record stands over one opening, named by the project id
  and the map id alone - the map own facts never cross into the record. The record carries the
  map evidence whole: the map age in days, its entry count, the project file count, how many of
  those files the map covers, and the map counted by area - the shipped map own sections - each
  area naming how many of its entries stand stale, with who opened the project and the session
  it opened in. The rebuild plan is derived, never chosen: no map at all derives a rebuild from
  scratch, old, stale or short evidence derives a background rebuild while the coder works from
  the stale-but-usable map, and fresh, whole evidence derives no rebuild at all - and the stages
  stand in derived order, the stalest area first. The READINESS PANEL is derived from the whole
  book: its rows are the records carried whole, by derived mode - from-scratch rebuilds first,
  then background rebuilds, then fresh servings - then title, then record id, each showing what
  is usable now beside what is still rebuilding, and a stored panel that disagrees with its
  derived shape is refused. The COLD-START VERDICT is derived for the whole book: cold while any
  project stands with no map at all, warming while any map rebuilds in the background, and kind
  while every opening serves a fresh map. Progress walks the derived plan stage by stage, in
  order, on the held book alone. This file is ONE EXAMPLE BOOK, in the shape a real book file
  takes: the M-168 slice boundary - three openings at the close of the memory doctor day, one
  huge old project warming in the background, one project with no map at all, and one small
  fresh project served as it stands, with the one panel of the book read as of that day. A real
  book is a new file in this same shape - it is never this file edited in place. This layer holds
  openings as data only - it starts no thread, rebuilds no live map, opens no live project, sends
  nothing, posts nothing, schedules nothing, calls no model and persists nothing.'
