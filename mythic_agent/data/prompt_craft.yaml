schema: mythic.prompt_craft/1
slice: M-177
part: 8
part_title: The Beautiful Face
canon_note: >-
  Prompt Craft: the input box is a small editor, not a slot - multi-line
  editing, history per project, image paste and file drop, each held as
  data. An item is one piece of that craft held as data - its kind (draft,
  history, image or file), the one project it stands in, its title and its
  words, each held with its provenance whole. A view is the one project a
  panel looks at, or every project at once, and an item's line and line
  count under a view are derived from the item's own title, kind, project
  and words - never stored, never counted by hand. A pasted image is first
  held as its own record, judged whole - its name, its format and the plain
  words that describe it, the image itself never held - and joins the book
  as an item of the image kind; a dropped file is first held as its own
  record, judged whole - its path named, never opened, never read - and
  joins as an item of the file kind. Dictation stands in the roadmap words
  with its own slice named beside it (M-180) and is NOT built here: there
  is no dictation kind, record or road in this book. The M-171 charter
  names no screen row for this slice - the input lives on the main chat
  screen (its S-03 row), whose owning slices are M-172, M-173 and M-178 -
  so this book is built to the roadmap words alone, plain words first.
  This file is ONE EXAMPLE BOOK, in the shape a real prompt-craft file
  takes: the M-176 slice boundary - eight items, two drafts, two history
  entries, two pasted images and two dropped files standing across two
  projects, two views, and the one pinned panel of the every-project view,
  whose shown items span both projects, so the book's verdict under it
  stands shared; under the mythic-coder view the verdict stands held. A
  real book is a new file in this same shape - it is never this file edited
  in place. This layer holds items and views as data only - it edits no
  live input box, pastes nothing, drops nothing, dictates nothing, opens
  no dropped file, sends nothing, calls no model and persists nothing: an
  item held here is a finding, never the act of typing, pasting or sending
  the prompt found.
