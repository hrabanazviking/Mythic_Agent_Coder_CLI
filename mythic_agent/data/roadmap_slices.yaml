slices:
- id: M-001
  part: 1
  title: The Feature Census
  summary: 'a living matrix (feature × tool × their form × Mythic''s state: HAVE / PARTIAL / MISSING /
    BETTER) covering the ten named rivals, refreshed from their public docs; stored as data.'
  status: done
- id: M-002
  part: 1
  title: The Concordance
  summary: every campaign of Volmarr's 500-slice Mimisbrunnr roadmap mapped onto this road's parts (and
    vice versa) — one page where both roads can be read together; conflicts listed, none silently resolved.
  status: done
- id: M-003
  part: 1
  title: The Gap Audit
  summary: each MISSING/PARTIAL census row traced to the module that would own its fix; the audit output
    seeds Parts II–X.
  status: done
- id: M-004
  part: 1
  title: UX Principles charter
  summary: the kindness rules (plain language first; one-tap approvals with remembered scopes; nothing
    destructive without a named target; every refusal explains itself; every long job shows its slices)
    written as reviewable law for all later parts.
  status: done
- id: M-005
  part: 1
  title: The Method Charter in-app
  summary: Forge Protocol, Plain-Language Build Protocol, Project Memory Map, Juggernaut loop, Autonomy
    lines, and the Self-Improving Forge summarised into the app's own doctrine file — the text Part IX's
    engine executes.
  status: done
- id: M-006
  part: 1
  title: Terminology bridge
  summary: every field term (checkpoint, hook, skill, plan mode…) given its Mythic name *and* kept searchable
    by its common name — a user coming from any rival finds their word honoured.
  status: done
- id: M-007
  part: 1
  title: Baseline freeze
  summary: full suite + startup profile + a scripted end-to-end task recorded as the "before" evidence
    for Part XI.
  status: done
- id: M-008
  part: 1
  title: Benchmark task pack v1
  summary: twenty real tasks (bugfix, feature, refactor, test-writing, docs) in throwaway repos — the
    yardstick every later part is measured with.
  status: done
- id: M-009
  part: 1
  title: Config archaeology
  summary: every current setting, file, and env var catalogued; the catalogue is the compatibility contract
    for Part VIII's settings redesign.
  status: done
- id: M-010
  part: 1
  title: Session archaeology
  summary: existing session/journal formats proven readable by a forward-compat test that must never break.
  status: done
- id: M-011
  part: 1
  title: The arcanum review
  summary: the 116 KB `arcanum.py` mapped — what it owns, what it duplicates, what Parts III/VI/VII should
    absorb or leave.
  status: done
- id: M-012
  part: 1
  title: Dependency census
  summary: every dependency weighed (weight, licence, necessity); a stdlib-first replacement list where
    the win is real.
  status: done
- id: M-013
  part: 1
  title: Platform truth table
  summary: Linux/Windows/macOS × install/run/TUI/ voice — each cell PROVEN or NOT PROVEN as of today,
    no inheritance.
  status: done
- id: M-014
  part: 1
  title: The rivals' config import study
  summary: what Claude Code / Codex / OpenCode / Aider config and instruction files look like, behaviourally
    — the spec for Part X's importers (clean-room, formats only).
  status: done
- id: M-015
  part: 1
  title: Telemetry honesty review
  summary: what the app records today (metrics, costs) and the rule that it never phones home — written
    down.
  status: done
- id: M-016
  part: 1
  title: Accessibility baseline
  summary: keyboard-only task completion test, screen-reader pass over the TUI, contrast audit — the "before"
    for Part VIII.
  status: done
- id: M-017
  part: 1
  title: The roadmap made data
  summary: this road's slices in a machine file the app itself can display, check off, and report (Part
    IX eats first from its own kitchen).
  status: queued
- id: M-018
  part: 1
  title: Part I gate
  summary: census + concordance + audits published in-repo; baseline evidence banked; Volmarr's 500-slice
    file untouched.
  status: queued
- id: M-019
  part: 2
  title: Provider registry as data
  summary: provider definitions (endpoints, auth style, model lists, capabilities) in data files; adding
    a provider never touches Python.
  status: queued
- id: M-020
  part: 2
  title: The OpenAI-compatible universal adapter
  summary: one adapter serving every compatible endpoint (the long tail of the field) with per-provider
    quirks declared in its registry entry.
  status: queued
- id: M-021
  part: 2
  title: Anthropic-native adapter v2
  summary: prompt caching, extended thinking controls, and tool-use dialect handled natively, not through
    the compatible shim.
  status: queued
- id: M-022
  part: 2
  title: Google/Gemini-native adapter
  summary: native dialect, long-context handling, grounding toggles where offered.
  status: queued
- id: M-023
  part: 2
  title: Local runtimes I — Ollama
  summary: discovery of running models, pull/list from the TUI, honest "model not present" answers.
  status: queued
- id: M-024
  part: 2
  title: Local runtimes II
  summary: LM Studio, llama.cpp servers, and any local OpenAI-compatible port, with the same discovery
    kindness.
  status: queued
- id: M-025
  part: 2
  title: Project Aesir as a provider
  summary: Mythic can aim at Volmarr's own engine (its API as it stands) — the ecosystem eats its own
    cooking; capability limits reported as Aesir reports them.
  status: queued
- id: M-026
  part: 2
  title: The gateways
  summary: OpenRouter and kin as first-class registry entries with their model catalogues browsable in-app.
  status: queued
- id: M-027
  part: 2
  title: Capability truth per model
  summary: context size, tool use, vision, reasoning, max output — stored per model, shown before selection,
    never guessed (unknown = unknown).
  status: queued
- id: M-028
  part: 2
  title: Mid-session model switching
  summary: change model or provider without losing the session, the plan, or the crew; the switch is a
    journal event with the reason if given.
  status: queued
- id: M-029
  part: 2
  title: Role routing
  summary: different models for different offices (a deep thinker for the Architect, a fast hand for grunt
    edits, a cheap scout for searches) — set per crew role, visible, changeable.
  status: queued
- id: M-030
  part: 2
  title: Fallback chains
  summary: when a provider fails or rate-limits, the chain walks to the next door with the user's standing
    permission; every walk is announced, never silent.
  status: queued
- id: M-031
  part: 2
  title: Cost-aware routing
  summary: with `mythic costs` data, the router can prefer the cheaper adequate model for a task class
    — a setting, off by default, explained in plain words.
  status: queued
- id: M-032
  part: 2
  title: Key custody via Kista
  summary: providers read their keys from Volmarr's Kista; config files hold references, never secrets;
    a missing key asks once, kindly.
  status: queued
- id: M-033
  part: 2
  title: Subscription doors study
  summary: OAuth-style sign-ins some rivals use (ChatGPT/Claude subscriptions) — studied behaviourally;
    built only where the provider's terms allow, else recorded NOT OFFERED with the reason.
  status: queued
- id: M-034
  part: 2
  title: Streaming discipline
  summary: token streaming with clean interrupt, partial-answer salvage, and resume-the-thought where
    the provider allows; a killed stream never corrupts the journal.
  status: queued
- id: M-035
  part: 2
  title: Retry and backoff honesty
  summary: bounded retries on transient failures only; mutating calls never silently replayed (the house
    rule from Sagnaskemma's hardening, applied here).
  status: queued
- id: M-036
  part: 2
  title: Rate-limit weather
  summary: per-provider quota/limit state surfaced in the status line *before* it bites; queueing of crew
    work around it.
  status: queued
- id: M-037
  part: 2
  title: Vision input routing
  summary: image tasks route only to models whose capability record says they can see; otherwise the app
    says so plainly and offers the switch.
  status: queued
- id: M-038
  part: 2
  title: Long-context strategy per model
  summary: 1M-class contexts get map-first loading; small contexts get aggressive repo-map + retrieval
    (Part III/VII) — the strategy is chosen from capability truth.
  status: queued
- id: M-039
  part: 2
  title: Provider health board
  summary: '`mythic doctor --live` grown into a per-provider board (reachable, latency, last error) with
    --json.'
  status: queued
- id: M-040
  part: 2
  title: Offline honesty
  summary: with no network and no local model, the app says exactly that and still offers its non-model
    tools (review, metrics, session search) instead of dying.
  status: queued
- id: M-041
  part: 2
  title: New-provider test kit
  summary: a conformance script any new registry entry must pass (chat, tools, streaming, errors) before
    it ships.
  status: queued
- id: M-042
  part: 2
  title: Part II gate
  summary: the same benchmark task (M-008) completed through five different providers + Ollama + Aesir,
    evidence banked.
  status: queued
- id: M-043
  part: 3
  title: Tree-sitter foundation
  summary: grammar-backed parsing for the major languages (Python first, then JS/TS, Rust, Go, Mojo-aware),
    vendored cleanly with licences noticed.
  status: queued
- id: M-044
  part: 3
  title: The Repo Map (Aider's crown, made kinder)
  summary: a token-budgeted map of the whole repo — files, classes, functions, signatures — ranked by
    relevance to the current task (PageRank over the reference graph, as the field does), refreshed incrementally.
  status: queued
- id: M-045
  part: 3
  title: Map in the TUI
  summary: the map is *visible* — browse it, pin files, see why the coder thinks a file matters; the ranking
    is explainable.
  status: queued
- id: M-046
  part: 3
  title: Symbol graph
  summary: definitions, references, imports, call edges extracted per language; the graph feeds the map,
    the search, and Part VI's task splitting.
  status: queued
- id: M-047
  part: 3
  title: Structural search
  summary: ast-grep-style pattern search ("find every call like `foo($A, $$$)`) as a tool and a TUI panel.
  status: queued
- id: M-048
  part: 3
  title: Structural rewrite
  summary: the same patterns as safe codemods with per-site diff preview — never a blind global replace.
  status: queued
- id: M-049
  part: 3
  title: LSP client I — diagnostics
  summary: language servers (pyright, typescript, rust-analyzer, gopls…) run beside the app; their diagnostics
    flow into the coder's awareness and the TUI's margin.
  status: queued
- id: M-050
  part: 3
  title: LSP client II — navigation
  summary: go-to-definition, references, hover, workspace symbols as agent tools ("where is this used?"
    gets a true answer).
  status: queued
- id: M-051
  part: 3
  title: LSP client III — rename and code actions
  summary: a rename propagates through re-exports and imports by the server's own knowledge, diffed for
    approval like any edit.
  status: queued
- id: M-052
  part: 3
  title: Edit-time truth loop
  summary: after every edit, diagnostics + the project's formatter/linter run; new errors return to the
    coder as facts to fix *before* the turn ends (the field's quiet superpower).
  status: queued
- id: M-053
  part: 3
  title: Formatter covenant
  summary: the project’s own formatter config is honoured exactly; the coder never reformats untouched
    code; format diffs are separated from logic diffs in review.
  status: queued
- id: M-054
  part: 3
  title: The Debugger (DAP)
  summary: breakpoints, step, continue, variable inspection, exception stops for Python first (debugpy),
    then the DAP-general road — the coder can *watch* a bug happen.
  status: queued
- id: M-055
  part: 3
  title: Debugger in the loop
  summary: a failing test can be re-run under the debugger by the coder itself, frames and locals reported
    as evidence.
  status: queued
- id: M-056
  part: 3
  title: Test intelligence
  summary: test discovery per project, "run only what this change touches" selection from the symbol graph,
    flaky-test marking from history (never from vibes).
  status: queued
- id: M-057
  part: 3
  title: Coverage sight
  summary: line coverage overlaid on edited files; a change landing with zero covering tests is flagged
    to the Auditor.
  status: queued
- id: M-058
  part: 3
  title: Beyond-grep local search
  summary: in-process ripgrep with fuzzy and structural modes, results ranked by the symbol graph.
  status: queued
- id: M-059
  part: 3
  title: Web knowledge tools
  summary: web search + fetch as first-class tools (docs, changelogs, error lookup), results cited into
    the journal.
  status: queued
- id: M-060
  part: 3
  title: Docs-at-hand
  summary: the project's own docs, plus offline doc packs for its stack, searchable from the TUI (the
    Mojo Docs MCP pattern, generalised).
  status: queued
- id: M-061
  part: 3
  title: Dependency sight
  summary: read the dependency graph, changelogs, and known-vulnerability data for the project's stack;
    an upgrade is proposed with its blast radius, never applied silently.
  status: queued
- id: M-062
  part: 3
  title: Dead-code and duplication sensing
  summary: structural reports for the Cartographer; sensing only — deletion is always a separate, approved
    slice.
  status: queued
- id: M-063
  part: 3
  title: Type-aware Python depth
  summary: mypy/pyright findings triaged into the review; the coder fixes types it broke in the same turn.
  status: queued
- id: M-064
  part: 3
  title: Mojo as a first-class language
  summary: parsing via tree-sitter grammar where available, the house Mojo skills wired as knowledge —
    Mythic is the only CLI that truly speaks Mojo (Aesir's home tongue).
  status: queued
- id: M-065
  part: 3
  title: SQL and data sight
  summary: schema reading, query explain, migration files understood as code (the Muse DB pattern, productised).
  status: queued
- id: M-066
  part: 3
  title: Config and infra files
  summary: YAML/TOML/Dockerfile/systemd units parsed structurally, with the no-Docker law enforced as
    a *warning the coder itself raises* on Volmarr's projects.
  status: queued
- id: M-067
  part: 3
  title: Binary and asset awareness
  summary: images, archives, and large files are described, never dumped into context; the map notes their
    roles.
  status: queued
- id: M-068
  part: 3
  title: Language packs as data
  summary: per-language toolchains (server commands, formatters, test runners) declared in data; a new
    language is a pack, not a patch.
  status: queued
- id: M-069
  part: 3
  title: Intelligence cache
  summary: parse/graph/LSP results cached per file hash; a cold start on a big repo stays fast (measured
    in Part XI).
  status: queued
- id: M-070
  part: 3
  title: Part III gate
  summary: on the benchmark pack — a cross-file rename, a structural codemod, and a debugger-caught bug,
    all completed with the new senses, evidence banked against the M-007 baseline. ---
  status: queued
- id: M-071
  part: 4
  title: Edit-format plurality
  summary: whole-file, unified-diff, search-and- replace blocks, and Aider-style architect/editor splitting
    — the coder picks per task and per model strength; the choice is journaled.
  status: queued
- id: M-072
  part: 4
  title: Hash-anchored edits
  summary: edits anchored to content hashes of the lines they touch (the frontier trick that cuts failed
    applies and token cost); a moved target refuses cleanly instead of mangling.
  status: queued
- id: M-073
  part: 4
  title: Apply-failure repair loop
  summary: a failed apply returns the true current text to the coder for one honest retry — bounded, visible,
    never a silent fuzz.
  status: queued
- id: M-074
  part: 4
  title: Hunk-level review
  summary: the approval UI shows diffs per hunk with accept/reject/edit per hunk; rejecting one hunk never
    kills the rest.
  status: queued
- id: M-075
  part: 4
  title: Checkpoints v2
  summary: named checkpoints ("before the auth rework") capturing working tree + session state; restore
    is one command, and the journal shows the whole checkpoint tree.
  status: queued
- id: M-076
  part: 4
  title: Session branching
  summary: fork a session at any message ("try the other road from here") — branches share history, diverge
    honestly, and can be compared.
  status: queued
- id: M-077
  part: 4
  title: Undo grown up
  summary: '`/undo` walks edits, commands, and checkpoints as one timeline; undo of a *command''s* effects
    is attempted via its recorded footprint, labelled certain or best-effort.'
  status: queued
- id: M-078
  part: 4
  title: Auto-commit discipline (Aider's crown)
  summary: every accepted edit set lands as its own commit with a written message — on a working branch
    by default, never on the user's protected branches unasked.
  status: queued
- id: M-079
  part: 4
  title: README and licence guardians
  summary: the coder *refuses* to overwrite a README (Volmarr's standing law) or touch licence files without
    explicit word; the refusal is built into the edit layer.
  status: queued
- id: M-080
  part: 4
  title: Commit craft
  summary: commit-splitting by concern, message drafting from the actual diff, and the house rules wired
    in (fetch + remote-diff before push, never force-push, verify the remote moved).
  status: queued
- id: M-081
  part: 4
  title: Conflict workbench
  summary: merge/rebase conflicts presented as decisions with both sides' intent summarised; resolution
    is edited, tested, and journaled like any change.
  status: queued
- id: M-082
  part: 4
  title: PR craft
  summary: create, review, and respond to pull requests — review comments fetched as tasks; a review pass
    posts only at the user's word (sending as the user is a standing pause-line).
  status: queued
- id: M-083
  part: 4
  title: Issue-to-slice
  summary: a GitHub issue (or Samverk issue, Part X) becomes a planned slice with acceptance checks drafted
    from its text.
  status: queued
- id: M-084
  part: 4
  title: Multi-file change sets
  summary: a change set is a named, reviewable unit across files with its test evidence attached.
  status: queued
- id: M-085
  part: 4
  title: Rename/move files as first-class edits
  summary: (history-preserving git mv, references updated via Part III's graph).
  status: queued
- id: M-086
  part: 4
  title: Generated-code honesty
  summary: generated files are marked, their generator recorded; hand-edits to generated files warn before
    saving.
  status: queued
- id: M-087
  part: 4
  title: Large-file and binary care
  summary: big files edited by anchored chunks; binaries never text-edited; size guards explain themselves.
  status: queued
- id: M-088
  part: 4
  title: The stash shelf
  summary: quick-shelve work-in-progress by name, restore across sessions; the shelf survives crashes
    (journal-backed).
  status: queued
- id: M-089
  part: 4
  title: Patch export/import
  summary: a change set as a portable patch file with its evidence header — the hand-off format betweenmachines
    and between agents.
  status: queued
- id: M-090
  part: 4
  title: Editor bridges lite
  summary: '`$EDITOR` round-trip for any file or prompt at any approval point (the terminal user''s oldest
    right).'
  status: queued
- id: M-091
  part: 4
  title: Diff theatre in the TUI
  summary: side-by-side and unified views, word-level highlighting, whitespace toggle — colour never the
    only signal.
  status: queued
- id: M-092
  part: 4
  title: Blame and history sight
  summary: '"why is this line like this?" — blame + the journal''s own record of the session that wrote
    it.'
  status: queued
- id: M-093
  part: 4
  title: Guarded mass edits
  summary: repo-wide edits require a dry-run report (files, hunks, risks) approved before a single byte
    moves.
  status: queued
- id: M-094
  part: 4
  title: Part IV gate
  summary: benchmark refactor task completed with zero failed applies, hunk review used, auto-commits
    clean, checkpoint restore proven mid-task.
  status: queued
- id: M-095
  part: 5
  title: Permission profiles
  summary: named postures (Read-Only Scout, Trusted Forge, Full Autonomy, and custom) binding tools, paths,
    network, and commands; the posture is always visible in the status line.
  status: queued
- id: M-096
  part: 5
  title: Remembered approvals with scope
  summary: '"always allow *this* command in *this* project" — scopes are exact (command + args pattern
    + path), listed, and revocable in one screen; nothing is remembered silently.'
  status: queued
- id: M-097
  part: 5
  title: The OS sandbox (Codex's crown, native)
  summary: commands run under OS confinement (Linux namespaces/seccomp, macOS sandbox-exec, Windows job
    objects as far as each honestly goes) — no Docker, ever; per-platform truth in the platform table.
  status: queued
- id: M-098
  part: 5
  title: Network gates
  summary: outbound network per-tool and per-domain allowlists; a sandboxed command that reaches for the
    net is refused and the refusal is news, not a log line.
  status: queued
- id: M-099
  part: 5
  title: Path jail
  summary: file tools confined to the workspace + named grants; escapes by symlink are checked, not assumed
    away.
  status: queued
- id: M-100
  part: 5
  title: Plan mode perfected
  summary: in plan posture the coder may read everything and write nothing; the plan it produces is slices
    with acceptance checks (Part IX form), and approving the plan is the one gate to building.
  status: queued
- id: M-101
  part: 5
  title: Hooks — the full lifecycle
  summary: pre/post tool, pre/post edit, on-test, on-commit, on-session events running user scripts; hook
    output can block with a reason the coder must answer.
  status: queued
- id: M-102
  part: 5
  title: Hook packs
  summary: the house hooks (run tests after edits, guard the README, verify pushes) shipped as installable
    packs.
  status: queued
- id: M-103
  part: 5
  title: Background tasks
  summary: long commands (builds, suites, servers) run as managed background jobs with live output tails,
    kill, and completion events into the session.
  status: queued
- id: M-104
  part: 5
  title: The Keeper pattern built in
  summary: a watcher that notices stalled work (a dead background job, a crew member gone quiet) and restarts
    or reports per the user's standing keeper law — timers that *work*, not timers that watch.
  status: queued
- id: M-105
  part: 5
  title: Scheduled work
  summary: cron-style jobs ("run the suite at dawn", "check the upstream repo weekly") as data, with the
    same approval lines as live work.
  status: queued
- id: M-106
  part: 5
  title: Headless fleet mode
  summary: '`mythic run` grown for CI — parallel tasks across repos, machine-readable verdicts, artefact
    bundles, honest exit codes; a fleet run is resumable.'
  status: queued
- id: M-107
  part: 5
  title: Budgets as guardrails
  summary: per-task and per-session token, cost, time, and command budgets; hitting a budget is a graceful
    pause with a report, never a mid-edit death.
  status: queued
- id: M-108
  part: 5
  title: The kill switch everywhere
  summary: one key/command halts the coder, the crew, background jobs, and pending approvals — tested,
    instant.
  status: queued
- id: M-109
  part: 5
  title: Audit trail
  summary: every tool call, approval, edit, and command in the journal with actor (human/coder/crew/hook)
    — exportable for review; the trail is append-only.
  status: queued
- id: M-110
  part: 5
  title: Secret hygiene in action
