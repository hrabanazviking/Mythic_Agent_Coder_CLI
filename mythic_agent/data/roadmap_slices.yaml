schema: mythic.roadmap_slices/1
roadmap: Mythic Agent Coder — All-Features Roadmap (2026-10-30)
source_note: 'Generated from the roadmap''s own text (shelf copy MYTHIC_CODER_FEATURE_ROADMAP_2026-10-30.md,
  in-repo on main at docs/) by the M-017 generator; titles and summaries are the roadmap''s words, whitespace-normalised.
  Statuses are the campaign ledger''s: a slice is ''done'' only when banked with its full suite green
  (CAMPAIGN_STATE.md), ''queued'' otherwise. No slice is ever marked done by this file alone.'
