schema: mythic.mouse_manners/1
slice: M-188
part: 8
part_title: The Beautiful Face
canon_note: 'Mouse manners - click, drag-select, scroll, and links that open files at line numbers in the user''s
  editor. A gesture is held whole - under its title, the area it lives in in the closed vocabulary (chat, terminal,
  editor, review, settings, onboarding, lessons, command palace), its kind in the closed vocabulary (click, drag-select,
  scroll, link), the mouse road that reaches it, named as data, and its detail. A gesture naming no mouse road is
  held honestly with an empty road: it stands unwired, named in its gaps, and no road is invented for it. The gesture
  guide is DERIVED at call time from the held gestures roads alone - never a second stored copy that could drift
  - and a stored guide or wiring verdict on any record refuses by name. The file links are held as data: a link
  record naming its file, its line number and the user''s editor as its target; one record stands per file line,
  and holding a link opens no file and launches no editor. A record claiming a live pointer move, a live click or
  a file actually opened refuses by name. This file is ONE EXAMPLE BOOK, in the shape a real gesture file takes
  - the M-187 slice boundary - six gestures and two views, two link records, with its one pinned panel of the every-gesture
  view, whose shown gestures stand five wired of six, so the book verdict under it stands strained; under the wired
  view, whose five shown gestures all stand wired, the verdict stands open. A real book is a new file in this same
  shape - it is never this file edited in place. This layer moves no pointer, clicks nothing, scrolls nothing and
  opens no file: it holds mouse manners as data and tells it.'
guide:
  title: Mouse manners at the M-187 slice boundary
gestures:
- gesture_id: gesture-open-file-link
