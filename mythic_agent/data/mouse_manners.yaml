  source: mouse manners
  origin_session: session-m188
- gesture_id: gesture-place-cursor
  seq: 2
  title: Place the cursor
  area: editor
  gesture: click
  road: left click
  detail: In the editor, a left click places the cursor where the pointer stands - the words typed after it land
    there, and nothing moves until the click.
  recorded_on: '2026-11-09'
  actor: the coordinator
  source: mouse manners
  origin_session: session-m188
- gesture_id: gesture-drag-select
  seq: 3
  title: Drag to select text
  area: editor
  gesture: drag-select
  road: drag
  detail: In the editor, dragging across text selects it - the selection stands ready to copy, cut or hand to the
    coder. The keyboard book left this act unreachable by keyboard; the drag is the mouse road that reaches it.
  recorded_on: '2026-11-09'
  actor: the coordinator
  source: mouse manners
  origin_session: session-m188
- gesture_id: gesture-scroll-transcript
  seq: 4
  title: Scroll the transcript
  area: chat
  gesture: scroll
  road: wheel
  detail: On the chat screen, the wheel scrolls the transcript - back to what was said, forward to what is new -
    and the place in the words is kept while it turns.
  recorded_on: '2026-11-09'
  actor: the coordinator
  source: mouse manners
  origin_session: session-m188
- gesture_id: gesture-touch-pan
  seq: 5
  title: Pan the review by touch
  area: review
  gesture: scroll
  road: ''
  detail: Panning the review by touch names no mouse road in this book - a touch is not a mouse road held here -
    so the gesture stands unwired by mouse honestly, named in its gaps until a mouse road is held for it, and no
    road is invented here.
  recorded_on: '2026-11-09'
  actor: the coordinator
  source: mouse manners
  origin_session: session-m188
- gesture_id: gesture-click-approve
  seq: 6
  title: Approve a tool call
  area: review
  gesture: click
  road: left click
  detail: At a review, a left click on the approval card approves the tool call as named on it - approval is one
    deliberate click, and a stray click anywhere else answers no.
  recorded_on: '2026-11-09'
  actor: the coordinator
  source: mouse manners
  origin_session: session-m188
