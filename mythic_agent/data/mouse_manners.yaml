  title: Open a file link at its line
  area: chat
  gesture: link
  road: click
  detail: On the chat screen, a file link names its file and its line as data, and a click on it is the mouse road
    to the user's editor at that line - the link records hold the file, the line and the editor target, and holding
    them here opens nothing.
