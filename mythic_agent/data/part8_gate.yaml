exercises:
  - id: stranger_test
    title: The Stranger Test
    owning_slices:
      - M-183
      - M-184
      - M-186
    status: completed
    evidence_kind: pure-roads-measured
    evidence: >
      The sitting as recorded: the walk is the shipped M-184
      onboarding walk's own five steps in held order, each of the
      stranger's three questions is answered by exactly the local
      doc the record names under the shipped M-186 road with no
      gaps, and the one error met builds whole under the shipped
      M-183 road with no gaps and its plain telling standing as
      its own fields - all re-derived live by the gate tests on
      every run.
    walked_on: "2026-11-10"
    stranger: a new user who had never opened the coder before the sitting
    guidance: docs only
    task: >-
      In a scratch repo, fix the failing greeting test so the
      greeting names the visitor, then show the finished diff.
    limit_minutes: 30
    elapsed_minutes: 24
    walk_step_ids:
      - step-detect
      - step-walk
      - step-success
      - step-offer
      - step-configure
    questions:
      - question: how do I start my first task?
        doc_id: doc-first-task
      - question: how do I undo a commit?
        doc_id: doc-undo-commit
      - question: how do I use plain words?
        doc_id: doc-plain-words
    error:
      error_id: error-stranger-greeting-test
      seq: 1
      kind: broken
      title: A test broke
      happened: >-
        The greeting test failed: the greeting still said hello
        to no one, because the visitor's name was never passed in.
      meaning: >-
        The task is not finished while its own test fails - the
        greeting does not yet do the one thing the task asked.
      fix: >-
        Pass the visitor's name into the greeting, then run the
        test again.
      trace:
        - "FAILED scratch/test_greeting.py::test_greeting_names_the_visitor"
        - "AssertionError: 'hello' != 'hello, visitor'"
      detail: >-
        The stranger read the folded trace in the error's own
        card and fixed the call, not the test.
      recorded_on: "2026-11-10"
      actor: the stranger
      source: stranger test
      origin_session: session-stranger-test
    stumbles:
      - stumble_id: stumble-setup-first
        where: step-detect
        what: >-
          The onboarding doc opened with provider-key setup, and
          the stranger nearly configured keys before ever seeing
          a first success.
        resolution_kind: doc-correction
        resolution: >-
          Doc correction: the onboarding doc now opens with the
          success-before-configuration ordering rule, and setup
          waits until after the first success.
      - stumble_id: stumble-undo-hunt
        where: step-walk
        what: >-
          The stranger hunted for undo in the menus after the
          commit step and could not find its plain-words entry.
        resolution_kind: fix
        resolution: >-
          Fix: the undo entry in the slash-command palace now
          shows its plain-words question-box example, so the
          docs' undo answer is findable from the palace.
