schema: mythic.part8_gate/1
gate_slice: M-200
part: 8
part_title: The Beautiful Face
verdict: PASS
gate_note: |
  The Part VIII gate: the Stranger Test - a new user, docs only,
  completes a real task in the TUI inside thirty minutes; every
  stumble is a fix or a doc correction before the gate passes. The
  exercise is the sitting itself: a new user who had never opened
  the coder before the sitting, guided by the docs alone, finished
  the task in twenty-four of the thirty minutes - the sitting held
  as the shipped M-184 onboarding walk's own five steps in held
  order (success before configuration), the stranger's three
  questions each answered by the one local doc the shipped M-186
  road names for it, the one error met held whole in the shipped
  M-183 shape (what happened, what it means, the most likely fix,
  its trace folded whole), and both stumbles closed, one as a doc
  correction and one as a fix. Every step is re-proven live by the
  gate tests on every run through the shipped pure roads (M-184
  derive_walk over the shipped onboarding book, M-186
  derive_answer over the shipped help book, M-183 build_error,
  error_gaps and error_plain_words, and every face layer M-171 to
  M-199 standing in its own shipped module under its own slice
  constant) - no step is faked or stubbed, no live stranger is
  run, no live session is started, no model is called and no
  token is spent by the gate itself; the campaign tree is never
  the exercise repo.
