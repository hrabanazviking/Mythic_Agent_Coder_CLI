schema: mythic.mentions/1
slice: M-148
part: 7
part_title: Memory & Context
canon_note: |
  The @-mention canon: one grammar for pulling
  anything into context - @file, @folder, @symbol,
  @url, @image, @session, @issue. A mention canon
  book holds one mention per pull named in text,
  in held order: each mention names its kind in
  the closed set the roadmap itself names (file,
  folder, symbol, url, image, session, issue),
  its target judged against its kind, the exact
  text that named it, its source, and the
  plain-words reason WHY it is pulled. A mention
  names no plan of its own, because the PLAN is
  DERIVED from the mention: the shipped road that
  would pull that kind into context, what that
  road does, and what it would pull - named,
  never run. The INDEX is likewise derived from
  the whole book: its rows are the mentions'
  plans and its totals are the mentions' own
  counts, and a stored plan or index that
  disagrees with its derived shape is refused.
  The bare form (@src/main.py, the form the
  shipped explicit-files road already resolves)
  parses as a file mention; every other kind is
  named in its typed form, @kind:target, and an
  unknown kind refuses plainly. This file is ONE
  EXAMPLE CANON, in the shape a real canon file
  takes: the M-147 slice boundary - one mention
  of every kind, with the one plan of each and
  the one index of the book. A real canon is a
  new file in this same shape - it is never this
  file edited in place. This layer holds the
  grammar as data only: it reads no file, fetches
  no page, compiles no context and persists
  nothing - parsing and planning pull nothing in.
