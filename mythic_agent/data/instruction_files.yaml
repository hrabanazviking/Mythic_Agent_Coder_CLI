schema: mythic.instruction_files/1
slice: M-149
part: 7
part_title: Memory & Context
canon_note: |
  Instruction files unified: AGENTS.md (the AAIF
  standard), RULES.AI.md (ours), CLAUDE.md and kin
  read in one precedence order, shown in the panel
  with their sources - foreign projects' files are
  honoured on their own turf. An instruction-files
  book holds one entry per instruction file in
  force, in held order: each entry names its
  filename in the closed canon this slice names
  (RULES.AI.md, AGENTS.md, .mythic.md, .mythic,
  CLAUDE.md, .muserules, .cursorrules,
  .aider.rules.md - the shipped instruction
  resolver's own set plus RULES.AI.md, the one
  filename that set lacks), the origin that
  filename truly carries (ours, standard or
  foreign - a filename named with any other origin
  refuses, so a foreign file is never claimed as
  ours), its path, its source, its layer and the
  plain-words reason it stands. An entry names no
  rank of its own, because the RANK is DERIVED
  from its filename and layer: the layer ranks
  first, in the shipped order (system, repo, dir,
  file), and inside one layer the filenames rank
  in the canon's precedence order. The PANEL is
  likewise derived from the whole book: its rows
  are the entries carried whole with their ranks,
  in precedence order, and its totals are the
  entries' own counts, and a stored panel that
  disagrees with its derived shape is refused.
  This file is ONE EXAMPLE BOOK, in the shape a
  real book file takes: the M-148 slice boundary -
  six files in force across the repo and dir
  layers, of every origin, with the one panel of
  the book. A real book is a new file in this same
  shape - it is never this file edited in place.
  This layer holds the account as data only: it
  writes, renames and applies no file itself,
  beyond the reading the shipped instruction
  resolver already does when a workspace is
  scanned, and a scan leaves every file
  byte-identical.
guide:
