schema: mythic.graph_retrieval/1
slice: M-152
part: 7
part_title: Memory & Context
canon_note: |
  Retrieval over the code graph: vector RAG
  (existing) married to Part III's symbol graph -
  retrieval returns connected code, not confetti.
  A graph-retrieval book holds one bundle per
  retrieval, in held order: each bundle names its
  query, the seeds it grew from (ranked hits from
  the shipped semantic road, a vector provider, the
  symbol road, or a manual naming - each carrying
  its file, its symbol where it names one, its
  score and its source), and the connected pieces
  the shipped symbol graph grew from those seeds,
  in deterministic ranked order - every piece
  carrying its relation, its distance from its
  seed, its seed's score and its provenance. A seed
  the graph cannot answer for stands in the
  bundle's skipped with its reason, and pieces
  beyond the node cap are counted in omitted,
  never silently dropped. The PANEL is derived
  from a bundle: its rows are the pieces carried
  whole, in ranked order, and its totals are the
  pieces' own counts, and a stored panel that
  disagrees with its derived shape is refused.
  This file is ONE EXAMPLE BOOK, in the shape a
  real book file takes: the M-151 slice boundary -
  one retrieval whose semantic seed names the
  compaction glass-box record, grown one hop
  through the graph into the panel defined beside
  it, the agent road that calls it, the token
  estimator it calls, a test that references it,
  and the budget file its own file imports, with
  the one panel of the book. A real book is a new
  file in this same shape - it is never this file
  edited in place. This layer holds retrievals as
  data only: it calls no model, edits no code,
  assembles no live context and persists nothing.
