part_title: Agents as files
dealer: coordinator
plan_note: |
  Task dealing: the dealing as data. A plan's slices
  are dealt to the crew by office fit and current
  load - a slice goes first to a member holding the
  office its work fits, and among equally fitting
  members to the least loaded, casting order
  breaking ties - and the human may re-deal any
  slice to another member. This file is ONE EXAMPLE
  PLAN in the shape a real plan's file takes: the
  next ten roadmap slices, M-125 to M-134, each
  naming the office its work fits, dealt against
  the shipped M-121 casting. A real plan is a new
  file in this same shape, dealt for that plan's
  slices - it is never this file edited in place.
  The roadmap names the board (Part VIII) as where
  a dealing will be visible; that board does not
  exist yet, so this dealing is visible through
  this slice's own /dealing screen, and nothing
  here claims a board exists. This layer deals as
  data only: it starts no crew and spawns no agent
  itself.
