schema: mythic.fuzzy_picker/1
slice: M-175
part: 8
part_title: The Beautiful Face
canon_note: 'The Fuzzy Everything Picker: files, symbols, commands, sessions, models and themes under
  one fuzzy finder grammar everywhere. A query is read into word tokens by the one token road whatever
  kind it ranges over, and a candidate''s score is derived from those tokens against the candidate''s
  own label, tags and detail - never stored, never ranked by hand. A kind filter narrows which candidates
  stand in a search, never how they are judged. Candidates are composed from the shipped rooms the picker
  ranges over - an instruction file, a charter screen''s symbol, a capability-table model, a multi-session
  session, a baseline-named theme - each held with its provenance whole. The M-171 charter judged the
  subagent picker modal (its S-06 row) KEEP and names M-175 as an owning slice: the heading takes plain
  words first (its K-01 judgement strains), and the auto-dismiss on change is re-judged here (its K-09
  judgement strains) - in the picker''s own shape a search commits no choice at all, so there is nothing
  a browsing keystroke can commit by accident. This file is ONE EXAMPLE BOOK, in the shape a real picker
  file takes: the M-174 slice boundary - eight candidates, one of every room the picker ranges over and
  two more besides, two searches, and the one pinned panel of the approval search, whose matches span
  four kinds, so the book''s verdict under it stands matched; under the viking search the verdict stands
  focused. A real book is a new file in this same shape - it is never this file edited in place. This
  layer holds candidates and searches as data only - it opens nothing, executes nothing, renders no live
  UI, sends nothing, posts nothing, schedules nothing, calls no model and persists nothing: a match held
  here is a finding, never the act of opening the thing found.'
