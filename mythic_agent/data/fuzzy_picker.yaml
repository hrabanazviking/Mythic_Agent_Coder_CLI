  account:
  - 'The fuzzy picker holds 8 candidates as of 2026-11-09: the search ''approval'' under the all filter
    matches 5 of them: file 2, symbol 1, command 1, session 1.'
  - Rows stand in ranked order, best match first, so two panels of one search diff cleanly, line by line.
  - Every score is derived from the query's tokens against the candidate's own label, tags and detail
    - no score is stored on any candidate, and no rank is chosen.
  - 'The panel''s words are plain words first, and a search only ever looks: it opens no file, runs no
    command, loads no model, applies no theme and joins no session.'
