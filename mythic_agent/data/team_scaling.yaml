  account:
  - 'The endeavour book holds 5 endeavours as of 2026-11-11: the view ''all'' shows 5 of them: complete
    3, open 2; 3 of the shown endeavours stand complete.'
  - Rows stand in held endeavour, the endeavour the book itself stands in, so two panels of one view diff
    cleanly, segment by segment.
  - Every segment is derived from its endeavour's own fields - the campaign it answers for, the steps
    it walked in the open and the evidence it honestly carries - and no judgement is stored on any endeavour.
  - 'Completeness is grained from the held records alone: a endeavour that steps outside the endeavour
    sequence, carries a bare claim in place of held evidence, or has not scoped served stands open, named
    in its gaps, and the endeavour index is derived from the held endeavours, never stored where it could
    drift.'
