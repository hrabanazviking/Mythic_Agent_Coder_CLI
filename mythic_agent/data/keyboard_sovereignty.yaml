  origin_session: session-m187
modes:
- mode_id: mode-off
  seq: 1
  mode: 'off'
  title: The prompt as it stands
  detail: With the vim-mode option off, the prompt takes plain typing exactly as it stands - every key types
    at the prompt, and no mode stands between the hands and the words.
  grammar:
  - Every key types at the prompt, as it stands.
  recorded_on: '2026-11-09'
  actor: the coordinator
  source: keyboard sovereignty
  origin_session: session-m187
- mode_id: mode-vim
  seq: 2
  mode: modal
  title: Vim-mode prompt
  detail: With the vim-mode option held, the prompt speaks the modal grammar - normal mode moves and edits,
    insert mode types - for those whose hands speak it. The option stands held as data here; holding it
    switches no live prompt.
  grammar:
  - Esc - leave insert and return to normal mode.
  - i - enter insert at the prompt.
  - h and l - move along the line in normal mode.
  - dd - clear the line in normal mode.
  recorded_on: '2026-11-09'
  actor: the coordinator
  source: keyboard sovereignty
  origin_session: session-m187
