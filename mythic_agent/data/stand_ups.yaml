schema: mythic.stand_ups/1
slice: M-134
part: 6
part_title: Agents as files
standup_note: |
  Stand-ups: the coordinator's progress digest in
  plain words, as data. A stand-up report holds
  progress entries - one item of work per entry:
  its title, the item in plain words, the member
  who holds it, and the state the item stands in
  (done, doing, blocked, or waiting on the human's
  word). The digest is derived from the entries
  alone: its four sections - done, doing, blocked
  and needs-you - group the entries by the state
  each one stands in, in report order, so the
  digest can never disagree with the entries it
  digests, and a stored digest that does disagree
  is refused. This file is ONE EXAMPLE STAND-UP
  in the shape a real stand-up file takes: the
  stand-up at the M-133 slice boundary, with the
  crew memory banked, the stand-ups slice itself
  being built, the full suite held by the known
  PortAudio environment case, and one question
  that needs Volmarr's word held open. A real
  stand-up is a new file in this same shape - it
  is never this file edited in place. This layer
  holds the stand-up as data only: it schedules
  nothing, sends nothing, posts nothing, persists
  nothing and calls no model.
report:
  title: "Stand-up at the M-133 slice boundary"
  boundary: M-133
entries:
