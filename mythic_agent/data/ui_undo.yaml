schema: mythic.ui_undo/1
slice: M-198
part: 8
part_title: The Beautiful Face
canon_note: 'UI undo - closing a pane or clearing a view is never destructive to work; view state per
  session persists. The M-171 charter names NO row for this slice, so there is no charter verdict for
  this slice to honour; the slice is built to the roadmap words alone. A pane is held whole - under its
  title, its kind in the closed vocabulary (pane, view, panel, tab), its cursor held honestly (an unknown
  cursor stands empty, never invented), the view state it preserves, named as data, and its detail. A
  pane naming no preserved state is held honestly with an empty state: it stands incomplete, named in
  its gaps, and no state is invented for it. The undo index is DERIVED at call time from the held panes
  alone - never a second stored copy that could drift - and a stored index or completeness verdict on
  any record refuses by name. The notes are held as data: a note record naming its pane, its stance (note,
  concern, praise or question) and what it feeds back toward; one record stands per pane stance, and holding
  a note applies none of it. A record claiming a pane was actually restored, a view actually reopened,
  or work actually destroyed, refuses by name. This file is ONE EXAMPLE BOOK, in the shape a real undo
  file takes - the M-197 slice boundary - six panes and two views, two note records, with its one pinned
  panel of the every-pane view, whose shown panes stand five ready of six, so the book verdict under it
  stands strained; under the ready view, whose five shown panes all stand ready, the verdict stands open.
  A real book is a new file in this same shape - it is never this file edited in place. This layer restores
  nothing, reopens nothing, destroys no work, opens no network and writes nothing: it holds the preserved
  views as data and tells them.'
