  account:
  - 'The upkeep book holds 5 upkeeps as of 2026-11-10: the view ''all'' shows 5 of them: complete 3, open
    2; 3 of the shown upkeeps stand complete.'
  - Rows stand in held order, the order the book itself stands in, so two panels of one view diff cleanly,
    segment by segment.
  - Every segment is derived from its upkeep's own fields - the slice it answers for, the steps it walked
    in the open and the evidence it honestly carries - and no judgement is stored on any upkeep.
  - 'Completeness is mapped from the held records alone: a upkeep that steps outside the upkeep sequence,
    carries a bare claim in place of held evidence, or has not reached sealed stands open, named in its
    gaps, and the upkeep index is derived from the held upkeeps, never stored where it could drift.'
