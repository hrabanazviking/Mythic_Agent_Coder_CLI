- id: rename
  title: Cross-file rename
  owning_slices:
  - M-046
  - M-050
  - M-051
  status: completed
  evidence_kind: fake-server-measured
  old_name: compute_total
  new_name: summarise_total
  files: 2
  sites: 4
  evidence: compute_total renamed to summarise_total in helpers.py (definition + its module-level
    call) and main.py (the import + its call) — 4 sites in 2 files — through the LSP rename
    road's WorkspaceEdit, applied through the EditJournal road; the symbol graph proves the
    cross-file reference before the rename and its absence after, and the exercise's hidden
    grading tests pass 3/3.
  seed_files:
  - path: helpers.py
    content: "def compute_total(items):\n    return sum(items)\n\n\nVALUE = compute_total([1,\
      \ 2])\n"
  - path: main.py
    content: 'from helpers import compute_total


      RESULT = compute_total([3, 4])

      '
  grading_file:
    path: test_grading.py
    content: "from helpers import VALUE, summarise_total\nimport main\n\n\ndef test_renamed_function_works():\n\
      \    assert summarise_total([1, 2, 3]) == 6\n\n\ndef test_helpers_value_uses_renamed_function():\n\
      \    assert VALUE == 3\n\n\ndef test_main_result_uses_renamed_function():\n    assert\
      \ main.RESULT == 7\n"
  grading_tests: 3
- id: codemod
  title: Structural codemod
  owning_slices:
  - M-047
  - M-048
  status: completed
  evidence_kind: structural-measured
  pattern: legacy_add($A, $B)
  replacement: add($A, $B)
  sites: 2
  evidence: Every legacy_add($A, $B) call site (2, in calc.py) rewritten to add($A, $B) through
    the structural rewrite road — planned with per-site diff previews, applied through the
    EditJournal road only for the file exactly as planned; the legacy definition itself is
    untouched, and the exercise's hidden grading tests pass 2/2.
  seed_files:
  - path: calc.py
    content: "def add(a, b):\n    return a + b\n\n\ndef legacy_add(a, b):\n    return add(a,\
      \ b)\n\n\nSUM = legacy_add(1, 2)\nTOTAL = legacy_add(SUM, 3)\n"
  grading_file:
    path: test_grading.py
    content: "from pathlib import Path\n\nimport calc\n\n\ndef test_codemod_results_still_compute():\n\
      \    assert calc.SUM == 3\n    assert calc.TOTAL == 6\n\n\ndef test_no_legacy_call_sites_remain():\n\
      \    source = Path(calc.__file__).read_text(encoding='utf-8')\n    assert source.count('legacy_add(')\
      \ == 1  # the definition only\n    assert 'add(1, 2)' in source and 'add(SUM, 3)' in\
      \ source\n"
  grading_tests: 2
