schema: mythic.accessibility_verification/1
slice: M-199
canon_note: 'Accessibility verification - M-016''s tests re-run as gates: keyboard-only completion, contrast, reduced
  motion, no-colour play. The M-171 charter names NO row for this slice, so there is no charter verdict for this
  slice to honour; the slice is built to the roadmap words alone. A gate is held whole - under its title, its kind
  in the closed vocabulary (keyboard, contrast, motion, colour), its measure held honestly (an unknown measure stands
  empty, never invented), the evidence it carries, named as data, and its detail. A gate naming no held evidence
  is held honestly with empty evidence: it stands incomplete, named in its gaps, and no evidence is invented for
  it. The verification index is DERIVED at call time from the held gates alone - never a second stored copy that
  could drift - and a stored index or completeness verdict on any record refuses by name. The notes are held as
  data: a note record naming its gate, its stance (note, concern, praise or question) and what it feeds back toward;
  one record stands per gate stance, and holding a note applies none of it. A record claiming a check was actually
  run, a gate actually passed live, or a reader actually launched, refuses by name. This file is ONE EXAMPLE BOOK,
  in the shape a real verification file takes - the M-198 slice boundary - six gates and two views, two note records,
  with its one pinned panel of the every-gate view, whose shown gates stand five ready of six, so the book verdict
  under it stands strained; under the ready view, whose five shown gates all stand ready, the verdict stands open.
  A real book is a new file in this same shape - it is never this file edited in place. This layer runs no check,
  measures nothing live, launches no reader, opens no network and writes nothing: it holds the gates as data and
  tells them.'
