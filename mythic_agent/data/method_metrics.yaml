    open 2; 3 of the shown readings stand complete.'
  - Rows stand in held reading, the reading the book itself stands in, so two panels of one view diff
    cleanly, segment by segment.
  - Every segment is derived from its reading's own fields - the campaign it answers for, the steps it
    walked in the open and the evidence it honestly carries - and no judgement is stored on any reading.
  - 'Completeness is weighed from the held records alone: a reading that steps outside the reading sequence,
    carries a bare claim in place of held evidence, or has not taken posted stands open, named in its
    gaps, and the reading index is derived from the held readings, never stored where it could drift.'
