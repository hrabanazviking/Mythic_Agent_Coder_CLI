schema: mythic.cost_court/1
slice: M-140
part: 6
part_title: Agents as files
court_note: |
  Cost court: crew runs report cost per member
  per slice; the Scribe keeps the ledger that
  Part XI's efficiency work reads. A court book
  holds one run record per model run of the crew
  run, in held order: each record names the
  member who ran, the slice the run served, the
  model and the input / output tokens - and
  names no cost, because a record's cost is
  derived from the shared rate table
  (core/costs.py), never stored on the record. A
  report of one member's cost on one slice is
  derived from that pair's records - its calls,
  token totals, cost, unpriced count and account
  read off the records - and a stored report that
  disagrees with the derived one is refused. The
  Scribe's ledger is derived from the whole
  book: its rows are the per-member-per-slice
  reports in the order the records first name
  them, its totals are the rows' sums and its
  account is read off the rows; a stored ledger
  that disagrees refuses. This file is ONE
  EXAMPLE COURT BOOK in the shape a real court
  file takes: the M-139 boundary run - the forge
  worker's two priced calls and the auditor's one
  priced call on M-139, and the Scribe's two
  calls on M-138, one of them on a model the rate
  table does not know, priced at $0 and counted
  unpriced - and the Scribe's one ledger of it.
  A real court book is a new file in this same
  shape - it is never this file edited in place.
  This layer holds costs as data only: it calls
  no model, bills no one and charges nothing.
