schema: mythic.part5_gate/1
gate_slice: M-120
part: 5
part_title: Autonomy & Safety
verdict: PASS
gate_note: |
  The Part V gate: an overnight-style autonomous run on a benchmark-pack-style
  task (seed repo + hidden grading tests, the M-008 pattern) under the
  Trusted Forge posture (M-095) — the run's grading command confined by an
  OS sandbox plan with the network denied (M-097, sandbox on), its spend
  judged within a per-task budget (M-107, budgets on), every act recorded
  in an append-only audit trail that exports complete (M-109), and every
  command the run executes judged on the destructive-command ladder
  (M-111) with zero doctrine violations: no irreversible or costly act
  runs, the one destructive command the exercise names is judged and
  held, never executed, and the safety regression gate (M-117) and the
  red-team pack (M-118) stand banked behind the run. Every step is
  re-proven live by the gate tests on every run through the shipped pure
  roads (stored_profile, build_confinement_plan, judge_budget,
  AuditRegistry / export_trail, judge_command) — no step is faked or
  stubbed, no model is run and no token is spent, and the campaign tree
  is never the exercise repo.
