schema: mythic.compaction_glassbox/1
slice: M-151
part: 7
part_title: Memory & Context
canon_note: |
  Compaction v2, glass-box: when context compacts,
  the summary is shown, editable, and kept in the
  journal beside what it replaced; nothing the
  coder "forgets" is unrecoverable. A compaction
  glass-box book holds one record per compaction,
  in held order: each record names what was
  compacted (the replaced material, kept whole or
  by journal reference), the summary that replaced
  it - held as its versions, in order, the current
  summary the last of them - its source among the
  shipped compaction roads, and its journal
  position, beside what it replaced. The PANEL is
  derived from the whole book: its rows are the
  records carried whole, in journal order (journal
  position first, then record id), and its totals
  are the records' own counts, and a stored panel
  that disagrees with its derived shape is
  refused. An edit appends a new summary version
  and keeps every earlier one - never a silent
  rewrite. This file is ONE EXAMPLE BOOK, in the
  shape a real book file takes: the M-150 slice
  boundary - three compactions, one of each
  shipped road, one holding its material by journal
  reference alone and one carrying an edited
  summary, with the one panel of the book. A real
  book is a new file in this same shape - it is
  never this file edited in place. This layer
  holds compactions as data only: it compacts no
  live context, calls no model, archives no message
  and persists nothing.
