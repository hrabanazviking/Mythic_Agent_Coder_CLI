schema: mythic.private_by_architecture/1
slice: M-167
part: 7
part_title: Memory & Context
canon_note: 'Private by architecture: memories live in the workspace/ user stores; nothing
  syncs anywhere unless Part X bridges are explicitly opened by the user. A posting stands
  over one stored memory, named by the kind of holding it stands in (the project memory
  map, session memory, cross-project memory, the self-improving ledger, crew memory, the
  subconscious v2, the contradiction watch, a vector record, or a memory held by hand) and
  the shipped piece id alone - the piece own words never cross into the posting. The posting
  names the store the memory lives in, the workspace store or the user store, and the one
  Part X bridge the user has explicitly opened over it - which bridge, who opened it and
  the day - or that no bridge stands open over it at all, with who recorded the posting and
  the session it was raised in. The standing is derived, never chosen: sealed while no
  bridge stands open, bridge-open only through the one named bridge the user opened. One
  stored memory is posted once in a book, so the privacy standing never forks. The PRIVACY
  PANEL is derived from the whole book: its rows are the postings carried whole, by home -
  the workspace store first, then the user store - then title, then posting id, each showing
  its boundary, and a stored panel that disagrees with its derived shape is refused. The
  PRIVACY VERDICT is derived for the whole book: sealed while nothing stands open, guarded
  when one or two stand open at the user own hand, and bridged when three or more have been
  opened through Part X bridges. This file is ONE EXAMPLE BOOK, in the shape a real book
  file takes: the M-166 slice boundary - five postings standing over the campaign own stored
  memories at the close of the contradiction watch day, four sealed in their stores and one
  carried out through the export bridge the user explicitly opened, with the one panel of
  the book read as of that day. A real book is a new file in this same shape - it is never
  this file edited in place. A posting moves nothing: the memory itself is never carried
  anywhere by it, and the bridges are Part X roads, not this layer. This layer holds
  postings as data only: it sends nothing, posts nothing, schedules nothing, calls no model,
  persists nothing, syncs nothing and writes no live memory.'
