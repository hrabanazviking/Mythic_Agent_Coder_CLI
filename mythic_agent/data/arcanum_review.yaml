scope_note: 'The arcanum review: the 116 KB standalone Golden Dawn tarot TUI at arcanum/arcanum.py mapped section by section — what each section owns, what it duplicates in the mythic_agent package, and the verdict for Parts III, VI, and VII. ARCHITECTURE.md already names arcanum/ an adjacent project, not part of the core turn pipeline; this review proves that judgement section by section and records the three defects the review itself proved, all fixed in-slice.'
overall_verdict: 'LEAVE arcanum/ as a standalone adjacent project: Parts III, VI, and VII absorb nothing — it holds no code-intelligence surface (Part III), no agents or delegation (Part VI), and no retrievable memory (Part VII). The two real duplication risks are recorded as findings with their absorbing parts named (config/key custody -> Kista via Part II M-032; the AI reading -> the package OpenRouterProvider via Part II), so a future integration has its roads marked without this review moving any code.'
