defects:
- id: D-01
  name: 'arcanum.py did not compile: a lost return and a lost def line'
  section: 'rendering-engine (A-10)'
  evidence: 'py_compile failed at line 1259: commit fd6fd7b (an agent content replacement) dropped 11 lines — render_card_mini''s return statement and the ''def ai_reading'' line — leaving a bare parameter list where the function definition belonged. The app could not start at all.'
  status: fixed-in-slice
  fix: 'FIXED in-slice (M-011): the 11 lines were restored byte-exactly from the last compiling revision 86bd5aa (verified: after restoration the file was byte-identical to 86bd5aa before the D-02/D-03 repairs), and a compile gate now lives in tests/test_arcanum_review.py.'
- id: D-02
  name: 'render_celtic_cross_layout was called but never defined'
  section: 'reading-flow (A-12) calling rendering-engine (A-10)'
  evidence: 'do_reading calls render_celtic_cross_layout for the celtic_cross spread; the name exists in no revision of the file (checked every committed revision), so every Celtic Cross reading died on a NameError, swallowed by main()''s catch-all as a generic error line.'
  status: fixed-in-slice
  fix: 'FIXED in-slice (M-011): a minimal cross-and-staff text layout renderer was added to the rendering engine, built on the spread''s own position names, and is exercised by tests with a full 10-card Celtic Cross.'
- id: D-03
  name: 'the reversal_pct setting was never wired to the draw'
  section: 'configuration (A-07) / tarot-deck-classes (A-08) / reading-flow (A-12)'
  evidence: 'Settings let the user set reversal_pct and save it, but TarotDeck.draw hardcoded a 0.35 reversal roll and do_reading never passed the setting — the setting changed nothing.'
  status: fixed-in-slice
  fix: 'FIXED in-slice (M-011): draw() takes reversal_pct (default 35, the old hardcoded value) and do_reading passes config''s reversal_pct; tests prove 0% draws nothing reversed and 100% draws everything reversed.'
findings:
- id: F-01
  name: 'plaintext API key in ~/.arcanum/config.json'
  note: 'Against the campaign law (secrets live in Kista) if this were package code. It is a standalone adjacent app''s own config; recorded, not rewritten — any future integration routes key custody through Kista (Part II, M-032).'
- id: F-02
  name: 'ai_reading bypasses the package provider layer'
  note: 'A raw requests.post to OpenRouter with its own key handling and no retry honesty or usage accounting. Any future absorption goes through mythic_agent/providers/openrouter.py (Part II), never by copying this function.'
- id: F-03
  name: 'saved readings are write-only'
  note: 'save_reading writes one unversioned JSON file per reading and the app has no reader for them. Noted for any future arcanum work; it is not a Part VII memory slice — nothing retrieves these files.'
