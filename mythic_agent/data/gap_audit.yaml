baseline_failures:
- test: tests/test_provider_protocol.py::test_empty_model_name_raises_provider_error[AnthropicProvider]
  verdict: product-defect
  fixed_in: M-003
  evidence: >
    Passing model="" explicitly was treated as 'no model named' via
    kwargs.pop("model", None) or self.model, silently substituting the
    default model (claude-sonnet-4-5) and proceeding to build the live SDK
    client - which in this VM raises a raw ValueError from httpx URL
    parsing of the proxy no_proxy IPv6 entries, and anywhere else would
    attempt a real call with the wrong model. Fixed: an explicitly empty
    model name now raises ProviderError before any client is built, in
    both anthropic.py and google.py. Test passes.
- test: tests/test_provider_protocol.py::test_empty_model_name_raises_provider_error[GoogleProvider]
  verdict: product-defect
  fixed_in: M-003
  evidence: >
    Same defect as the Anthropic parameter (default gemini-2.0-flash
    silently substituted for an explicitly empty model name); same fix in
    google.py. Test passes.
- test: tests/test_context_compiler.py::test_truncate_text_boundary_behavior
  verdict: product-defect
  fixed_in: M-003
  evidence: >
    truncate_text's marker hard-cut branch sliced the marker by the
    heuristic chars-per-token estimate without checking the estimator:
    under the exact tiktoken backend the returned slice "... " costs 2
    tokens against a budget of 1, breaking the function's own contract.
    Fixed: the slice now shrinks until the estimator itself agrees it
    fits (budget.py). Test passes under both backends' pricing.
- test: tests/test_coverage_assault.py::test_providers_coverage_ratchet
  verdict: environment
  fixed_in: M-003
  evidence: >
    The ratchet runs coverage in a subprocess; the campaign baseline venv
    had no coverage package ('No module named coverage' in the report
    subprocess's stderr), so no report could be parsed. Healed by
    installing coverage into the untracked .venv-baseline; the ratchet
    then passed (78 s). No product or test code changed.
- test: tests/test_policy.py::test_tui_approval_controls_the_shared_executor_and_cancels
  verdict: test-timing
  fixed_in: M-003
  evidence: >
    Suite-context timing, not product behaviour: the modal does define
    its Allow button (mythic_agent/ui/components/modals.py compose,
    id="allow"), and the test passes solo and in small sets, but in
    full-suite runs its single early click raced the modal's
    mount/layout - first as NoMatches on '#allow' (the test polled only
    ~1 s for the screen class), then, after a wait-for-mount hardening,
    as pilot.click() returning False before layout settled; the
    orphaned worker thread then waited out the approval timeout.
    Hardened in-slice to a bounded click-retry loop (a missed click has
    no effect; a landed click approves exactly once; all assertions
    unchanged) and verified green in a full-suite run (2026-10-30
    22:15 EDT, 1428 passed / 2 known-environment failures).
