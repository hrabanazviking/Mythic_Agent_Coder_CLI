  account:
  - 'The order book holds 5 orders as of 2026-11-11: the view ''all'' shows 5 of them: complete 3, open
    2; 3 of the shown orders stand complete.'
  - Rows stand in held order, the order the book itself stands in, so two panels of one view diff cleanly,
    segment by segment.
  - Every segment is derived from its order's own fields - the campaign it answers for, the steps it walked
    in the open and the evidence it honestly carries - and no judgement is stored on any order.
  - 'Completeness is bound from the held records alone: a order that steps outside the order sequence,
    carries a bare claim in place of held evidence, or has not stated kept stands open, named in its gaps,
    and the order index is derived from the held orders, never stored where it could drift.'
