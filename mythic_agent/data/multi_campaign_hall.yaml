  - Every segment is derived from its campaign's own fields - the slice it answers for, the steps it walked in the open and the evidence it honestly carries - and no judgement is stored on any campaign.
  - 'Completeness is kept from the held records alone: a campaign that steps outside the campaign sequence, carries a bare claim in place of held evidence, or has not reached glanced stands open, named
    in its gaps, and the campaign index is derived from the held campaigns, never stored where it could drift.'
