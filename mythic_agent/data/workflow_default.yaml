  account:
  - 'The proposal book holds 5 proposals as of 2026-11-11: the view ''all'' shows 5 of them: complete
    3, open 2; 3 of the shown proposals stand complete.'
  - Rows stand in held proposal, the proposal the book itself stands in, so two panels of one view diff
    cleanly, segment by segment.
  - Every segment is derived from its proposal's own fields - the campaign it answers for, the steps it
    walked in the open and the evidence it honestly carries - and no judgement is stored on any proposal.
  - 'Completeness is declared from the held records alone: a proposal that steps outside the proposal
    sequence, carries a bare claim in place of held evidence, or has not proposed upheld stands open,
    named in its gaps, and the proposal index is derived from the held proposals, never stored where it
    could drift.'
