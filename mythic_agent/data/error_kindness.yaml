schema: mythic.error_kindness/1
slice: M-183
part: 8
part_title: The Beautiful Face
canon_note: >
  Error Kindness - every error states what happened, what it
  means, and the most likely fix in plain words, technical
  trace one key away; no raw stack ever lands on a user
  unaccompanied. An error is held whole - under its title,
  with what happened, what it means and the one most likely
  fix it names, each in plain words, and its technical trace
  lines held folded as data behind the one named trace
  action, unfolded whole by that action and never deleted.
  The plain telling is DERIVED from the held error's own
  fields: its three lines are the error's own happened,
  meaning and fix spoken under their plain headings, so
  there is no second hand-written telling that can drift.
  The ruling stands as data in the layer: an error record
  claiming to stand bare, standalone or unaccompanied
  refuses by name, and an error naming no fix refuses by
  name too. An error held with no trace folded stands
  named in its gaps - the gap is called trace - and does
  not stand whole; no trace is invented for it. This file
  is ONE EXAMPLE BOOK, in the shape a real error file
  takes - the M-182 slice boundary - six errors and two
  views, with its one pinned panel of the every-error
  view, whose shown errors stand four whole of six, so
  the book verdict under it stands strained; under the
  whole view, whose four shown errors all stand whole,
  the verdict stands open. A real book is a new file in
  this same shape - it is never this file edited in
  place. This layer fixes nothing and sends nothing:
  it tells.
guide:
  title: Error kindness at the M-182 slice boundary
errors:
- error_id: error-refused-push
  seq: 1
  kind: refused
  title: The push was refused
  happened: The shelf refused the push because the branch had moved since this work began.
  meaning: Someone else landed work first, so this push would have overwritten theirs.
  fix: Fetch the new work, set this work on top of it, and push again.
  trace:
  - 'To github.com:hrabanazviking/Mythic_Agent_Coder_CLI.git'
  - '! [rejected] feature-roadmap-build -> feature-roadmap-build (non-fast-forward)'
  - 'error: failed to push some refs'
  detail: The refused push, held as data - it tells what happened, what it means and the most likely fix in plain words, and its trace stands folded behind the trace key, so the error stands whole.
  recorded_on: '2026-11-09'
  actor: the coordinator
  source: error kindness
  origin_session: session-m183
- error_id: error-missing-file
  seq: 2
  kind: missing
  title: A needed file is missing
  happened: The build could not find the file mythic_agent/core/error_kindness.py.
  meaning: The build cannot start without that file, so nothing else in the build can be trusted until it stands again.
  fix: Restore the file from the last good copy, then run the build again.
  trace:
  - 'FileNotFoundError: [Errno 2] No such file or directory'
  - 'mythic_agent/core/error_kindness.py'
  detail: The missing file, held as data - told plainly from its own fields, with its trace folded whole behind the trace key, so the error stands whole.
  recorded_on: '2026-11-09'
  actor: the coordinator
  source: error kindness
  origin_session: session-m183
- error_id: error-broken-test
  seq: 3
  kind: broken
  title: A test broke
  happened: The test named test_panel_is_derived failed while the panel was being derived.
  meaning: The panel the code derives no longer matches the panel the test expects, so one of them has drifted from the book.
  fix: Read the derived panel beside the expected one, mend the one that drifted, and run the test again.
  trace:
  - 'FAILED tests/test_error_kindness.py::test_panel_is_derived'
  - 'AssertionError: the stored panel disagrees with the derived panel'
  detail: The broken test, held as data - told plainly from its own fields, with its trace folded whole behind the trace key, so the error stands whole.
  recorded_on: '2026-11-09'
  actor: the coordinator
  source: error kindness
  origin_session: session-m183
- error_id: error-timeout-call
  seq: 4
  kind: timeout
  title: A call ran out of time
  happened: The call to the shelf took longer than the waiting limit and was cut off.
  meaning: The answer may still exist on the shelf; this side simply stopped waiting for it.
  fix: Check the shelf once by hand, then run the call again with the same words.
  trace: []
  detail: The timed-out call, held as data - told plainly from its own fields, but no trace was folded when it was recorded, so the gap stands named as trace and the error does not stand whole. No trace is invented for it.
  recorded_on: '2026-11-09'
  actor: the coordinator
  source: error kindness
  origin_session: session-m183
- error_id: error-mismatch-count
  seq: 5
  kind: mismatch
  title: The counts do not agree
  happened: The banked count reads 182 in the ledger and 183 on the shelf.
  meaning: One of the two counts was written before the last banking landed, so they are counting different moments.
  fix: Count again from the shelf, which is the ground truth, and mend the ledger to match it.
  trace:
  - 'ledger: 182 of 272 banked'
  - 'shelf: 183 of 272 banked'
  detail: The mismatched counts, held as data - told plainly from its own fields, with its trace folded whole behind the trace key, so the error stands whole.
  recorded_on: '2026-11-09'
  actor: the coordinator
  source: error kindness
  origin_session: session-m183
- error_id: error-denied-key
  seq: 6
  kind: denied
  title: A key was turned away
  happened: The shelf turned the session key away at the door.
  meaning: The key this session carries is not the key the shelf expects, so the shelf will not speak with it.
  fix: Sign in again with the account the shelf expects, then run the step again.
  trace: []
  detail: The denied key, held as data - told plainly from its own fields, but no trace was folded when it was recorded, so the gap stands named as trace and the error does not stand whole. No trace is invented for it.
  recorded_on: '2026-11-09'
  actor: the coordinator
  source: error kindness
  origin_session: session-m183
