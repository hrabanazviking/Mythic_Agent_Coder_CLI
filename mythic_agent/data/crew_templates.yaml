schema: mythic.crew_templates/1
slice: M-143
part: 6
part_title: The Crew
templates_note: |
  Crew templates: saved formations summonable by
  name. A crew template book holds one template
  record per saved formation, in held order: each
  record names the formation in plain words, what
  it is for, and the seats it fields - every seat
  naming a member of the shipped casting (M-121).
  A record names no size and no member list,
  because both are derived from its seats: the
  member list is the seats read in order and the
  size is their count, so no formation can claim
  more members than its seats name. A roster of
  one formation is derived from its seats - its
  members, size and account read off the record -
  and a stored roster that disagrees with the
  derived one is refused. The template index is
  derived from the whole book: its rows are the
  per-formation rosters in held order, its totals
  are the records' own counts (every formation
  held, every seat named, every distinct member
  standing in them) and its account is read off
  the rows and totals; a stored index that
  disagrees refuses. This file is ONE EXAMPLE
  CREW TEMPLATE BOOK, in the shape a real crew
  templates file takes: the M-142 slice boundary -
  the roadmap's four named formations (Duo, Full
  Six, Research Swarm, Review Panel) built from
  the shipped casting, with the one template
  index of it. A real template book is a new file
  in this same shape - it is never this file
  edited in place. This layer holds templates as
  data only: it summons no crew, spawns no agent,
  runs nothing and persists nothing - summonable
  by name here means a name resolves to the
  validated formation record, nothing more.
