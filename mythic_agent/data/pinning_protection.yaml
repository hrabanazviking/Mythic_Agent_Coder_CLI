schema: mythic.pinning_protection/1
slice: M-159
part: 7
part_title: Memory & Context
canon_note: |
  Pinning and protection: files and facts the
  compaction may never drop - the task, the laws,
  the failing test - and pins are visible. A pin is
  one protected file or fact carried with its
  provenance whole: what is pinned, its kind, the
  reference it stands under, why it is protected,
  who pinned it, the day it was pinned on, and
  where it was read from. One thing is pinned once
  in a book: the same kind and reference named twice
  refuses. The PIN PANEL is derived from the whole
  book: its rows are the pins carried whole, by kind
  - the task first, then the laws, the failing test,
  the files, the facts - then by subject, then pin
  id, and its totals are the pins' own counts and
  its kind counts the pins' own tallies, and a stored
  panel that disagrees with its derived shape is
  refused. This file is ONE EXAMPLE BOOK, in the
  shape a real book file takes: the M-158 slice
  boundary - four pins standing at the close of the
  context-recipes day, the task, the Forge laws, the
  failing test and the sibling module file, with the
  one panel of the book. A real book is a new file in
  this same shape - it is never this file edited in
  place. This layer holds pins as data only: it
  compacts nothing, drops nothing, calls no model
  and persists nothing - a pin declares protection,
  it does not itself rewrite the live pruner.
