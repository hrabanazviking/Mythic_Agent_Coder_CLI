  account:
  - "The panel holds 9 project memory map entries: architecture 2, decision 2, gotcha 2, location 3."
  - "Sections stand in map order (architecture, then decision, then gotcha, then location) and, inside one section, by title - so two panels of the same map diff cleanly, line by line."
  - "The Scribe keeps this map as work proceeds: the map is updated in the same session as the work it records, never as a later chore."
  - "The panel is read off the held entries at call time - it is derived, never stored loose."
