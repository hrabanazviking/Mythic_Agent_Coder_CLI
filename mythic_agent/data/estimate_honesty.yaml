  account:
  - 'The estimate book holds 5 estimates as of 2026-11-11: the view ''all'' shows 5 of them: complete
    3, open 2; 3 of the shown estimates stand complete.'
  - Rows stand in held order, the order the book itself stands in, so two panels of one view diff cleanly,
    segment by segment.
  - Every segment is derived from its estimate's own fields - the slice it answers for, the steps it walked
    in the open and the evidence it honestly carries - and no judgement is stored on any estimate.
  - 'Completeness is measured from the held records alone: a estimate that steps outside the estimate
    sequence, carries a bare claim in place of held evidence, or has not reached calibrated stands open,
    named in its gaps, and the estimate index is derived from the held estimates, never stored where it
    could drift.'
