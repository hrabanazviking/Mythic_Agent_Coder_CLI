schema: mythic.dogfood/1
slice: M-141
part: 6
part_title: The Crew
dogfood_note: |
  The Mythic Coder building itself: the standing
  dogfood - each part of this road is built by the
  crew it improves, under the coordinator's
  discipline (as the October forge proved it can).
  A dogfood book holds one build record per build
  of the road, in held order: each record names the
  member who built and the slice built - and names
  no part, because a record's part is derived from
  the shipped roadmap itself, never stored on the
  record. A report of one part's builds is derived
  from that part's records - its entry ids, builds,
  slices, members and account read off the records -
  and a stored report that disagrees with the
  derived one is refused. The coordinator's ledger
  is derived from the whole book: its rows are the
  per-part reports in the order the records first
  name each part, its totals are the rows' sums and
  its account is read off the rows; a stored ledger
  that disagrees refuses. This file is ONE EXAMPLE
  DOGFOOD BOOK, in the shape a real dogfood file
  takes: the M-140 slice boundary - the Part V
  gate's one build, and Part VI's builds from the
  crew casting through the cost court, with the
  coordinator's one ledger of it. A real dogfood
  book is a new file in this same shape - it is
  never this file edited in place. This layer holds
  builds as data only: it builds nothing live, runs
  no crew and merges nothing.
