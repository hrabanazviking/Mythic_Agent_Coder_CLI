- id: B-14
  title: Write the missing tests for the bank account
  category: test-writing
  difficulty: medium
  prompt: 'account.py ships with a single starter test. Write a real suite in tests/test_account.py: at
    least six test functions covering deposits, withdrawals, the starting balance, and that overdrawing
    and non-positive amounts raise ValueError. Do not change account.py.'
  seed_files:
  - path: account.py
    content: |
      class BankAccount:
          def __init__(self, opening=0):
              self.balance = opening

          def deposit(self, amount):
              if amount <= 0:
                  raise ValueError("deposit must be positive")
              self.balance += amount
              return self.balance

          def withdraw(self, amount):
              if amount <= 0:
                  raise ValueError("withdrawal must be positive")
              if amount > self.balance:
                  raise ValueError("insufficient funds")
              self.balance -= amount
              return self.balance
  - path: tests/test_account.py
    content: |
      from account import BankAccount


      def test_opening_balance_defaults_to_zero():
          assert BankAccount().balance == 0
  solution_files:
  - path: tests/test_account.py
    content: |
      import pytest

      from account import BankAccount


      def test_opening_balance_defaults_to_zero():
          assert BankAccount().balance == 0


      def test_opening_balance_can_be_set():
          assert BankAccount(250).balance == 250


      def test_deposit_increases_balance():
          account = BankAccount(100)
          assert account.deposit(50) == 150
          assert account.balance == 150


      def test_withdraw_decreases_balance():
          account = BankAccount(100)
          assert account.withdraw(40) == 60


      def test_overdraw_raises():
          with pytest.raises(ValueError):
              BankAccount(10).withdraw(11)


      def test_non_positive_deposit_raises():
          with pytest.raises(ValueError):
              BankAccount().deposit(0)


      def test_non_positive_withdrawal_raises():
          with pytest.raises(ValueError):
              BankAccount(100).withdraw(-5)
  grading_tests: |
    import re
    from pathlib import Path

    TEXT = Path("tests/test_account.py").read_text(encoding="utf-8")

    def test_suite_has_at_least_six_test_functions():
        assert len(re.findall(r"^def test_", TEXT, re.M)) >= 6

    def test_suite_checks_the_error_paths():
        assert "ValueError" in TEXT
        assert "raises" in TEXT

    def test_suite_covers_deposit_and_withdraw():
        assert "deposit" in TEXT and "withdraw" in TEXT

    def test_module_itself_is_unchanged_behaviour():
        from account import BankAccount
        account = BankAccount(100)
        account.deposit(50)
        assert account.withdraw(40) == 110
  rubric:
  - Success and failure paths are both tested, errors via raises
  - Tests use fresh accounts, not shared state
- id: B-15
  title: Write the missing tests for temperature conversion
  category: test-writing
  difficulty: easy
  prompt: 'tempconv.py ships with a single starter test. Write a real suite in tests/test_tempconv.py:
    at least six test functions covering freezing and boiling points in both directions, Celsius to Kelvin,
    and a negative temperature. Do not change tempconv.py.'
  seed_files:
  - path: tempconv.py
    content: |
      def c_to_f(celsius):
          return celsius * 9 / 5 + 32


      def f_to_c(fahrenheit):
