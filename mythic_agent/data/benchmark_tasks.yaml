  solution_files:
  - path: docs/api.md
    content: |
      # Shapes API

      Small geometry helpers. All functions take numbers and return
      numbers; all areas are in square units of whatever you pass in.

      ## area_circle(radius)

      Computes the area of a circle from its `radius`.
      Returns pi * radius ** 2 as a float.

      ## area_rectangle(width, height)

      Computes the area of a rectangle from its `width` and `height`.
      Returns width * height.

      ## area_triangle(base, height)

      Computes the area of a triangle from its `base` and `height`.
      Returns base * height / 2.

      ## Example

      ```python
      from shapes import area_circle, area_rectangle, area_triangle

      print(area_circle(1))          # 3.14159...
      print(area_rectangle(3, 4))    # 12
      print(area_triangle(3, 4))     # 6.0
      ```
