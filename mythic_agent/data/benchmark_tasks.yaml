- id: B-20
  title: Write the usage guide for the todo CLI
  category: docs
  difficulty: medium
  prompt: 'todo.py implements a tiny command-line todo tool with add, list, and done commands, but nobody
    can discover them. Write docs/usage.md: an introduction, one section per command with a fenced shell
    example for each, and a note that tasks are kept in memory only.'
  seed_files:
  - path: todo.py
    content: |
      import sys

      TASKS = []


      def main(argv):
          if not argv:
              print("usage: todo.py add|list|done <...>")
              return 2
          command = argv[0]
          if command == "add":
              TASKS.append({"title": " ".join(argv[1:]), "done": False})
              print("added")
              return 0
          if command == "list":
              for i, task in enumerate(TASKS):
                  mark = "x" if task["done"] else " "
                  print(f"{i}: [{mark}] {task['title']}")
              return 0
          if command == "done":
              TASKS[int(argv[1])]["done"] = True
              print("done")
              return 0
          print("unknown command")
          return 2


      if __name__ == "__main__":
          sys.exit(main(sys.argv[1:]))
  solution_files:
  - path: docs/usage.md
    content: |
      # Todo CLI usage guide

      `todo.py` is a tiny command-line todo tool. It understands three
      commands - add, list, and done - and keeps its tasks in memory
      only: when the process exits, the list is gone.

      ## Add a task

      ```sh
      python todo.py add buy milk
      ```

      Prints "added" and remembers the task as not done.

      ## List tasks

      ```sh
      python todo.py list
      ```

      Prints one line per task: its number, a checkbox ("[x]" for done,
      "[ ]" for open), and its title.

      ## Mark a task done

      ```sh
      python todo.py done 0
      ```

      Marks the task with the given number (as shown by list) as done
      and prints "done".

      ## Notes

      Tasks live in memory only, inside the running process; nothing is
      written to disk.
