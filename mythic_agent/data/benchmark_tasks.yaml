- id: B-16
  title: Write the missing tests for the simple queue
  category: test-writing
  difficulty: medium
  prompt: 'simplequeue.py ships with a single starter test. Write a real suite in tests/test_simplequeue.py:
    at least six test functions covering FIFO order, peek not removing, size and is_empty transitions,
    and that dequeue/peek on an empty queue raise IndexError. Do not change simplequeue.py.'
  seed_files:
  - path: simplequeue.py
    content: |
      class SimpleQueue:
          def __init__(self):
              self._items = []

          def enqueue(self, item):
              self._items.append(item)

          def dequeue(self):
              if not self._items:
                  raise IndexError("dequeue from empty queue")
              return self._items.pop(0)

          def peek(self):
              if not self._items:
                  raise IndexError("peek at empty queue")
              return self._items[0]

          def is_empty(self):
              return not self._items

          def size(self):
              return len(self._items)
  - path: tests/test_simplequeue.py
    content: |
      from simplequeue import SimpleQueue


      def test_new_queue_is_empty():
          assert SimpleQueue().is_empty()
  solution_files:
  - path: tests/test_simplequeue.py
    content: |
      import pytest

      from simplequeue import SimpleQueue


      def test_new_queue_is_empty():
          queue = SimpleQueue()
          assert queue.is_empty()
          assert queue.size() == 0


      def test_enqueue_makes_it_non_empty():
          queue = SimpleQueue()
          queue.enqueue("a")
          assert not queue.is_empty()
          assert queue.size() == 1


      def test_fifo_order():
          queue = SimpleQueue()
          for item in ("first", "second", "third"):
              queue.enqueue(item)
          assert queue.dequeue() == "first"
          assert queue.dequeue() == "second"
          assert queue.dequeue() == "third"


      def test_peek_does_not_remove():
          queue = SimpleQueue()
          queue.enqueue("x")
          assert queue.peek() == "x"
          assert queue.size() == 1


      def test_dequeue_from_empty_raises():
          with pytest.raises(IndexError):
              SimpleQueue().dequeue()


      def test_peek_at_empty_raises():
          with pytest.raises(IndexError):
              SimpleQueue().peek()


      def test_size_tracks_operations():
          queue = SimpleQueue()
          queue.enqueue(1)
          queue.enqueue(2)
          queue.dequeue()
          assert queue.size() == 1
  grading_tests: |
