  - path: README.md
    content: |
      # greeter

      A tiny library for friendly salutations. It greets people by name
      and bids them farewell, with no dependencies and no configuration:
      you pass a name in, you get a salutation back.

      ## Usage

      ```python
      from greeter import farewell, greet

      print(greet("Ada"))       # Hello, Ada!
      print(farewell("Ada"))    # Goodbye, Ada.
      ```

      ## API

      ### greet(name)

      Returns the string "Hello, <name>!" for the given name.

      ### farewell(name)

      Returns the string "Goodbye, <name>." for the given name.

      Both functions take exactly one argument, the person's name as a
      string, and neither has side effects: nothing is printed, stored,
      or sent anywhere.
