schema: mythic.model_capabilities/1
capabilities_slice: M-027
source_note: 'Capability truth per model (All-Features roadmap slice M-027): context size, tool use, vision,
  reasoning, and max output, stored per model and shown before selection, never guessed -- unknown is
  recorded as null and rendered as the word ''unknown''. One record exists for every distinct model listed
  in the M-019 provider registry (mythic_agent/data/provider_registry.yaml); a model listed by several
  providers carries all of them in its providers list. Known context sizes and the tool_calling / vision
  / streaming / json_mode flags come only from the static model registry (mythic_agent.providers.model_registry
  lookup()) for models that registry knows. Provider-level capabilities from the provider registry are
  deliberately NOT inherited: a provider door''s flags describe the door, not each model behind it, and
  per-model truth is the whole point of this file. reasoning is true only where in-tree evidence names
  the model (deepseek-reasoner, per mythic_agent.providers.reasoning); every other model''s reasoning
  is unknown. max_output_tokens is unknown for every model here: no documented per-model max-output value
  exists anywhere in the tree, and no vendor number is invented. Local placeholder names stand for whatever
  model a local server was launched with, so every capability of a placeholder is unknown. This file is
  generated by the M-027 generator script from the live registries, not hand-typed.'
