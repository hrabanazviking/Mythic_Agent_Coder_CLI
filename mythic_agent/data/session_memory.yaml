schema: mythic.session_memory/1
slice: M-153
part: 7
part_title: Memory & Context
canon_note: |
  Session memory across days: resumable sessions
  carry their memory map, open slices, and standing
  decisions - --resume restores the situation, not
  just the transcript. A session memory book holds
  one situation per resumable session, in held
  order: each situation names the stored session it
  belongs to, the workspace it lives in, the day it
  was saved, its stored status, and the count of
  transcript messages it also held - counted, never
  carried, so the situation is never the transcript.
  Its memory is the shipped project memory map's
  entries carried across the days, its open slices
  are the roadmap work standing open when the day
  ended, and its standing decisions are the settled
  words the next day stands under. The PANEL is
  derived from a situation: its rows are the pieces
  carried whole, memory first in map order, then
  open slices in roadmap order, then standing
  decisions by title, and its totals are the pieces'
  own counts, and a stored panel that disagrees
  with its derived shape is refused. This file is
  ONE EXAMPLE BOOK, in the shape a real book file
  takes: the M-152 slice boundary - one session
  paused at the end of its day with the graph
  retrieval landed, three facts of the map carried,
  the next two roadmap slices standing open, and
  two standing decisions, with the one panel of the
  book. A real book is a new file in this same
  shape - it is never this file edited in place.
  This layer holds situations as data only: it
  calls no model, attaches or resumes no live
  session, assembles no live context and persists
  nothing.
