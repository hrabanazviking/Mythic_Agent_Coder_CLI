    kind: lesson
    title: "Commit before the answer is read"
    detail: "Under WAL with synchronous=FULL, a handler that answers from inside its with db() block answers before the commit is visible to other connections, so a fast client using a just-issued credential races its own grant and gets refused."
    source_work: samtal-gatekeeper
  - state: declined
    candidate_id: candidate-bank-incrementally
    kind: pattern
    title: "Bank incrementally, verify the remote moved"
    detail: "Each slice banks with an explicit-refspec push and an ls-remote check that the remote HEAD moved; the ship slice is then an audit with behind_by=0, not a merge event."
    source_work: aesir-wave
  total_items: 3
  total_promoted: 1
  total_candidate: 1
  total_declined: 1
  total_quarantined: 0
  state_counts:
  - state: promoted
    items: 1
  - state: candidate
    items: 1
  - state: declined
    items: 1
  account:
  - "The ledger panel holds 3 candidates: promoted 1, candidate 1, declined 1, quarantined 0."
  - "Candidates stand promoted first, then candidate, then declined, then quarantined; within a state, by source work, then candidate title - so two panels of one book diff cleanly, line by line."
  - "A candidate stands as a standing memory only through an explicit promotion by the human or a named standing rule, and it stands there with its provenance whole - where it was learned, in what context, and on what evidence."
  - "The panel is read off the book at call time - it is derived, never stored loose."
