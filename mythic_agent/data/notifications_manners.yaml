schema: mythic.notifications_manners/1
slice: M-181
part: 8
part_title: The Beautiful Face
canon_note: >
  Notifications with Manners - long jobs announce completion (terminal
  bell/OS notification, once), failures announce once with the one
  action that matters; silence is the default posture. A job is held
  whole - its outcome (running, completed or failed), how long it ran,
  the bell and OS backends it names, and the one failure action a
  failure carries - and whether it announces is derived from its
  outcome and duration: the morning build ran long and announces once
  through the OS road, the quick check ran short and stands silent
  under the default posture, and the night export failed and announces
  once with its one action, though the OS backend it names stands
  unknown, so its channel stands honestly unknown and nothing is
  delivered by invention. A channel is held whole - its name and the
  backend it names - and the manners rules themselves are held as
  data in the closed rule set. Availability - available, unavailable
  by a named reason, or honestly unknown - is derived from the
  backends a record names, never stored and never faked. No row of
  the M-171 TUI redesign charter names M-181, so the slice is built
  to the roadmap words alone, as M-177, M-179 and M-180 were. This
  file is ONE EXAMPLE BOOK, in the shape a real manners file takes -
  the M-180 slice boundary - seven items, two views, and the one
  pinned panel of the every-kind view, whose shown items stand five
  whole of seven, so the book verdict under it stands strained; under
  the job view, whose three shown jobs stand two whole, the verdict
  stands strained too. A real book is a new file in this same shape -
  it is never this file edited in place. This layer holds manners as
  data and reaches live roads only through seams - it rings no bell
  and posts no notification in tests.
