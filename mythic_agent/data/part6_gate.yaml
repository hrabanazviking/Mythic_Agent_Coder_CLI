schema: mythic.part6_gate/1
gate_slice: M-146
part: 6
part_title: The Crew
verdict: PASS
gate_note: |
  The Part VI gate: a six-slice feature built by a three-member crew in
  parallel worktrees - merged clean, Auditor-approved, cost ledger
  complete. The feature is the crew machinery itself, in six slices
  (M-124 parallel worktrees, M-125 task dealing, M-126 crew comms,
  M-128 merge discipline, M-133 crew memory, M-140 cost court), dealt
  by the shipped M-125 dealer to three members of the shipped M-121
  casting (forge_worker, architect, scribe - two slices each, every
  deal an office fit), each member building in its own worktree on its
  own branch under the shipped M-124 discipline (two waves of three
  assignments, the coordinator polymath holding no worktree and
  merging every step), every merge recorded under the shipped M-128
  discipline with a passed test gate and a green outcome - the judge
  derives no verdict and every line completes, so the merge is clean.
  The Auditor (M-130) approves: one case per feature slice, each
  carrying the two required checks (suite-green, banking-order-kept),
  every result passed - the derived report is clean and every gate
  state passed. The Scribe's cost ledger (M-140) is complete: one
  priced run record for every dealt member-and-slice pair, the ledger
  derived from the records with its totals closing exactly. Every
  step is re-proven live by the gate tests on every run through the
  shipped pure roads (load_casting, deal_tasks, WorktreePlan /
  merge_plan_for, MergeDiscipline's judge, AuditorLedger's report,
  cost court's derive_ledger over the shared rate table) - no step is
  faked or stubbed, no live crew is spawned, no git command is run
  and no model is called; the campaign tree is never the exercise
  repo, and the exercise is the record's own crew-shaped evidence,
  judged by the shipped judges themselves.
