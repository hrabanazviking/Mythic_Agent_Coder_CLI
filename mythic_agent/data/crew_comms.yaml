  recipient: forge_worker
  kind: findings
  slice_id: M-126
  title: Comms shape mapped
  body: "The crew holds no structured hand-off record yet: findings, diffs and questions pass in prose, so nothing can be checked, counted or batched."
- sender: forge_worker
  recipient: auditor
  kind: diff
  slice_id: M-126
  title: Hand-off record diff
  body: "crew_comms holds every hand-off as validated data - sender, recipient, kind, slice, title and body - and refuses unknown keys instead of guessing."
- sender: scribe
  recipient: human
  kind: question
  slice_id: M-126
  title: Board or screen first
  body: "When the Part VIII board exists, should the batched human questions appear there too, or stay on this slice's own screen until then?"
- sender: auditor
  recipient: human
  kind: question
  slice_id: M-125
  title: Re-deal record kept
  body: "When a slice is re-dealt, should the record keep the first dealing beside the new one, or only the dealing the slice finally holds?"
- sender: guardian
  recipient: human
  kind: question
  slice_id: M-126
  title: Largest question batch
  body: "Is there a largest batch of member questions to ask the human at once, or is every waiting question asked together, however many wait?"
- sender: auditor
  recipient: scribe
  kind: findings
  slice_id: M-126
  title: Batching rule checked
  body: "Three members hold questions for the human in this ledger; the batch gathers all three and asks them once, each with its sender, slice and body."
