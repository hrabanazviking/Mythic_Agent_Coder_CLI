schema: mythic.crew_comms/1
slice: M-126
part: 6
part_title: Agents as files
keeper: coordinator
ledger_note: |
  Crew comms: the hand-offs between members, as data.
  A hand-off is structured - a sender member, a
  recipient member (or the human), a kind (findings,
  a diff, or a question), the slice it belongs to, a
  title and a body - so the traffic between members
  can be checked, counted and shown, never passed as
  prose alone. This file is ONE EXAMPLE LEDGER in the
  shape a real ledger's file takes: six hand-offs
  among the shipped M-121 casting, three of them
  questions to the human from three different
  members. A real ledger is a new file in this same
  shape - it is never this file edited in place. The
  batching rule is the heart of the shape: a member's
  question to the human is batched and asked once,
  with full context - the three questions in this
  ledger are ONE ask, not three. The roadmap names
  the board (Part VIII) as where crew traffic will
  be visible; that board does not exist yet, so these
  hand-offs and the one batched ask are visible
  through this slice's own /comms screen, and nothing
  here claims a board exists. This layer holds
  hand-offs as data only: it spawns no crew and
  delivers no message itself.
handoffs:
