replacements:
- id: R-01
  dependency: scipy
  candidate: stdlib wave module (wave + array/struct for 16-bit PCM)
  verdict: stdlib-win
  rationale: scipy's only use in the package is scipy.io.wavfile.write in core/audio.py, writing int16
    PCM WAV — exactly what the stdlib wave module writes. Dropping scipy removes the heaviest measured
    dependency (109315 KiB installed) from the voice extra for one small module. The win is real; doing
    the swap is a later voice-slimming slice, not this census.
- id: R-02
  dependency: requests
  candidate: httpx — already a core dependency (via the httpx2/httpx fallback pair)
  verdict: already-core-win
  rationale: requests is a second, parallel HTTP stack (with its own urllib3/certifi chain) declared only
    in the knowledge and voice extras, while httpx is already core. Porting its few call sites (agents/tools.py,
    core/audio.py, core/tts.py) to the existing httpx path removes a whole duplicate stack from those
    extras. The win is real; the port is a later slice, not this census.
- id: R-03
  dependency: pydub
  candidate: stdlib wave module
  verdict: no-real-win
  rationale: pydub's two uses decode TTS responses from the MOSS and NovelAI backends, which may be compressed
    (mp3/opus) — pydub reaches ffmpeg for that. The stdlib wave module reads only uncompressed WAV, so
    it cannot do the whole job; claiming the swap would break those backends. Keep pydub.
- id: R-04
  dependency: filelock
  candidate: stdlib fcntl / msvcrt locking
  verdict: no-real-win
  rationale: The stdlib lock primitives are platform-split (fcntl on POSIX, msvcrt on Windows) with different
    semantics; filelock is one light (1195 KiB), cross-platform implementation guarding config, journal,
    and session state. Rewriting four call sites to save 1.2 MB trades correctness risk for nothing.
- id: R-05
  dependency: pyyaml
  candidate: stdlib tomllib / json
  verdict: no-real-win
  rationale: 'There is no YAML parser in the standard library: tomllib reads TOML and json reads JSON,
    neither reads the config, policy, and data YAML this package ships everywhere. PyYAML (3082 KiB, MIT)
    stays.'
- id: R-06
  dependency: httpx
  candidate: drop httpx and keep only httpx2 (or the reverse)
  verdict: no-real-win
  rationale: 'The pair is deliberate, not accidental: openai 3.x installs its fork httpx2, plain httpx
    is the fallback where only it exists, and the dependency audit test enforces the try-httpx2/except-httpx
    shape at every site. Removing either side breaks one of those environments.'
- id: R-07
  dependency: numpy
  candidate: stdlib math for the vector store's cosine similarity
  verdict: no-real-win
  rationale: The vector store's cosine is one numpy use, but audio recording/playback (core/audio.py,
    core/tts.py) is built on numpy arrays end to end — removing the vector use alone drops nothing. Numpy
    stays while the voice extra exists.
