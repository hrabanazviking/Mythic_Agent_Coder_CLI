schema: mythic.dependency_census/1
slice: M-012
censused: '2026-10-31'
scope_note: 'Every unique requirement declared in pyproject.toml — the 7 core dependencies, every optional
  extra (anthropic, google, tui, mcp, context, knowledge, voice, voice-cloning, dev), and the hatchling
  build backend — counted once, with every group that declares it. Transitive dependencies are out of
  scope and named so here: they are the declared dependencies'' own business (openai alone pulls httpx2''s
  chain), and the census weighs what this project chooses, not what its choices pull in. Installed sizes
  were measured in the baseline venv on this VM (files listed by importlib.metadata, stat-summed, pyc
  caches included as installed); the six dependencies that venv does not install carry measured_kb 0 and
  weight ''unmeasured'' — unknown is recorded as unknown, never guessed. Licences are the installed distributions''
  metadata, or PyPI metadata for the uninstalled six.'
