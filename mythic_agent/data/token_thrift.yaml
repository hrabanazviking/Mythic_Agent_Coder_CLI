schema: mythic.token_thrift/1
slice: M-160
part: 7
part_title: Memory & Context
canon_note: |
  Token thrift: diff-first reading, map-first
  loading, and hash-anchored edits measured as a
  cost line in mythic costs - thrift is a reported
  virtue. A thrift record is one read, load or edit
  taken by a thrift road, carried with its
  provenance whole: what was read, loaded or
  edited, the road used, the reference it stands
  under, the baseline tokens the plain road would
  have cost against the actual tokens it cost, who
  recorded it, the day it was recorded on, and
  where it was read from. One thing is counted once
  per road in a book: the same road and reference
  named twice refuses. The THRIFT PANEL is derived
  from the whole book: its rows are the records
  carried whole, by road - diff-first reading
  first, then map-first loading, then hash-anchored
  edits - then by subject, then record id, and its
  totals are the records' own sums and its road
  counts the records' own tallies, and a stored
  panel that disagrees with its derived shape is
  refused. The THRIFT COST LINE prices the panel's
  totals through the shared rate table - the line
  mythic costs reports. This file is ONE EXAMPLE
  BOOK, in the shape a real book file takes: the
  M-159 slice boundary - four records standing at
  the close of the pinning-and-protection day, a
  diff-first read of the pinning module, a map-first
  load of the session context, a hash-anchored edit
  of the /pins wiring and a diff-first read of the
  pinning tests, with the one panel of the book. A
  real book is a new file in this same shape - it
  is never this file edited in place. This layer
  holds thrift as data only: it reads no files
  itself, edits no code, calls no model, intercepts
  no live read and persists nothing - a record
  declares a measured saving, it does not itself
  change what any live road spends.
