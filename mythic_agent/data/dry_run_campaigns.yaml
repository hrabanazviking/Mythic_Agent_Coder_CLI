  account:
  - 'The rehearsal book holds 5 rehearsals as of 2026-11-11: the view ''all'' shows 5 of them: complete
    3, open 2; 3 of the shown rehearsals stand complete.'
  - Rows stand in held order, the order the book itself stands in, so two panels of one view diff cleanly,
    segment by segment.
  - Every segment is derived from its rehearsal's own fields - the campaign it answers for, the steps
    it walked in the open and the evidence it honestly carries - and no judgement is stored on any rehearsal.
  - 'Completeness is gated from the held records alone: a rehearsal that steps outside the rehearsal sequence,
    carries a bare claim in place of held evidence, or has not planned proven stands open, named in its
    gaps, and the rehearsal index is derived from the held rehearsals, never stored where it could drift.'
