  account:
  - 'The costs book holds 6 lines as of 2026-11-10: the view ''all'' shows 6 of them: counted 5, unknown
    1; 5 of the shown lines stand counted.'
  - Rows stand in held order, the order the book itself stands in, so two panels of one view diff cleanly,
    segment by segment.
  - Every segment is derived from its line's own fields - the label, the scope, the amount and period
    honestly held and the M-107 budget it stands under - and no judgement is stored on any line.
  - 'Spend is judged from the held records alone: a line naming no amount stands unknown, a line naming
    no budget stands unheld, and the costs index is derived from the held lines, never stored where it
    could drift.'
canon_note: 'Costs face - live spend per session and per slice, with the honesty rule kept (unknown =
  unknown) and budgets from M-107 as gentle warnings before walls. A line is held whole - under its label,
  its scope in the closed vocabulary (session, slice), its amount and its period held honestly (an unknown
  amount stands empty, never invented), the M-107 budget it stands under, named as data, and its detail.
  A line naming no budget is held honestly with an empty budget: it stands unheld, named in its gaps,
  and no budget is invented for it. The costs index is DERIVED at call time from the held lines alone
  - never a second stored copy that could drift - and a stored index or counting verdict on any record
  refuses by name. The gentle warnings are held as data: a warning record naming its subject, its level
  (gentle, near or over) and the threshold it stands at; one record stands per subject level, and holding
  a warning enforces no budget, blocks nothing and charges nothing. A record claiming a budget was enforced
  or blocked, or that spend was actually charged, refuses by name. This file is ONE EXAMPLE BOOK, in the
  shape a real costs file takes - the M-189 slice boundary - six lines and two views, two warning records,
  with its one pinned panel of the every-line view, whose shown lines stand five counted of six, so the
  book verdict under it stands strained; under the counted view, whose five shown lines all stand counted,
  the verdict stands open. A real book is a new file in this same shape - it is never this file edited
  in place. This layer charges nothing, enforces no budget, blocks nothing and opens no network: it holds
  the costs as data and tells it.'
