schema: mythic.plain_language_skin/1
slice: M-182
part: 8
part_title: The Beautiful Face
canon_note: >
  The Plain-Language Skin - a Jarl mode register: reports,
  approvals, and stand-ups in plain everyday words, technical
  detail folded behind a keypress. A report, an approval ask and
  a stand-up are each held whole - the report under its title
  with its technical lines and the one next step it names, the
  approval under its title with its ask, its context lines and
  exactly the one action that matters, the stand-up under its
  person's name with what they have done, what they are doing
  and what stands blocked - and each renders two ways from the
  SAME held fields: plain everyday words in Jarl mode, derived
  line by line through the book's plain-words lexicon, and the
  full technical words in the technical register, with the
  technical lines standing folded as data in Jarl mode, unfolded
  whole by the one named unfold action and never deleted. The
  lexicon itself is held as data: six terms stand in it, and the
  book watches seven - quorum stands watched with no lexicon
  entry, so it is the one honest miss: it passes through every
  rendering unchanged, stands named in the misses of the three
  items that speak it, and keeps those three from standing
  whole. No plain words are invented for it. The register is
  derived from session or config state at call time, never
  stored on any item: Jarl mode stands default. Two rows of the
  M-171 TUI redesign charter name M-182 - the setup wizard
  (S-02, plain words first with themed names kept as subtitles)
  and the subagent editor panel (S-07, the panel's words go
  plain first) - and this slice is the register both rows call
  for, built to the roadmap words. This file is ONE EXAMPLE
  BOOK, in the shape a real skin file takes - the M-181 slice
  boundary - twelve items, two views, and the one pinned panel
  of the every-kind view, whose shown items stand nine whole of
  twelve, so the book verdict under it stands strained; under
  the report view, whose two shown reports stand one whole, the
  verdict stands strained too. A real book is a new file in
  this same shape - it is never this file edited in place.
  This layer renders words only: it approves nothing and sends
  nothing.
