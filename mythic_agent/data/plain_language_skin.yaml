  account:
  - 'The plain-language book holds 12 items as of 2026-11-09: the view ''all'' shows 12 of them: report 2, approval 2, standup 2, term 6; 9 of the shown items stand whole.'
  - Rows stand in held order, the order the book itself stands in, so two panels of one view diff cleanly, segment by segment.
  - Every segment is derived from its item's own fields and the book's lexicon - the plain line from the technical line through the lexicon alone - and no judgement is stored on any item.
  - 'Jarl mode speaks plain everyday words and folds the technical detail behind the unfold keypress; the technical register folds nothing. A watched term with no lexicon entry is a miss: it passes through
    unchanged, stands named, and keeps its item from standing whole.'
