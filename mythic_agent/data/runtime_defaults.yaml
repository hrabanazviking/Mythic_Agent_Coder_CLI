# Operational budgets are configurable; transcripts are never truncated here.
# Context compiler (slices 051-060): opt-in workspace context assembly for
# the model prompt (repo instructions, @-mentions, semantic/symbol/dependency
# file selection, git-diff hunks). Off by default; enabling changes prompts.
context_compiler_enabled: false
request_timeout: 120.0
max_retries: 2
retry_delay: 0.5
retry_delay_cap: 8.0
max_tool_rounds: 64
max_tokens: 127000
edit_lock_timeout: 20.0
command_timeout: 300.0
github_timeout: 30.0
approval_timeout: 300.0
process_kill_grace: 1.0
cancellation_poll_interval: 0.05
