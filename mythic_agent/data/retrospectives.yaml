  account:
  - 'The retro book holds 5 retros as of 2026-11-10: the view ''all'' shows 5 of them: complete 3, open
    2; 3 of the shown retros stand complete.'
  - Rows stand in held order, the order the book itself stands in, so two panels of one view diff cleanly,
    segment by segment.
  - Every segment is derived from its retro's own fields - the slice it answers for, the steps it walked
    in the open and the evidence it honestly carries - and no judgement is stored on any retro.
  - 'Completeness is written from the held records alone: a retro that steps outside the retro sequence,
    carries a bare claim in place of held evidence, or has not reached filed stands open, named in its
    gaps, and the retro index is derived from the held retros, never stored where it could drift.'
