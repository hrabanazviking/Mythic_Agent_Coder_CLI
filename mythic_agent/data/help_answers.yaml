schema: mythic.help_answers/1
slice: M-186
part: 8
part_title: The Beautiful Face
canon_note: 'Help that answers - `?` anywhere gives help for that screen; a question box ("how do I undo a commit?")
  answered from the local docs by the coder itself. A screen help entry is held whole - under the screen it stands
  for in the closed vocabulary (chat, terminal, editor, review, settings, onboarding, lessons, command palace),
  its title and its detail; one entry stands per screen, and a screen holding no entry stands honestly uncovered,
  named in the book gaps - no generic help is invented for it and no other screen help is borrowed. A local doc
  is held whole - under its title, its topic in the closed vocabulary, its standing, current or stale, its detail,
  which is the answer text itself, and its keywords. The question box answers ONLY from these held docs: a question
  matching a current doc is answered from that doc own words, a question matching only a stale doc stands unanswered
  and named stale in its gaps, and a question matching no held doc stands honestly unanswered, named in its gaps.
  Answers are derived at call time and never stored, and no live road stands behind one: a record claiming a live
  search, a network lookup or a model answer refuses by name. This file is ONE EXAMPLE BOOK, in the shape a real
  help file takes - the M-185 slice boundary - six docs and two views, four screen helps, with its one pinned panel
  of the every-doc view, whose shown docs stand five current of six, so the book verdict under it stands strained;
  under the current view, whose five shown docs all stand current, the verdict stands open. A real book is a new
  file in this same shape - it is never this file edited in place. This layer searches nothing live, calls no model,
  opens no network and writes nothing: it holds help as data and tells it.'
