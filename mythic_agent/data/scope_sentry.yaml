  - 'The sentry book holds 5 sentries as of 2026-11-10: the view ''all'' shows 5 of them: complete 3,
    open 2; 3 of the shown sentries stand complete.'
  - Rows stand in held order, the order the book itself stands in, so two panels of one view diff cleanly,
    segment by segment.
  - Every segment is derived from its sentry's own fields - the slice it answers for, the steps it walked
    in the open and the evidence it honestly carries - and no judgement is stored on any sentry.
  - 'Completeness is judged from the held records alone: a sentry that steps outside the sentry sequence,
    carries a bare claim in place of held evidence, or has not reached reported stands open, named in
    its gaps, and the sentry index is derived from the held sentries, never stored where it could drift.'
