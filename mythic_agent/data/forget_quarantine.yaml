schema: mythic.forget_quarantine/1
slice: M-157
part: 7
part_title: Memory & Context
canon_note: |
  Forget and quarantine: any memory can be inspected,
  edited, or forgotten on the user's word, and the
  forgetting itself is journaled - what class of thing,
  never its content. A forget entry is one act carried
  with the class of memory it names (a shipped holding's
  own name), the reference the thing stood under, the
  word the act was done on, the day, and where the memory
  stood, standing forgotten, quarantined or restored. A
  restored entry answers a quarantined entry for the same
  memory: what was forgotten is gone, and what was never
  quarantined cannot be restored. The FORGET PANEL is
  derived from the whole book: its rows are the entries
  carried whole, forgotten first, then quarantined, then
  restored, and its totals are the entries' own counts,
  and a stored panel that disagrees with its derived
  shape is refused. This file is ONE EXAMPLE BOOK, in the
  shape a real book file takes: the M-156 slice boundary -
  four acts standing at the close of the decision-records
  day, two memories forgotten, one held apart in
  quarantine and then stood again on the user's word, with
  the one panel of the book. No entry in this book - or in
  any book of this shape - carries a forgotten thing's
  title, detail or words. A real book is a new file in
  this same shape - it is never this file edited in place.
  This layer journals acts of forgetting as data only: it
  calls no model, mutates no live memory in any holding
  and persists nothing.
