schema: mythic.settings_room/1
slice: M-196
part: 8
part_title: The Beautiful Face
canon_note: 'Settings as one room - every setting in one searchable screen, each with its plain-language
  meaning and its current source (default/project/user/session) shown. The M-171 charter names this slice
  on TWO rows: S-02, the setup wizard (verdict rebuild, co-owned with M-184 and M-182), and S-05, the
  GitHub config modal (verdict keep, sole owner M-196; the card folds into the one room unchanged in shape,
  its unnamed-overwrite and unexplained-save-failure strains repaired there). A setting is held whole
  - under its name, its section in the closed vocabulary (model, keys, display, behaviour, privacy), its
  current value and its current source layer in the closed vocabulary (default, project, user, session)
  held honestly (an unknown value stands empty, never invented), the plain-language meaning it carries,
  named as data, and its detail. A setting naming no plain meaning is held honestly with an empty meaning:
  it stands incomplete, named in its gaps, and no meaning is invented for it. The settings index is DERIVED
  at call time from the held settings alone - never a second stored copy that could drift - and a stored
  index or completeness verdict on any record refuses by name. The notes are held as data: a note record
  naming its setting, its stance (note, concern, praise or question) and what it feeds back toward; one
  record stands per setting stance, and holding a note applies none of it. A record claiming a setting
  was actually changed, applied or saved, or that a config was actually written, refuses by name. This
  file is ONE EXAMPLE BOOK, in the shape a real settings file takes - the M-195 slice boundary - six settings
  and two views, two note records, with its one pinned panel of the every-setting view, whose shown settings
  stand five ready of six, so the book verdict under it stands strained; under the ready view, whose five
  shown settings all stand ready, the verdict stands open. A real book is a new file in this same shape
  - it is never this file edited in place. This layer changes nothing, applies nothing, saves nothing,
  writes no config and opens no network: it holds the settings as data and tells it.'
settings_room:
  title: Settings as one room at the M-195 slice boundary
