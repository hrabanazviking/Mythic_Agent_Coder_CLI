part_title: The Beautiful Face
canon_note: 'Diff theatre final form (with M-091) - the review screen a user would choose to read code in: folding,
  intra-line colour, jump-to-file, comment-on-hunk feeding back to the coder. A hunk is held whole - under its file,
  its kind in the closed vocabulary (added, removed, changed, mixed), its added and removed counts held honestly
  (an unknown count stands empty, never invented), the jump target that reaches it, named as data, and its detail.
  A hunk naming no jump target is held honestly with an empty target: it stands untargeted, named in its gaps, and
  no target is invented for it. The review index is DERIVED at call time from the held hunks alone - never a second
  stored copy that could drift - and a stored index or targetedness verdict on any record refuses by name. The comments
  are held as data: a comment record naming its hunk, its stance (note, concern, praise or question) and what it
  feeds back toward; one record stands per hunk stance, and holding a comment posts none of it. A record claiming
  a jump was actually taken, a hunk actually applied or a comment actually posted refuses by name. This file is
  ONE EXAMPLE BOOK, in the shape a real review file takes - the M-190 slice boundary - six hunks and two views,
  two comment records, with its one pinned panel of the every-hunk view, whose shown hunks stand five targeted of
  six, so the book verdict under it stands strained; under the targeted view, whose five shown hunks all stand targeted,
  the verdict stands open. A real book is a new file in this same shape - it is never this file edited in place.
  This layer jumps to no file, applies no hunk, posts no comment and opens no network: it holds the final form as
  data and tells it.'
