schema: mythic.session_gallery/1
slice: M-189
part: 8
part_title: The Beautiful Face
canon_note: 'Session gallery - past sessions as browsable cards (task, outcome, cost, duration) with resume/fork/export
  - history as a library, not a log file. A card is held whole - under its task, its outcome in the closed vocabulary
  (completed, failed, stopped, abandoned), its cost and its duration held honestly (an unknown cost or duration
  stands empty, never invented), the resume road that reaches it, named as data, and its detail. A card naming no
  resume road is held honestly with an empty road: it stands unresumable, named in its gaps, and no road is invented
  for it. The gallery index is DERIVED at call time from the held cards alone - never a second stored copy that
  could drift - and a stored index or resumability verdict on any record refuses by name. The action roads are held
  as data: an action record naming its session, its action (resume, fork or export) and the target the road stands
  toward; one record stands per session road, and holding a road resumes, forks and exports nothing. A record claiming
  a session actually resumed, forked or exported refuses by name. This file is ONE EXAMPLE BOOK, in the shape a
  real gallery file takes - the M-188 slice boundary - six cards and two views, two action records, with its one
  pinned panel of the every-session view, whose shown cards stand five resumable of six, so the book verdict under
  it stands strained; under the resumable view, whose five shown cards all stand resumable, the verdict stands open.
  A real book is a new file in this same shape - it is never this file edited in place. This layer resumes no session,
  forks nothing, exports nothing and opens no network: it holds the gallery as data and tells it.'
