  - path: pricing.py
    content: |
      def price_with_tax(amount):
          return amount * 1.2


      def legacy_discount(amount):
          return amount * 0.9


      TOTAL = price_with_tax(100)
      SALE = legacy_discount(TOTAL)
  - path: shop.py
    content: |
      from pricing import legacy_discount, price_with_tax


      def checkout(amount):
          return legacy_discount(price_with_tax(amount))
  - path: .gitignore
    content: |
      __pycache__/
      .pytest_cache/
      test_grading.py
  diff_payload: |
    --- a/pricing.py
    +++ b/pricing.py
    @@ -1,2 +1,2 @@
     def price_with_tax(amount):
    -    return amount * 1.2
    +    return amount * 1.25
    @@ -5,2 +5,2 @@
    -def legacy_discount(amount):
    +def apply_discount(amount):
         return amount * 0.9
    @@ -9,2 +9,2 @@
     TOTAL = price_with_tax(100)
    -SALE = legacy_discount(TOTAL)
    +SALE = apply_discount(TOTAL)
  search_payload: |
    <<<<<<< SEARCH
    from pricing import legacy_discount, price_with_tax
    =======
    from pricing import apply_discount, price_with_tax
    >>>>>>> REPLACE
    <<<<<<< SEARCH
        return legacy_discount(price_with_tax(amount))
    =======
        return apply_discount(price_with_tax(amount))
    >>>>>>> REPLACE
  grading_file:
    path: test_grading.py
    content: |
      import pricing
      import shop
      from pricing import SALE, TOTAL, apply_discount, price_with_tax


      def test_renamed_discount_works():
          assert apply_discount(100) == 90.0
          assert not hasattr(pricing, "legacy_discount")


      def test_rejected_hunk_never_landed():
          assert price_with_tax(100) == 120.0
          assert TOTAL == 120.0
          assert SALE == 108.0


      def test_checkout_uses_the_renamed_discount():
          assert shop.checkout(100) == 108.0
  grading_tests: 3
