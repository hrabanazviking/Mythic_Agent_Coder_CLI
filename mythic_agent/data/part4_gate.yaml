  evidence: |
    legacy_discount renamed to apply_discount across pricing.py and shop.py in a
    throwaway git repo on branch feature/refactor, with 2 attempted applies and 0
    failed: pricing.py edited through a 3-hunk unified diff that passed through
    M-074 hunk review first (the definition rename and the SALE call accepted; the
