  - 'The acceptance book holds 5 audits as of 2026-11-10: the view ''all'' shows 5 of them: green 3, red
    2; 3 of the shown audits stand green.'
  - Rows stand in held order, the order the book itself stands in, so two panels of one view diff cleanly,
    segment by segment.
  - Every segment is derived from its audit's own fields - the slice it audits, the checks it walked in
    the open and the claims it honestly carries - and no judgement is stored on any audit.
  - 'Greenness is judged from the held records alone: a audit that steps outside the gate sequence, asks
    a claim the Auditor can answer, or has not reached continue stands red, named in its gaps, and the
    acceptance index is derived from the held audits, never stored where it could drift.'
