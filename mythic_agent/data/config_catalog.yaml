schema: mythic.config_catalog/1
slice: M-009
catalogued: '2026-10-30'
scope_note: 'Every setting in config_defaults.yaml and runtime_defaults.yaml, every key in CONFIG_SCHEMA
  (including config-managed keys), every environment variable named literally in the mythic_agent package,
  and every file the configuration system reads or writes. Packaging files (pyproject.toml) and session/journal
  stores (M-010''s road) are out of scope and named so here, not silently omitted. This catalogue is the
  compatibility contract for Part VIII''s settings redesign: no entry may be dropped or renamed without
  a migration.'
settings:
- id: S-01
  name: config_version
  scope: top-level
  type: int
  default: '3'
  source: mythic_agent/data/config_defaults.yaml
  effect: Schema version of the config file; older files are upgraded in memory on load.
- id: S-02
  name: model
  scope: top-level
  type: str
  default: deepseek-chat
  source: mythic_agent/data/config_defaults.yaml
  effect: Default model name sent to the provider endpoint.
- id: S-03
  name: base_url
  scope: top-level
  type: str
  default: https://api.deepseek.com/v1
  source: mythic_agent/data/config_defaults.yaml
  effect: Default provider endpoint URL (must be a valid http(s) URL).
- id: S-04
  name: api_keys
  scope: top-level
  type: dict
  default: '{}'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Per-endpoint stored API keys, keyed by base URL. Since M-032 a value may be a Kista reference (kista:<name>) instead of a secret: providers resolve the reference through Kista (vault file, then environment), the config holding only the reference; legacy plaintext values keep working until adopted into Kista with /kista adopt.'
- id: S-05
  name: working_directory
  scope: top-level
  type: str
  default: (empty string)
  source: mythic_agent/data/config_defaults.yaml
  effect: Workspace directory the agent operates in.
- id: S-06
  name: user_name
  scope: top-level
  type: str
  default: (empty string)
  source: mythic_agent/data/config_defaults.yaml
  effect: The user's name, woven into the system prompt when set.
- id: S-07
  name: user_data
  scope: top-level
  type: str
  default: (empty string)
  source: mythic_agent/data/config_defaults.yaml
  effect: Free-text facts about the user, woven into the system prompt when set.
- id: S-08
  name: global_rules
  scope: top-level
  type: str
  default: (empty string)
  source: mythic_agent/data/config_defaults.yaml
  effect: Standing rules appended to the system prompt as GLOBAL RULES when set.
- id: S-09
  name: vector_db_provider
  scope: top-level
  type: str
  default: lightweight
  source: mythic_agent/data/config_defaults.yaml
  effect: Knowledge/vector store provider selection (default lightweight).
- id: S-10
  name: mythic_engineering_mode
  scope: top-level
  type: bool
  default: 'False'
  source: mythic_agent/data/config_defaults.yaml
  effect: Turns the Mythic Engineering method on in prompts and the TUI.
- id: S-11
  name: auto_accept_permissions
  scope: top-level
  type: bool
  default: 'False'
  source: mythic_agent/data/config_defaults.yaml
  effect: When true, the policy layer auto-accepts permissions instead of asking.
- id: S-12
  name: permission_mode
  scope: top-level
  type: str
  default: ask
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Interactive permission posture: read-only, ask, or trusted.'
- id: S-13
  name: machine_permission_mode
  scope: top-level
  type: str
  default: read-only
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Machine-level permission posture (env-overridable): read-only, ask, or trusted.'
- id: S-14
  name: streaming
  scope: top-level
  type: bool
  default: 'False'
  source: mythic_agent/data/config_defaults.yaml
  effect: Streams provider responses token by token when true.
- id: S-15
  name: runtime
  scope: top-level
  type: dict
  default: '{}'
  source: mythic_agent/data/config_defaults.yaml
  effect: Nested block of operational budgets; see the runtime-scope settings.
- id: S-16
  name: github
  scope: top-level
  type: dict
  default: mapping (see nested settings)
  source: mythic_agent/data/config_defaults.yaml
  effect: Nested GitHub block; see github.repo_url and github.token.
- id: S-17
  name: github.repo_url
  scope: github
  type: str
  default: (empty string)
  source: mythic_agent/data/config_defaults.yaml
  effect: Repository URL used by the GitHub integration.
- id: S-18
  name: github.token
  scope: github
  type: str
  default: (empty string)
  source: mythic_agent/data/config_defaults.yaml
  effect: Token for the GitHub integration; a secret — Kista-bound in Part VIII.
- id: S-19
  name: context_compiler_enabled
  scope: runtime
  type: bool
  default: 'False'
  source: mythic_agent/data/runtime_defaults.yaml
  effect: 'Runtime: opt-in workspace context assembly for prompts; off by default because enabling changes
    prompts.'
- id: S-20
  name: request_timeout
  scope: runtime
  type: float
  default: '120.0'
  source: mythic_agent/data/runtime_defaults.yaml
  effect: 'Runtime: per-request timeout in seconds.'
- id: S-21
  name: max_retries
  scope: runtime
  type: int
  default: '2'
  source: mythic_agent/data/runtime_defaults.yaml
  effect: 'Runtime: maximum provider request retries.'
- id: S-22
  name: retry_delay
  scope: runtime
  type: float
  default: '0.5'
  source: mythic_agent/data/runtime_defaults.yaml
  effect: 'Runtime: base delay between retries in seconds.'
- id: S-23
  name: retry_delay_cap
  scope: runtime
  type: float
  default: '8.0'
  source: mythic_agent/data/runtime_defaults.yaml
  effect: 'Runtime: cap on the retry delay in seconds.'
- id: S-24
  name: max_tool_rounds
  scope: runtime
  type: int
  default: '64'
  source: mythic_agent/data/runtime_defaults.yaml
  effect: 'Runtime: maximum tool rounds in one turn.'
- id: S-25
  name: max_tokens
  scope: runtime
  type: int
  default: '127000'
  source: mythic_agent/data/runtime_defaults.yaml
  effect: 'Runtime: token budget ceiling for a turn.'
- id: S-26
  name: edit_lock_timeout
  scope: runtime
  type: float
  default: '20.0'
  source: mythic_agent/data/runtime_defaults.yaml
  effect: 'Runtime: file-lock timeout in seconds for edits and config saves.'
- id: S-27
  name: command_timeout
  scope: runtime
  type: float
  default: '300.0'
  source: mythic_agent/data/runtime_defaults.yaml
  effect: 'Runtime: shell command timeout in seconds.'
- id: S-28
  name: github_timeout
  scope: runtime
  type: float
  default: '30.0'
  source: mythic_agent/data/runtime_defaults.yaml
  effect: 'Runtime: GitHub request timeout in seconds.'
- id: S-29
  name: approval_timeout
  scope: runtime
  type: float
  default: '300.0'
  source: mythic_agent/data/runtime_defaults.yaml
  effect: 'Runtime: how long an approval request waits in seconds.'
- id: S-30
  name: process_kill_grace
  scope: runtime
  type: float
  default: '1.0'
  source: mythic_agent/data/runtime_defaults.yaml
  effect: 'Runtime: grace period in seconds before a process is force-killed.'
- id: S-31
  name: cancellation_poll_interval
  scope: runtime
  type: float
  default: '0.05'
  source: mythic_agent/data/runtime_defaults.yaml
  effect: 'Runtime: interval in seconds between cancellation checks.'
- id: S-32
  name: sub_agents
  scope: managed
  type: list
  default: '[]'
  source: mythic_agent/core/config_manager.py (CONFIG_SCHEMA)
  effect: Named sub-agent definitions (name + prompt); managed by the config system, absent from the defaults
    file.
- id: S-33
  name: recovery
  scope: managed
  type: dict
  default: '{}'
  source: mythic_agent/core/config_manager.py (CONFIG_SCHEMA)
  effect: Quarantine for invalid values found on load; managed by the config system, never user-edited
    by hand.
- id: S-34
  name: system_prompt
  scope: managed
  type: str
  default: None
  source: mythic_agent/core/config_manager.py (CONFIG_SCHEMA)
  effect: Custom system prompt override; managed key, absent from the defaults file.
- id: S-35
  name: primary_name
  scope: managed
  type: str
  default: None
  source: mythic_agent/core/config_manager.py (CONFIG_SCHEMA)
  effect: Primary (user/agent) name override; managed key, absent from the defaults file.
- id: S-36
  name: role_routes
  scope: top-level
  type: dict
  default: '{}'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Per-office model routes (M-029): office id to {model, base_url}; an office with no route uses the session default model/base_url.'
- id: S-37
  name: fallback_chain
  scope: top-level
  type: list
  default: '[]'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Ordered fallback doors (M-030): a list of {model, base_url} entries the session walks, in this order, when a provider fails or rate-limits and standing permission is on.'
- id: S-38
  name: fallback_permission
  scope: top-level
  type: bool
  default: 'False'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Standing permission for fallback walks (M-030): when true, a failed provider request walks fallback_chain with every walk announced and journaled; when false, failures are reported and the chain is never walked.'
- id: S-39
  name: cost_routing
  scope: top-level
  type: bool
  default: 'False'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Cost-aware routing (M-031): when true, the router may prefer the cheapest adequate door among the configured doors (current door, fallback chain, role routes) for a task class, priced by the mythic costs data with adequacy from per-model capability truth; when false, the router changes nothing.'
- id: S-40
  name: repo_map_pins
  scope: top-level
  type: list
  default: '[]'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Pinned repo-map files (M-045): workspace-relative paths the user pinned with /map pin; a pinned file is shown first when the repo map is browsed, with its rank and score unchanged, and a pinned file the map build left out is explained (over the budget, skipped, or absent), never invented as an entry.'
- id: S-41
  name: edit_truth_loop
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Edit-time truth loop (M-052): when true, every agent edit (write_file / replace_file_content) is rechecked — house review, language-server diagnostics where a server truly runs, the project linter where one is truly configured — and new error-severity findings the edit introduced are appended to the tool result in the same turn; when false, edits are not rechecked.'
- id: S-42
  name: formatter_covenant
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Formatter covenant (M-053): when true, the formatter road is open — the project''s own configured formatter (black/ruff/isort/yapf, named by its own config and installed) may be previewed on files an edit touched and applied only on explicit request through the edit journal, with format diffs shown separately from logic diffs; when false, the formatter road refuses plainly and nothing is formatted.'
- id: S-43
  name: debugger
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'The Debugger (M-054): when true, the debugger road is open — a program may be run under a catalogued debug adapter (debugpy for Python first, the DAP-general client) with breakpoints, exception stops, stepping, and variable inspection reported exactly as the adapter reports them; when false, a debug run refuses plainly and no adapter is launched.'
- id: S-44
  name: debugger_in_loop
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Debugger in the loop (M-055): when true, a failing test — named on the /debugloop road or detected from a pytest run_command result''s own FAILED lines — may be re-run under the M-054 debugger as a pytest module launch with exception stops on, its frames and locals appended as evidence; when false, no test is re-run under the debugger. The debugger switch (S-43) gates this road too.'
- id: S-45
  name: test_intelligence
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Test intelligence (M-056): when true, the test-intelligence road is open — tests are discovered by pytest collection itself, a change''s tests are selected from the symbol graph with an honest whole-suite fallback, pytest run_command outcomes the runner names are recorded to the project history (.mythic/test_history.jsonl), and flaky marks are computed only from that recorded history; when false, no discovery, selection, or recording happens on that road.'
- id: S-46
  name: coverage_sight
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Coverage sight (M-057): when true, the coverage road is open — line coverage from coverage.py''s own data (its JSON report, else its .coverage data file) is overlaid on edited files, and a touched file whose measured lines never ran is flagged to the Auditor as a coverage.zero_cover entry in the workspace audit log (.mythic/audit.jsonl); when false, no coverage data is read and no flags are written on that road.'
- id: S-47
  name: local_search
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Beyond-grep local search (M-058): when true, the local search road is open — one /search surface with an in-process ripgrep-class text mode (regex over every text file, no external binary), a fuzzy subsequence mode, and a structural mode delegated to the M-047 engine, with results ranked by the M-046 symbol graph and every result carrying its score and reasons; when false, nothing is searched on that road.'
- id: S-48
  name: web_tools
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Web knowledge tools (M-059): when true, the web road is open — /web search sends a user-typed query to the configured web_search_endpoint and /web fetch reads one user-named http(s) page, with results numbered as citations and cited into the session journal when a session is attached; calls are user-initiated only, never background; when false, nothing is sent anywhere on that road.'
- id: S-49
  name: web_search_endpoint
  scope: top-level
  type: str
  default: https://html.duckduckgo.com/html/?q={query}
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Web knowledge tools (M-059): the search endpoint template /web search sends its query to; the template must carry a {query} placeholder or the search is refused before anything is sent. The shipped default is DuckDuckGo''s keyless HTML road — no API key is required or stored for search.'
- id: S-50
  name: docs_at_hand
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Docs-at-hand (M-060): when true, the docs road is open — /docs list shows the offline shelf (the project''s root and docs/ doc files plus any doc packs under .mythic/docpacks/), /docs search ranks the shelf by title, heading and body matches with snippets and line numbers, and /docs read shows one doc by shelf path, file name or title; the road is fully offline, no file outside the shelf is read and nothing is fetched; when false, no doc file is read on that road.'
- id: S-51
  name: dependency_sight
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Dependency sight (M-061): when true, the deps road is open — /deps shows the declared dependency graph from pyproject.toml (groups, specs, and the honestly measured installed version, unknown when a package is not installed), /deps <package> adds that package''s blast radius (workspace files importing it, counted by an AST import scan), its local changelog mentions, and its local vulnerability-data state, and /deps propose <package> <version> drafts an upgrade proposal as data with its blast radius and pin state; changelogs and vulnerability data are read only from files in the workspace — with no local vulnerability data the status is NOT PROVEN, never a clean bill — a proposal is never applied and no file is changed on this road; when false, no project file is read on that road.'
- id: S-52
  name: code_sensing
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Code sensing (M-062): when true, the sensing road is open — /sensing shows a structural report for the Cartographer: dead code sensed by the shipped dead-code scanner over the workspace''s top-level Python packages (with the dead-code quarantine state named where its file exists) and duplication clusters of function bodies whose AST structure is identical once names and literal values are normalised away, at or above a named size floor so trivial shapes never count; sensing only — nothing is deleted or edited on this road, and deletion is always a separate, approved slice; when false, no project file is read on that road.'
- id: S-53
  name: type_depth
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Type depth (M-063): when true, the types road is open — /types shows the standing type account from the project''s type checkers (mypy and pyright, whichever truly exist), their findings parsed from their own output contracts and triaged by kind into the review, plus the annotation-coverage account from the type-coverage neighbour where its package exists; after an edit on the write/replace tool road, type findings are diffed line-blind against the before-content account and only new error-severity findings (broke-here) return in the same turn for the coder to fix, pre-existing findings counted never charged; a checker that is not installed reports not-installed — a live type verdict without a checker is NOT PROVEN, never a clean bill; when false, no project file is read on that road and no type note rides an edit.'
- id: S-54
  name: mojo_sight
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Mojo sight (M-064): when true, the mojo road is open — /mojo scans the workspace''s Mojo files (recognised through the tree-sitter foundation''s catalogue by their .mojo extension; parsed via the foundation''s tree-sitter grammar where one truly loads — no Mojo grammar package exists today, so files are read by the honestly named mojo-scan structural backend and a grammar-backed parse is NOT PROVEN), reading definitions, imports and decorators and flagging syntax the latest Mojo removed with its replacement from the house Mojo skills; /mojo knowledge searches the distilled house-skill knowledge wired into the module, whose full texts and the official Mojo docs are named external references, never copied in; read-only — nothing is edited on this road; when false, no project file is read on that road.'
- id: S-55
  name: sql_sight
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'SQL sight (M-065): when true, the sql road is open — /sql shows the schemas of the workspace''s SQLite databases (.db / .sqlite / .sqlite3 files only), every one opened through a read-only (mode=ro) connection: tables, views, columns, indexes, foreign keys and exact row counts read from sqlite_master and the PRAGMA introspection roads; /sql explain <db> <query> runs EXPLAIN / EXPLAIN QUERY PLAN for a SELECT-shaped query on that read-only connection — the query is explained, never executed, and write-shaped statements are refused outright, never run; /sql migrations reads migration files as code (SQL under a migrations/ or alembic-style versions/ directory, numbered SQL files, alembic .py revisions): version/order, up/down sections, and the tables each section creates, alters or drops — migrations are read, never applied; when false, no project file is read on that road.'
- id: S-56
  name: config_sight
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Config sight (M-066): when true, the config road is open — /config parses the workspace''s config and infra files structurally (YAML via PyYAML, TOML via stdlib tomllib, systemd units and INI files via a tolerant parser that keeps repeated directives, Dockerfiles via a line parser, compose files as YAML): top-level keys with kinds and sizes, total keys and depth, unit sections and directives, Dockerfile stages, base images, instruction counts, ports and env keys, compose services — structure only, scalar values are never echoed, and nothing a file describes is ever executed or applied; Docker artifacts (Dockerfile*, *.dockerfile, docker-compose / compose YAML) found in a workspace detected as one of Volmarr''s projects (root marker files AGENTS.md, SOUL.md, MEMORY.md, RULES.AI.md, or any root file whose name carries Volmarr, or an explicit ruling) raise the coder''s own no-Docker-law warning — no Docker, ever, on his projects; Docker artifacts without a marker are listed with the warning honestly withheld; when false, no project file is read on that road.'
- id: S-57
  name: asset_sight
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Binary and asset sight (M-067): when true, the assets road is open — /assets describes the workspace''s images from their headers only (PNG, GIF, JPEG, BMP, WebP, ICO, TIFF dimensions and format facts from a bounded header read, SVG from its declared size or viewBox; nothing is decoded), its archives from their member listings (zip and tar listed through the stdlib readers with the listing capped and named, a plain gzip stream from its header name and trailer size, 7z and RAR described from magic with the listing honestly unavailable; nothing is extracted), and its large files (at or over 1000000 bytes) by size and sniffed kind, a large text file''s lines counted by streaming with the content never retained; every asset carries the role the map notes for it, inferred from its kind and path by named rules (test fixture, documentation asset, data file, backup or snapshot archive, project asset) with the rule recorded as evidence; when false, no project file is read on that road.'
- id: S-58
  name: language_packs
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Language packs (M-068): when true, the langpacks road is open — /langpacks show reports every language pack''s declared toolchain (one pack per language in the M-043 tree-sitter catalogue, declared in mythic_agent/data/language_packs.yaml: its language server with its stdio command, its formatters, and its test runners), each declared binary carrying a live installed check from PATH alone (shutil.which on the command''s first word), and /langpacks <language> reports just that pack, an unknown language refused plainly naming the packed languages; the servers are the live LSP catalogue''s servers for every language but Mojo, whose pack honestly declares no server, the Python pack''s formatters are the format covenant''s live candidates and its runner is test intelligence''s pytest, while the other languages'' formatters and runners are declared pack data with no live consumer yet, as each pack''s notes say; nothing is executed on this road — commands are described and PATH-checked, never run; when false, the pack data is not even loaded on that road.'
- id: S-59
  name: intelligence_cache
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Intelligence cache (M-069): when true, the intelcache road is open — parse, graph, and language-server results are cached per file under the workspace''s .mythic/intelligence-cache/, every entry keyed by kind, workspace-relative path, the file''s SHA-256 content hash, and producer name, written atomically with persisted hit, miss, and stale-eviction counters; a lookup recomputes the file''s current hash, so a changed file evicts its stale entry and misses — a stale result is never served — and a missing file, a corrupt entry, and a producer mismatch are likewise misses; the parse producer is the M-043 foundation''s parse and the graph producer is M-046''s per-file extraction, both honouring the symbol graph''s 262144-byte per-file cap, while language-server payloads are stored and looked up only, their producer being the live M-049/M-050 server road, never faked here; /intelcache show reports entries and counters, /intelcache <file> reports one file''s per-kind state against its current hash, /intelcache warm fills parse and graph for the workspace''s catalogued source files with caps and skips named, and /intelcache clear removes every entry and reports the count; warming writes cache entries only, never a source file; when false, nothing is read or written on that road.'

- id: S-60
  name: edit_format
  scope: top-level
  type: str
  default: auto
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Edit-format plurality (M-071): how the coder changes a file — auto (the default) picks per task and per model strength from M-027 capability truth (whole-file, unified-diff, search-and-replace blocks, or an Aider-style architect/editor split for complex work; a model of unknown strength always gets the safest whole-file format, and creating a file is always whole-file); any of the four format names pins that format exactly, except that a pinned format never creates a file. Unified diffs apply only when every hunk context matches the file exactly and search blocks only when the search text matches exactly once — no fuzz, a stale target refuses and writes nothing. /editformat shows the formats and the picks, pins or unpins the setting, and asks for a pick for a kind of work; every pick is recorded as an edit_format_chosen session journal event with its plain-words reason, and applied edits ride the existing EditJournal road.'

- id: S-61
  name: hash_anchored_edits
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Hash-anchored edits (M-072): when true, the hashanchor road is open — every line of a file carries a SHA-256 content anchor (shown as its first 12 hex digits) and a range of lines anchors as the hash of its exact lines joined by newlines, the per-line form of the M-069 content-hash road; an anchored edit names the lines it touches by 1-based range (or by a search block that must match exactly once) plus the anchor it saw, the applier recomputes the anchor from the file''s true current text, and the edit applies only on an exact match — a moved or changed target refuses cleanly, names the expected and current anchors, and changes nothing, no fuzz ever (the refusal report is the whole answer; the bounded retry with the true text is M-073''s road); applied edits ride the existing EditJournal road and are recorded as hash_anchored_applied session events. /hashanchor shows the gate and a file in anchored form, and turns the gate on or off (journaled, with a save-failure revert); when false, anchored applies through the agent refuse and say so, while the pure anchor maths stays readable.'

- id: S-62
  name: apply_repair_loop
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Apply-failure repair loop (M-073): when true, a refused apply through the agent — an M-071 format refusal (a stale unified diff, a search block matching zero or several times) or an M-072 anchored refusal (a moved range, a wrongly-anchored block) — becomes a repair packet carrying the road, the refusal''s own reason, and the true current text of the refused target (a bounded window: the target''s lines plus 5 lines of context on each side, capped at 40 lines, with the truncation and the file''s true line count named whenever the window is not the whole file), and exactly one honest retry may ride on that packet, judged by the same strict appliers — no fuzz, ever; a second refusal exhausts the loop, names the budget spent, and changes nothing, and a spent packet refuses any further retry. The refusal is recorded as an apply_repair_offered session event with its packet, a repaired apply rides the existing EditJournal road and is recorded as apply_repair_applied, and an exhausted loop as apply_repair_exhausted; with no retry supplied the agent returns the packet and writes nothing. /repairloop shows the gate and the loop in plain words, and turns the gate on or off (journaled, with a save-failure revert); when false, applies keep the plain M-071/M-072 refusal and no packet is made, while the pure packet maths stays readable.'

- id: S-63
  name: hunk_review
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Hunk-level review (M-074): when true, the hunkreview road is open — a unified diff is split into its hunks as data and each hunk is accepted, rejected, or edited on its own; rejecting one hunk never kills the rest, the accepted and edited hunks are judged by the unchanged M-071 strict applier (every hunk context must match the file exactly, no fuzz ever) and written through the existing EditJournal road, and rejected hunks simply never land. An edit may change what a hunk becomes, never what it matches — its context and removed lines stay exactly as proposed, and the edited hunk is re-judged by the same strict rules before it applies. Every hunk must be decided before anything applies: a pending hunk refuses the apply and is named, and a review whose hunks are all rejected is recorded as an honest no-change outcome. The whole review is recorded as a hunk_review_applied session event with each hunk decision and the accepted, edited, and rejected counts. /hunkreview shows the gate and a worked accept/reject/edit example, and turns the gate on or off (journaled, with a save-failure revert); when false, reviewed applies through the agent refuse and say so, while the pure review maths stays readable.'

- id: S-64
  name: checkpoints
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Named checkpoints (M-075): when true, the checkpoint road is open — a checkpoint captures the whole working tree plus the current session state under a name the user chooses, held in a manifest over a content-addressed blob store beside the EditJournal home; checkpoints form a tree, each new one hanging from the head it was taken under, and restoring an older checkpoint and taking a new one from there grows a branch. Restore brings the tree and the session back in one command and judges a dirty tree honestly: if the tree changed since the last checkpoint was taken or restored, restore refuses and names the changed files — take a checkpoint of the current tree first, or restore with discard to throw those changes away on purpose and count them. Session state returns only to the session it was captured from. Takes and restores are recorded as checkpoint_created and checkpoint_restored session events, and the journal shows the whole checkpoint tree. /checkpoint shows the tree and turns the gate on or off; when false, takes and restores through the agent refuse and say so, while the pure checkpoint maths stays readable.'

- id: S-65
  name: session_branching
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Session branching (M-076): when true, the /branch road is open — a session forks at any message into a new v1 session sharing the parent''s history up to and including the fork message, lineage (parent, fork index and role, root, depth) recorded in the branch''s metadata, the fork journaled session_branched on the child and session_branch_forked on the parent; branches diverge independently and any two sessions can be compared by shared prefix and first divergence. When false, forks through the agent refuse and say so, while comparing and listing stay available.'

- id: S-66
  name: undo_timeline
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Undo grown up (M-077): when true, /undo walks edits, commands, and checkpoints as one timeline, newest first — an edit undoes through the EditJournal, a command undoes through its recorded footprint (the files it created, changed, or deleted, judged from snapshots taken around its run through the agent run_command tool, before-contents backed up within the snapshot bounds), labelled certain when the snapshots were complete and every changed file is backed up or best-effort with its reasons otherwise; one file changed since the command refuses the whole undo; checkpoints join through the CheckpointTimelineSource seam (M-075), wired at banking to M-075''s own checkpoints through the agent seam adapter. /undo list shows the timeline and the gate, /undo on/off changes it (journaled, with a save-failure revert); when false, /undo keeps its original last-edit behaviour and timeline undos refuse.'
- id: S-67
  name: auto_commit
  scope: top-level
  type: bool
  default: 'False'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Auto-commit discipline (M-078): when true, every accepted edit set lands as its own commit with a written message naming the files it carries — one edit set, one commit, staged with exactly the accepted files through Agent.commit_accepted_edits and recorded as an auto_commit_committed session event. On a protected branch the commit moves onto the working branch unless the standing protected word is given; a blank message, an empty or escaping file set, or a detached head refuses and commits nothing. /autocommit shows the discipline and turns it on or off (journaled, with a save-failure revert); when false, accepted edits are not committed by this road.'

- id: S-68
  name: auto_commit_allow_protected
  scope: top-level
  type: bool
  default: 'False'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Auto-commit discipline (M-078): the standing word for protected branches. When true, an accepted edit set may be committed directly onto a protected branch (main, master, development, develop, plus the names in auto_commit_protected) and the commit is recorded as on-protected; when false (the default), the commit moves onto the working branch instead and a protected branch is never committed to. /autocommit allow-protected and block-protected give or withdraw the word (journaled auto_commit_protected_setting_changed, with a save-failure revert).'

- id: S-69
  name: auto_commit_branch
  scope: top-level
  type: str
  default: mythic/working
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Auto-commit discipline (M-078): the working branch an accepted edit set is committed to when the current branch is protected and the standing protected word has not been given. The branch is created on demand from the current head; the default is mythic/working. Read by the pure plan in mythic_agent/core/auto_commit.py (plan_commit) on every commit; a blank or malformed stored value raises rather than being silently replaced.'

- id: S-70
  name: auto_commit_protected
  scope: top-level
  type: list
  default: '[main, master, development, develop]'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Auto-commit discipline (M-078): the branch names treated as protected by the auto-commit road — the shipped set is main, master, development, develop, and the user may name more. A commit planned on one of these branches moves onto the working branch unless the standing protected word (auto_commit_allow_protected) is given. Judged by exact branch name in the pure plan; a detached head is never a protected branch and refuses instead.'

- id: S-71
  name: guardian_explicit_word
  scope: top-level
  type: bool
  default: 'False'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'README and licence guardians (M-079): the user''s explicit word for guarded files. The guardians are always on and live in the edit layer (EditJournal): a whole-file overwrite of an existing README refuses on every edit road, as does deleting one, while modifying a README in place, creating a README, and overwriting a barely-anything stub README (<=5 non-empty lines, <=200 characters) are allowed; licence files (LICENSE, LICENCE, COPYING, NOTICE, any extension or suffix) refuse every touch. False (default - never presumed) refuses and changes nothing; true records the user''s explicit word and allows the guarded operations, still journaled. A guardian refusal is never a repair-loop packet. /guardians shows the guards, /guardians check <path> judges one path, /guardians word on|off gives or takes back the word (journaled guardian_word_changed, save-failure revert). Undo is restoration, not re-judged.'

- id: S-72
  name: commit_craft
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Commit craft (M-080): when true, the commitcraft road is open — a working-tree change is split into commits by concern (code, tests, docs, config), each message drafted from its own actual diff (verb, file names, and per-file counts read off the diff; every hunk judged by the M-074 hunk layer), one group committed at a time with the index proven to hold exactly that group, and pushes follow the house rules wired in as refusals: fetch first, the remote-diff read before pushing, never force-push (a diverged remote refuses), and ls-remote verification afterwards that the remote moved to the pushed head; an up-to-date remote is an honest no-send. Commit craft never commits on its own — the auto-commit trigger is M-078''s seam (DEPENDS-ON-M-078), reported honestly through it since M-078 banked (before that banking it reported unavailable). /commitcraft shows the gate, a worked split-and-draft example, plans the split, commits one concern group, and pushes under the house rules (journaled, with a save-failure revert); when false, commits and pushes through the agent refuse and say so, while the pure planning maths stays readable.'

- id: S-73
  name: conflict_workbench
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Conflict workbench (M-081): when true, the /conflicts road is open - merge and rebase conflicts are presented as per-region decisions (ours, theirs, both, or an edited resolution), each side carrying an intent summary derived mechanically from the actual commits and stage diffs (side commit subject, author, short sha, and added/removed line counts against the base stage; a deleted side, a missing base, or a missing commit is stated plainly, never invented). Every conflicted place must be decided before anything applies, and resolved text still carrying a conflict marker is refused. A resolution is written through EditJournal, staged, verified against the real index, and journaled as a conflict_resolution_applied session event (journal-first gate changes, save-failure revert). Delete/modify conflicts are detected with their intent summary but carry no marker regions, so they cannot be decided place-by-place in this slice. When false, resolutions through the agent refuse and say so.'

- id: S-74
  name: pr_craft
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'PR craft (M-082): when true, the /prcraft road is open - pull requests are created, reviewed, and responded to from inside Mythic: a pull request is fetched as data through the user''s own gh road and its review comments are fetched and turned into tasks (one task per comment, carrying its author, words, and place; a review with no words makes no task). Drafts (a PR draft, a review draft with approve/comment/request_changes verdicts and line notes riding in the review body, and a reply draft posting as a PR comment) are prepared locally and send nothing. Anything that would send as the user posts only at the user''s recorded word: the draft must be armed with that word before the post road runs at all, an unarmed post refuses and the runner is never touched, and the word itself is never journaled (records carry armed: true only). /prcraft shows the gate and a worked example over a fake runner, /prcraft tasks <n> fetches review comments as tasks; when false, fetches and posts through the agent refuse and say so, while the pure draft maths stays readable.'
- id: S-75
  name: issue_to_slice
  scope: top-level
  type: bool
  default: 'True'
  source: mythic_agent/data/config_defaults.yaml
  effect: 'Issue-to-slice (M-083): when true, the /issueslice road is open - a GitHub issue becomes a planned slice in the house format (title, summary, and status planned) with acceptance checks drafted only from the issue''s own words: task-list items in its body, bullets under an acceptance heading, or, when the body carries neither, the issue''s title itself; every check carries the verbatim excerpt it was drafted from, and a check that cannot be traced to the issue refuses. GitHub fetches go through the user''s own gh road (github.view_issue) over an injectable fetcher seam, so tests fake GitHub completely; the Samverk source is named for Part X (M-242) and refuses honestly until that road provides the surfaces, its internals never invented. Planning files nothing and changes no roadmap: the planned slice is product output, recorded on the session journal as issue_slice_planned. /issueslice shows the gate, the seam''s sources, and a worked sample; /issueslice github <number> plans that issue; when false, planning through the agent refuses and says so, while the pure drafting maths stays readable.'

env_vars:
- id: V-01
  name: MYTHIC_HOME
  kind: state-dir
  effect: Sets the Mythic state directory (default ~/.mythic); read by ConfigManager and the cache.
  secret: false
  source: mythic_agent/core/config_manager.py
- id: V-02
  name: MYTHIC_MODEL
  kind: override
  effect: Overrides the config model at load time.
  secret: false
  source: mythic_agent/core/config_manager.py
- id: V-03
  name: MYTHIC_BASE_URL
  kind: override
  effect: Overrides the config base_url at load time; ignored when not a valid http(s) URL.
  secret: false
  source: mythic_agent/core/config_manager.py
- id: V-04
  name: MYTHIC_WORKSPACE
  kind: override
  effect: Overrides working_directory at load time.
  secret: false
  source: mythic_agent/core/config_manager.py
- id: V-05
  name: MYTHIC_PERMISSION
  kind: override
  effect: Overrides machine_permission_mode at load time; ignored unless read-only, ask, or trusted.
  secret: false
  source: mythic_agent/core/config_manager.py
- id: V-06
  name: MYTHIC_STRICT_CONFIG
  kind: mode
  effect: Enables strict config mode (unknown top-level keys rejected) when 1, true, yes, or on.
  secret: false
  source: mythic_agent/core/config_manager.py
- id: V-07
  name: MYTHIC_API_KEY
  kind: secret
  effect: Presence checked by onboarding as evidence an API key is configured.
  secret: true
  source: mythic_agent/onboarding.py
- id: V-08
  name: MYTHIC_HEADLESS_MODE
  kind: marker
  effect: Set to 1 by the MCP server entry point as a headless marker; no in-package reader was found
    by this census — recorded as written, not read.
  secret: false
  source: mythic_agent/mcp_server.py
- id: V-09
  name: MYTHIC_SANDBOX_NO_NETWORK
  kind: marker
  effect: Set to 1 in a sandboxed child's environment when network is disabled, and named in the sandbox
    status text; not read as an input by the package.
  secret: false
  source: mythic_agent/core/sandbox.py
- id: V-10
  name: ANTHROPIC_API_KEY
  kind: secret
  effect: API key for the Anthropic provider (provider api_key_env).
  secret: true
  source: mythic_agent/providers/anthropic.py
- id: V-11
  name: DEEPSEEK_API_KEY
  kind: secret
  effect: API key for the DeepSeek provider and DeepSeek endpoints.
  secret: true
  source: mythic_agent/providers/deepseek.py
- id: V-12
  name: GOOGLE_API_KEY
  kind: secret
  effect: API key for the Google provider (provider api_key_env).
  secret: true
  source: mythic_agent/providers/google.py
- id: V-13
  name: OPENAI_API_KEY
  kind: secret
  effect: API key for OpenAI and OpenAI-compatible endpoints; also read by audio and the MCP server.
  secret: true
  source: mythic_agent/providers/openai_compat.py
- id: V-14
  name: OPENROUTER_API_KEY
  kind: secret
  effect: API key for the OpenRouter provider.
  secret: true
  source: mythic_agent/ui/screens/splash_screen.py
- id: V-15
  name: PG_KNOWLEDGE_PASSWORD
  kind: secret
  effect: Password for the Postgres knowledge store used by agent tools.
  secret: true
  source: mythic_agent/agents/tools.py
- id: V-16
  name: TMPDIR
  kind: system
  effect: Directory under which transcript spill files are written (falls back to /tmp).
  secret: false
  source: mythic_agent/core/transcript.py
- id: V-17
  name: FIREWORKS_API_KEY
  kind: secret
  effect: API key for the Fireworks gateway provider (provider api_key_env, M-026).
  secret: true
  source: mythic_agent/providers/gateways.py
- id: V-18
  name: GROQ_API_KEY
  kind: secret
  effect: API key for the Groq gateway provider (provider api_key_env, M-026).
  secret: true
  source: mythic_agent/providers/gateways.py
- id: V-19
  name: MISTRAL_API_KEY
  kind: secret
  effect: API key for the Mistral gateway provider (provider api_key_env, M-026).
  secret: true
  source: mythic_agent/providers/gateways.py
- id: V-20
  name: TOGETHER_API_KEY
  kind: secret
  effect: API key for the Together gateway provider (provider api_key_env, M-026).
  secret: true
  source: mythic_agent/providers/gateways.py
- id: V-21
  name: XAI_API_KEY
  kind: secret
  effect: API key for the xAI gateway provider (provider api_key_env, M-026).
  secret: true
  source: mythic_agent/providers/gateways.py
- id: V-22
  name: MYTHIC_KISTA_FILE
  kind: state-dir
  effect: 'Path of Kista''s vault file (M-032): a private JSON mapping of key names to keys that Kista references resolve through first; unset means no vault-file road and references resolve from the environment only.'
  secret: false
  source: mythic_agent/core/key_custody.py
files:
- id: F-01
  name: config_defaults.yaml
  kind: package-data
  path: mythic_agent/data/config_defaults.yaml
  role: Shipped defaults for every top-level config key; the schema and ConfigManager derive from it.
  names: []
- id: F-02
  name: runtime_defaults.yaml
  kind: package-data
  path: mythic_agent/data/runtime_defaults.yaml
  role: Shipped defaults for the nested runtime block; read by runtime_settings and the config schema.
  names: []
- id: F-03
  name: permissions.yaml
  kind: package-data
  path: mythic_agent/data/permissions.yaml
  role: Shipped read-only tool allowlist read by the policy layer.
  names: []
- id: F-04
  name: config.json
  kind: user-config
  path: ~/.mythic/config.json
  role: The primary user config file (directory overridable via MYTHIC_HOME); written only by an explicit
    save, with the lock and recovery rules below.
  names: []
- id: F-05
  name: legacy config
  kind: legacy-user-config
  path: ~/.mythic_config.json
  role: Legacy single-file config, read only when no MYTHIC_HOME/root is configured and the primary file
    is absent.
  names: []
- id: F-06
  name: config.lock
  kind: lock
  path: ~/.mythic/config.lock
  role: File lock guarding config saves (suffix-swapped sibling of config.json).
  names: []
- id: F-07
  name: recovery backups
  kind: recovery
  path: ~/.mythic/config.recovery.<uuid>.bak
  role: Private backup written before a save replaces a config whose bytes would change under upgrade.
  names: []
- id: F-08
  name: status directory
  kind: state-dir
  path: ~/.mythic/status/
  role: State directory created alongside the config by ConfigManager.
  names: []
- id: F-09
  name: agent.log
  kind: log
  path: ~/.mythic/agent.log
  role: Engine log file inside the Mythic state directory.
  names: []
- id: F-10
  name: workspace instruction files
  kind: workspace-instruction
  path: <workspace>/ (per directory)
  role: Instruction files discovered per workspace directory and merged by precedence; the compatibility
    surface Part X's importers must honour.
  names:
  - AGENTS.md
  - CLAUDE.md
  - .mythic.md
  - .mythic
  - .muserules
  - .cursorrules
  - .aider.rules.md
