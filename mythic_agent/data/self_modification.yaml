  account:
  - 'The change book holds 5 changes as of 2026-11-11: the view ''all'' shows 5 of them: complete 3, open 2; 3 of the shown changes stand complete.'
  - Rows stand in held order, the order the book itself stands in, so two panels of one view diff cleanly, segment by segment.
  - Every segment is derived from its change's own fields - the slice it answers for, the steps it walked in the open and the evidence it honestly carries - and no judgement is stored on any change.
  - 'Completeness is guarded from the held records alone: a change that steps outside the change sequence, carries a bare claim in place of held evidence, or has not proposed adopted stands open, named
    in its gaps, and the change index is derived from the held changes, never stored where it could drift.'
