schema: mythic.subconscious_v2/1
slice: M-165
part: 7
part_title: Memory & Context
canon_note: 'The subconscious v2: the dual-layer vector memory gains provenance (where each
  memory came from), confidence, and decay - stale memories fade unless re-earned. A v2 memory
  stands in one of the dual layers, core or subconscious, and carries its provenance whole:
  the shipped piece it came from (its source kind and the piece''s id alone - the piece''s
  own words never cross into the v2 record), the session and day it was earned, who recorded
  it and where it was read from. Its confidence is the trust it was earned with, from 0 to
  1; its decay is a half-life in days and the day it was last earned or re-earned, with its
  re-earn count: the effective confidence halves every half-life since that day, so a memory
  stands fresh, fading, stale or faded as of any named day, and re-earning resets the decay
  clock at exactly the trust it was earned with - it never inflates it. One shipped piece
  is earned once in a book. The SUBCONSCIOUS PANEL is derived from the whole book as of a
  day: its rows are the memories carried whole, by layer, then title, then memory id, each
  with its effective confidence and freshness read off its own decay, and a stored panel that
  disagrees with its derived shape is refused. The FRESHNESS VERDICT is derived for the whole
  book: well-kept when every memory stands fresh, fading when some fade and none stand stale
  or faded, going-stale when any stands stale, and neglected when any has faded away un-re-earned.
  This file is ONE EXAMPLE BOOK, in the shape a real book file takes: the M-164 slice boundary
  - the mythic-agent-coder memory packed at the close of the import/export day, six of its
  pieces earned into v2, three standing fresh in the core layer, one fading, one stale and
  one faded away in the subconscious, with the one panel of the book read as of that day.
  A real book is a new file in this same shape - it is never this file edited in place. This
  layer holds memories as data only: it sends nothing, posts nothing, schedules nothing, calls
  no model, persists nothing and writes no live memory - earning a v2 memory leaves every
  shipped holding exactly as it stood.'
