schema: mythic.handoff_summaries/1
slice: M-163
part: 7
part_title: Memory & Context
canon_note: 'Handoff summaries: ending a session writes where things stand for the next session
  or the next human - the stand-up (M-134) in durable form. A handoff summary is one ended
  session''s standing, carried with its provenance whole: the session it ends, the project
  and branch it stood on, the claims it carries from the stand-up - the entry ids standing
  done, doing, blocked and needs-you, each in one section only - the session and journal evidence
  those claims stand on, who wrote it, the day it was written on, and where it was read from.
  A session ends once: a second handoff naming a held session refuses, and a claim named by
  one handoff never appears in another - a claim is handed off once. A handoff is derived
  from session and journal evidence, and a handoff whose claims disagree with the stand-up
  digest its evidence derives refuses - a handoff states only what its evidence states. The
  HANDOFF PANEL is derived from the whole book: its rows are the handoffs carried whole, by
  project, then day, then branch, then title, then handoff id, and its tallies are the handoffs''
  own counts, and a stored panel that disagrees with its derived shape is refused. The HANDOFF
  VERDICT is derived for the whole book: awaiting-you when any claim needs the human''s word,
  held-up when claims stand blocked and none needs you, standing-clear when neither stands.
  This file is ONE EXAMPLE BOOK, in the shape a real book file takes: the M-162 slice boundary
  - three sessions of the one mythic-agent-coder project handed off at the close of the multi-session
  day, the endurance session on the main line with one claim needing Volmarr''s word, the
  graph session paused with one claim blocked, the thrift session closed clean, each standing
  on the journal entries of its own session from the multi-session book, with the one panel
  of the book. A real book is a new file in this same shape - it is never this file edited
  in place. This layer holds handoffs as data only: it sends nothing, posts nothing, schedules
  nothing, calls no model and persists nothing - a handoff standing in a book is a recorded
  writing, never a claim that anything was sent to the next session or human.'
