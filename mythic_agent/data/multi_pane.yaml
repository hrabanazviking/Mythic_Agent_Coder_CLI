schema: mythic.multi_pane/1
slice: M-192
part: 8
part_title: The Beautiful Face
canon_note: 'Multi-pane working - chat, board, files, and terminal panes in the layouts the field loves, plus the
  Mythic layout (board left, work centre, crew right). A pane is held whole - under its title, its kind in the closed
  vocabulary (chat, board, files, terminal, work, crew), its width and its height held honestly (an unknown width
  or height stands empty, never invented), the target it opens on, named as data, and its detail. A pane naming
  no target is held honestly with an empty target: it stands unanchored, named in its gaps, and no target is invented
  for it. The pane index is DERIVED at call time from the held panes alone - never a second stored copy that could
  drift - and a stored index or anchoredness verdict on any record refuses by name. The notes are held as data:
  a note record naming its pane, its stance (note, concern, praise or question) and what it feeds back toward; one
  record stands per pane stance, and holding a note posts none of it. A record claiming a pane was actually opened,
  focused or resized refuses by name. This file is ONE EXAMPLE BOOK, in the shape a real pane file takes - the M-191
  slice boundary - six panes and two layouts, two note records, with its one pinned panel of the every-pane layout,
  whose shown panes stand five anchored of six, so the book verdict under it stands strained; under the anchored
  layout, whose five shown panes all stand anchored, the verdict stands open. A real book is a new file in this
  same shape - it is never this file edited in place. This layer opens no pane, focuses nothing, resizes nothing
  and opens no network: it holds the working screen as data and tells it.'
