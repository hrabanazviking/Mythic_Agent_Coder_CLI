schema: mythic.slice_board/1
slice: M-173
part: 8
part_title: The Beautiful Face
canon_note: 'The Slice Board: plans and roadmaps as a visible board - every slice a card standing in one
  of four columns, queued, building, verifying or banked, with its provenance whole (the day it was recorded,
  who recorded it, its source and the session it was recorded in). The board line is derived from the
  card''s slice id, title, column and hand flags alone, never chosen, and a card composed from the shipped
  roadmap takes its column from the slice''s own ledger status: done reads banked, queued reads queued.
  What the human does by hand - advance, re-order, pause, resume or strike a slice - is held as its own
  action record, and the effective board, its panel and its verdict are derived by standing the held actions
  on the held cards in recorded order: a hand action moves this board alone, rewrites no shipped roadmap
  data, banks nothing and deletes nothing - a struck slice still stands on the board, struck and seen.
  This file is ONE EXAMPLE BOARD, in the shape a real board file takes: the M-172 slice boundary - seven
  cards of Part VIII, M-171 and M-172 banked, M-173 opened to building by hand, M-176 re-ordered up the
  board, M-175 paused by hand and M-177 struck by hand, with its one pinned panel; the verdict flows.
  A real board is a new file in this same shape - it is never this file edited in place. This layer holds
  plans as data only - it runs no build, banks nothing, sends nothing, posts nothing, schedules nothing,
  calls no model and persists nothing.'
