gate_note: |
  The Part VII gate: a week-old benchmark session resumed - the coder
  states the situation correctly from memory alone, then finishes the
  task; compaction glass-box verified mid-run. The exercise is the
  resumed benchmark itself: a benchmark session recorded on
  2026-11-02 and resumed on 2026-11-09, exactly seven days later,
  holding its whole situation as the shipped M-153 session-memory
  shape (three carried memory-map facts, two pieces of open roadmap
  work, two standing decisions, and a transcript of 58 messages
  counted, never carried). The coder's resumed statement stands claim
  by claim beside the recorded truth - seven claims over seven
  carried pieces, every stated word equal to its truth, every truth
  cross-checked against the situation piece itself. The mid-run
  compaction stands as the shipped M-151 glass-box shape: three
  replaced pieces kept whole, the summary standing as two versions
  (the compaction's own and the mid-run edit), verified at the
  mid-run stage. The resume began from the week-old handoff the
  session ended with, standing over the situation by its references
  alone. The task then finished: its grading line closed at twelve
  of twelve tests passed, from nine at the pause. Every step is
  re-proven live by the gate tests on every run through the shipped
  pure roads (M-153 build_situation and derive_panel, M-151
  build_record, derive_panel and edit_record, M-163
  handoff_from_session_situation, and every memory layer M-150 to
  M-169 standing in its own shipped module under its own slice
  constant) - no step is faked or stubbed, no live session is
  resumed, no model is called and no token is spent by the gate
  itself; the campaign tree is never the exercise repo.
