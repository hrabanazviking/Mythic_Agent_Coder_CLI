  account:
  - 'The juggernaut book holds 5 runs as of 2026-11-10: the view ''all'' shows 5 of them: sound 3, unsound
    2; 3 of the shown runs stand sound.'
  - Rows stand in held order, the order the book itself stands in, so two panels of one view diff cleanly,
    segment by segment.
  - Every segment is derived from its run's own fields - the slice it runs, the phases it walked in the
    open and the questions it honestly carries - and no judgement is stored on any run.
  - 'Soundness is judged from the held records alone: a run that steps outside the state machine, asks
    a question the code can answer, or has not reached continue stands unsound, named in its gaps, and
    the juggernaut index is derived from the held runs, never stored where it could drift.'
