  account:
  - 'The report book holds 5 reports as of 2026-11-11: the view ''all'' shows 5 of them: complete 3, open 2; 3 of the shown reports stand complete.'
  - Rows stand in held order, the order the book itself stands in, so two panels of one view diff cleanly, segment by segment.
  - Every segment is derived from its report's own fields - the slice it answers for, the steps it walked in the open and the evidence it honestly carries - and no judgement is stored on any report.
  - 'Completeness is weighed from the held records alone: a report that steps outside the report sequence, carries a bare claim in place of held evidence, or has not reached reported stands open, named
    in its gaps, and the report index is derived from the held reports, never stored where it could drift.'
