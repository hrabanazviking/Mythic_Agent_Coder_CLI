  account:
  - 'The bug book holds 5 bugs as of 2026-11-10: the view ''all'' shows 5 of them: complete 3, open
    2; 3 of the shown bugs stand complete.'
  - Rows stand in held order, the order the book itself stands in, so two panels of one view diff cleanly,
    segment by segment.
  - Every segment is derived from its bug's own fields - the slice it answers for, the steps it walked
    in the open and the evidence it honestly carries - and no judgement is stored on any bug.
  - 'Completeness is fixed from the held records alone: a bug that steps outside the bug sequence,
    carries a bare claim in place of held evidence, or has not reached closed stands open, named in its
    gaps, and the bug index is derived from the held bugs, never stored where it could drift.'
