[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mythic-agent"
dynamic = ["version"]
description = "A clean, affordable CLI AI coding agent."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40,<4",
    "prompt_toolkit>=3.0",
    "rich>=13.0",
    "filelock>=3.13",
    "pyyaml>=6.0.2",
    "httpx>=0.27",
    "httpx2>=2.13",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
google = ["google-generativeai>=0.8.0"]
tui = [
    "textual>=0.82.7,<9",
    "textual-image>=0.12.0,<0.13;python_version<'3.12'",
    "textual-image>=0.13.2;python_version>='3.12'",
    "pillow>=10.4.0",
    "pyperclip>=1.9"
]
mcp = ["mcp>=1.0.0"]
knowledge = ["psycopg[binary]>=3.0.0", "requests>=2.0.0"]
voice = [
    "sounddevice>=0.5.1",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "piper-tts>=1.2.0",
    "requests>=2.0.0",
    "pydub>=0.25.1"
]
voice-cloning = [
    "chatterbox-tts>=0.1.0",
    "torchaudio>=2.0.0",
    "torch>=2.0.0"
]
dev = ["pytest>=8,<10", "pytest-timeout>=2.4", "build>=1.2", "hatchling>=1.26"]

[project.scripts]
mythic = "mythic_agent.cli:main"
mythic-mcp = "mythic_agent.mcp_server:main"

[tool.hatch.version]
path = "mythic_agent/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["mythic_agent"]

[tool.hatch.build.targets.wheel.force-include]
"default_agent_characters" = "mythic_agent/resources/characters"
"Mythic-Engineering/Mythic-Engineering_SKILL.md" = "mythic_agent/resources/engineering.md"

[tool.hatch.build.targets.sdist]
include = ["mythic_agent/", "default_agent_characters/", "Mythic-Engineering/", "tests/", "docs/", "*.md", "pyproject.toml", "LICENSE", "NOTICE", ".github/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Slice 9 (test suite health): a per-test ceiling so a stalled test fails
# loudly instead of hanging the suite indefinitely. 120s comfortably covers
# the slowest subprocess-driven CLI tests (~35s on a loaded box).
timeout = 120
